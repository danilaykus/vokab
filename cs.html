<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Словник · čeština</title>
<meta name="theme-color" content="#f3f4f7" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Словник CZ" id="meta-apptitle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest-cs-uk.json" id="manifest-link">
<link rel="apple-touch-icon" href="icon-cs-180.png">
<link rel="icon" type="image/png" href="icon-cs-192.png">
<style>
/* Vocabulary app — Czech + English. Layout: slim header (dictionary switch, search, views), sticky topic chips,
   topic cards with bilingual rows (target word | main translation, Ukrainian as a small extra), rule sheets; dialogs; flashcard trainer.
   Phone: bottom dock with Practice / + Word. Theme: device setting, or a fixed light/dark choice. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --ink: #1a2030; --muted: #5f6879; --faint: #8a92a1; --line: #e3e6ec; --chip: #eceff4;
  --note: #fff4c4; --note-ink: #3a3214; --note-line: #e9d98f;
  --m: #1d55b4; --f: #bf2620; --n: #13743b;
  --accent: #11457e; --on-accent: #ffffff; --warn: #9a5b00; --ok: #17703a; --danger: #b3261e;
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --surface: #181c24; --ink: #e8ebf1; --muted: #a2aab8; --faint: #7f8898; --line: #282e39; --chip: #232936;
    --note: #2a2615; --note-ink: #efe5bf; --note-line: #4a4224;
    --m: #8bb6ff; --f: #ff978e; --n: #74d597; --accent: #8bb6ff; --on-accent: #10131a; --warn: #f0b35a; --ok: #74d597; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #181c24; --ink: #e8ebf1; --muted: #a2aab8; --faint: #7f8898; --line: #282e39; --chip: #232936;
  --note: #2a2615; --note-ink: #efe5bf; --note-line: #4a4224;
  --m: #8bb6ff; --f: #ff978e; --n: #74d597; --accent: #8bb6ff; --on-accent: #10131a; --warn: #f0b35a; --ok: #74d597; --danger: #ff8a80;
  color-scheme: dark;
}
body[data-dict="en"] { --accent: #4b3bb0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-dict="en"] { --accent: #b9aef5; } }
:root[data-theme="dark"] body[data-dict="en"] { --accent: #b9aef5; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font-size: 16px; }

/* chooser */
.chooser { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
.ch-inner { width: min(460px, 100%); display: grid; gap: 18px; justify-items: center; text-align: center; }
.ch-logo { border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.chooser h1 { margin: 0; font-family: var(--display); font-size: 40px; line-height: 1; }
.chooser p { margin: 0; color: var(--muted); }
.ch-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.ch-card { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 22px 14px; display: grid; gap: 6px; justify-items: center; cursor: pointer; }
.ch-card b { font-family: var(--display); font-size: 24px; }
.ch-card small { color: var(--muted); }
.ch-k { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #fff; padding: 3px 9px; border-radius: 6px; }
.ch-card.cz .ch-k { background: #11457e; } .ch-card.en .ch-k { background: #4b3bb0; }
.ch-card:active { transform: scale(.98); }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
.row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 22px; }
.brand img { border-radius: 7px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
#dictseg button { letter-spacing: .06em; }
.spacer { flex: 1; }
.dock { display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 13px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; min-height: 36px; }
.btn:hover { background: var(--chip); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { opacity: .92; }
.btn.sm { padding: 4px 10px; font-size: 13px; min-height: 30px; }
.btn.icon { padding: 6px 10px; display: inline-grid; place-items: center; }
.btn.icon svg { width: 18px; height: 18px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .55; cursor: default; }
.stats { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.search input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.row3 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; border-radius: 7px; padding: 5px 10px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tabs small { font-weight: 500; margin-left: 3px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.status { padding: 18px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; background: var(--surface); display: grid; gap: 10px; justify-items: center; }
.viewnote { color: var(--muted); font-size: 13px; margin: 0; }

/* topic chips */
.groups { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.groups .wrap { padding-block: 7px; display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
.groups .wrap::-webkit-scrollbar { display: none; }
.groups a { flex: none; text-decoration: none; color: var(--ink); background: var(--chip); padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.groups a.rules { background: var(--note); color: var(--note-ink); }
.groups a small { color: var(--faint); margin-left: 4px; }

/* topics */
main.wrap { padding-block: 16px 120px; display: grid; gap: 16px; }
#words { display: grid; gap: 16px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; scroll-margin-top: 56px; overflow: hidden; }
.ghead { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; }
.ghead .gt { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.ghead h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; }
.ghead .sub { font-size: 13px; color: var(--faint); }
.ghead .cnt { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.chev { width: 18px; height: 18px; color: var(--faint); transition: transform .15s; flex: none; align-self: center; }
.group.closed .chev { transform: rotate(-90deg); }
.group.closed .wl { display: none; }
.wl { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); column-gap: 30px; padding: 0 14px 4px; }

/* bilingual row */
.w { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 26px; grid-template-areas: "c1 c2 mo" "c3 c3 c3"; column-gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
.c1 { grid-area: c1; min-width: 0; } .c2 { grid-area: c2; min-width: 0; } .c3 { grid-area: c3; min-width: 0; }
.t1 { font-weight: 700; font-size: 17px; line-height: 1.25; }
.t2 { font-size: 15.5px; font-weight: 500; line-height: 1.3; }
.s1, .s2 { font-size: 12.5px; color: var(--muted); line-height: 1.35; margin-top: 1px; }
.tr { color: var(--faint); }
.pl { font-size: 10px; font-weight: 700; color: var(--faint); margin-left: 4px; vertical-align: 2px; }
.c3 { display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: baseline; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.c3:empty { display: none; }
.uaS::before { content: "UA"; font-size: 9.5px; font-weight: 800; letter-spacing: .06em; color: var(--faint); margin-right: 5px; }
body.no-ua .uaS { display: none; }
.nt::before { content: "!"; color: var(--warn); font-weight: 800; margin-right: 4px; }
.expill { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; font-size: 11.5px; font-weight: 600; padding: 1px 9px; cursor: pointer; }
.q { font-size: 10px; font-weight: 700; color: var(--warn); border: 1px dashed var(--warn); border-radius: 4px; padding: 0 4px; margin-left: 5px; vertical-align: 2px; }
.g-m { color: var(--m); } .g-f { color: var(--f); } .g-n { color: var(--n); }
.more { grid-area: mo; align-self: start; border: 0; background: transparent; width: 28px; height: 28px; margin: -3px -4px 0 0; border-radius: 7px; cursor: pointer; color: var(--faint); display: grid; place-items: center; padding: 0; }
.more:hover { background: var(--chip); color: var(--ink); }
.more svg { width: 16px; height: 16px; }
body.selecting .w { padding-left: 28px; }
body.selecting .more, body.selecting .expill { visibility: hidden; }
.sel { position: absolute; left: 0; top: 11px; width: 18px; height: 18px; accent-color: var(--accent); pointer-events: none; }
.w.picked { background: color-mix(in srgb, var(--accent) 8%, transparent); }
/* self-test: the hidden side with its pronunciation, synonyms and notes stays blurred until the row is tapped (tap again to hide) */
body.hide-m .w:not(.shown) .c2, body.hide-m .w:not(.shown) .c3,
body.hide-t .w:not(.shown) .c1, body.hide-t .w:not(.shown) .c3 { filter: blur(7px); user-select: none; pointer-events: none; }

/* menu */
.menu { position: fixed; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 4px; min-width: 200px; display: grid; }
.menu button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 15px; }
.menu button:hover { background: var(--chip); }
.menu button.danger { color: var(--danger); }

/* rule sheets */
.sheets-head { display: grid; gap: 4px; scroll-margin-top: 56px; margin-top: 8px; }
.sheets-head h2 { font-family: var(--display); font-size: 24px; margin: 0; }
.sheets-head p { margin: 0; color: var(--muted); font-size: 14px; }
.sheets { columns: 2 24rem; column-gap: 16px; }
.sheet { break-inside: avoid; background: var(--note); color: var(--note-ink); border: 1px solid var(--note-line); border-radius: 10px; padding: 12px 16px 14px; margin: 0 0 16px; display: grid; gap: 9px; }
.sheet .sbar { display: flex; justify-content: space-between; align-items: center; }
.sheet .no { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; opacity: .7; }
.sheet .x { border: 0; background: transparent; color: var(--note-ink); opacity: .55; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 18px; line-height: 1; }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 19px; line-height: 1.2; }
.sheet p { margin: 0; font-size: 14px; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.sheet .tw { overflow-x: auto; }
.sheet table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.sheet th, .sheet td { text-align: left; vertical-align: top; padding: 5px 8px 5px 0; border-top: 1px solid var(--note-line); }
.sheet th { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; opacity: .75; border-top: 0; }
.sheet .m { color: var(--m); font-weight: 700; } .sheet .f { color: var(--f); font-weight: 700; } .sheet .n { color: var(--n); font-weight: 700; }
.fix { color: var(--f); text-decoration: line-through; }

/* floating bars */
.floatbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 8px 8px 8px 14px; border-radius: 14px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 8px; align-items: center; z-index: 25; width: max-content; max-width: calc(100vw - 24px); box-shadow: 0 8px 26px rgba(0,0,0,.25); font-size: 14px; }
.floatbar button { background: transparent; border: 1px solid color-mix(in srgb, var(--surface) 45%, transparent); color: inherit; border-radius: 8px; padding: 6px 11px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.floatbar button:disabled { opacity: .45; cursor: default; }
.floatbar button.solid { background: var(--surface); color: var(--ink); border-color: var(--surface); }
#toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; }

/* dialogs */
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); padding: 0; width: min(580px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
dialog::backdrop { background: rgba(10, 14, 22, .5); }
.dbody, dialog form { padding: 18px; display: grid; gap: 12px; }
.dtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
dialog h2 { margin: 0; font-family: var(--display); font-size: 22px; }
.xbtn { border: 0; background: var(--chip); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.field { display: grid; gap: 4px; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); width: 100%; font-family: inherit; }
.field textarea { resize: vertical; min-height: 70px; }
.field small, .hint { color: var(--faint); font-size: 12.5px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--accent); padding: 0 6px; }
.fsets { display: flex; flex-direction: column; gap: 12px; }
#fs-cz { order: 1; } .fsets .afbar { order: 2; } #fs-en { order: 3; }
body[data-dict="en"] #fs-cz { order: 3; } body[data-dict="en"] #fs-en { order: 1; }
.afbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.afbar .hint { flex: 1 1 200px; }
.afmsg { font-size: 13px; color: var(--muted); }
.afmsg.err { color: var(--danger); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
.checks label, .opt { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.formbtns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.err { color: var(--danger); font-size: 13px; }
.scope { display: grid; gap: 8px; }
.glist { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; max-height: 200px; overflow: auto; font-size: 14px; }
.glist small { color: var(--faint); }
details.more-f summary { cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 600; padding: 4px 0; }
details.more-f[open] { display: grid; gap: 10px; }
.dsec { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.dsec h3 { margin: 0; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.dsec .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.dsec p { margin: 0; }

/* word detail */
.dbig { font-family: var(--display); font-size: 32px; font-weight: 700; line-height: 1.1; }
.dline { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: baseline; font-size: 15px; }
.dline .k { font-size: 10.5px; font-weight: 800; color: var(--faint); letter-spacing: .05em; }
.def { font-style: italic; margin: 0; }
.exs { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.exs li { display: grid; gap: 1px; }
.exs .c { font-weight: 600; } .exs .u { color: var(--muted); font-size: 14px; }

/* trainer */
.trainer { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.t-top { display: flex; align-items: center; gap: 12px; max-width: 560px; width: 100%; margin: 0 auto; }
.t-top .ttl { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-top .prog { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pbar { height: 4px; background: var(--line); border-radius: 4px; max-width: 560px; width: 100%; margin: 8px auto 0; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .2s; }
.stage { display: grid; place-items: center; min-height: 0; padding-block: 14px; overflow: auto; }
.card { position: relative; width: min(540px, 100%); min-height: min(360px, 54vh); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.08); display: grid; place-content: center; gap: 10px; text-align: center; padding: 30px 20px; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; transition: transform .25s ease, opacity .25s ease; }
.card.drag { transition: none; cursor: grabbing; }
.card .kind { font-size: 12px; color: var(--faint); font-weight: 600; }
.card .big { font-family: var(--display); font-size: clamp(28px, 7vw, 40px); font-weight: 700; line-height: 1.15; }
.card .defq { font-size: clamp(17px, 4.2vw, 21px); line-height: 1.45; max-width: 44ch; }
.card .sub2 { font-size: 15px; color: var(--muted); }
.card .ans { display: grid; gap: 5px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.card .ans .big { font-size: clamp(24px, 6vw, 32px); }
.card .hint { font-size: 12.5px; color: var(--faint); }
.stamp { position: absolute; top: 16px; font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; border: 2px solid; opacity: 0; }
.stamp.yes { right: 16px; color: var(--ok); } .stamp.no { left: 16px; color: var(--danger); }
.t-btns { display: flex; gap: 10px; max-width: 560px; width: 100%; margin: 0 auto; }
.t-btns .btn { flex: 1; padding: 13px; font-size: 16px; border-radius: 14px; }
.t-btns .no { color: var(--danger); } .t-btns .yes { color: var(--ok); }
.keys { text-align: center; font-size: 12px; color: var(--faint); margin-top: 8px; }
.done { width: min(540px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: grid; gap: 12px; }
.done h2 { margin: 0; font-family: var(--display); font-size: 26px; }
.done p { margin: 0; }

  claude_p: ["Скопіюй інструкцію і встав у чат з Claude разом з фото, голосовим або списком слів. Claude поверне готовий текст — встав його вище в «Імпорт».", "Copy the instructions and paste them into a chat with Claude together with a photo, voice note or word list. Claude returns ready text: paste it into Import above.", "Zkopíruj návod a vlož ho do chatu s Claudem spolu s fotkou, hlasovkou nebo seznamem slov. Claude vrátí hotový text, vlož ho výše do Importu.", "Скопируй инструкцию и вставь в чат с Claude вместе с фото, голосовым или списком слов. Claude вернёт готовый текст — вставь его выше в «Импорт»."],
  prompt_cs: ["Інструкція: чеські слова", "Instructions: Czech words", "Návod: česká slova", "Инструкция: чешские слова"],
  prompt_en: ["Інструкція: англійські слова", "Instructions: English words", "Návod: anglická slova", "Инструкция: английские слова"],
  prompt_copied: ["Інструкцію скопійовано — встав її в чат з Claude", "Instructions copied. Paste them into a chat with Claude", "Návod zkopírován, vlož ho do chatu s Claudem", "Инструкция скопирована — вставь её в чат с Claude"],
  home_h: ["На екран «Додому»", "Add to Home Screen", "Na plochu", "На экран «Домой»"],
  home_p: ["iPhone: Safari → «Поділитися» → «На початковий екран». Для двох іконок відкрий окремо cs.html (чеська) і en.html (англійська). Слова зберігаються на цьому пристрої — роби резервну копію хоча б раз на тиждень.", "iPhone: Safari → Share → Add to Home Screen. For two icons, open cs.html (Czech) and en.html (English) separately. Words are stored on this device, so make a backup at least once a week.", "iPhone: Safari → Sdílet → Přidat na plochu. Pro dvě ikony otevři zvlášť cs.html (čeština) a en.html (angličtina). Slova se ukládají v tomto zařízení, zálohuj aspoň jednou týdně.", "iPhone: Safari → «Поделиться» → «На экран „Домой“». Для двух иконок открой отдельно cs.html (чешский) и en.html (английский). Слова хранятся на этом устройстве — делай резервную копию хотя бы раз в неделю."]
};

</script>
<script>
"use strict";
/* ================= i18n ================= */
const LANGS = ["uk", "en", "cs", "ru"];
const LOCALES = { uk: "uk-UA", en: "en-GB", cs: "cs-CZ", ru: "ru-RU" };
let LANG = "uk";
function t(k, ...a) {
  const row = I18N[k];
  if (!row) { console.error("i18n missing: " + k); return k; }
  let s = row[LANGS.indexOf(LANG)] ?? row[0];
  a.forEach((v, i) => { s = s.split("{" + i + "}").join(v); });
  return s;
}
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
  $("meta-apptitle").content = t("app") + (window.VOKAB_DEFAULT === "cs" ? " CZ" : window.VOKAB_DEFAULT === "en" ? " EN" : "");
  $("manifest-link").href = `manifest-${window.VOKAB_DEFAULT ? window.VOKAB_DEFAULT + "-" : ""}${LANG}.json`;
  document.querySelectorAll("#langseg [data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
}

/* ================= config ================= */
const KEY = "vokab:v1";
const DICTS = { cs: { T: "cz", M: "en", tName: "čeština", mName: "English", inT: "in_cs", inM: "in_en" },
                en: { T: "en", M: "cz", tName: "English", mName: "čeština", inT: "in_en", inM: "in_cs" } };
const POS = g => t({ m: "pos_m", f: "pos_m", n: "pos_m", v: "pos_v", a: "pos_a", d: "pos_d", x: "pos_x" }[g] || "pos_x");
const ICON_MORE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>';
const ICON_CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
function modeLabel(k) {
  const d = DICTS[state.dict];
  return { mt: `${d.mName} → ${d.tName}`, tm: `${d.tName} → ${d.mName}`, mix: t("mode_mix", `${d.mName} ↔ ${d.tName}`), ut: `${t("lang_ua")} → ${d.tName}`, def: t("mode_def", t(d.inT)) }[k];
}

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fold = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const arr = v => Array.isArray(v) ? v.filter(Boolean).map(String) : (typeof v === "string" && v ? v.split(",").map(s => s.trim()).filter(Boolean) : []);
const uaShort = s => { const x = String(s || "").split(/[;,(]/)[0].trim(); return x || String(s || ""); };
const inline = s => esc(s)
  .replace(/\[([mfn]):([^\]]+)\]/g, '<span class="$1">$2</span>')
  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
  .replace(/~~(.+?)~~/g, '<span class="fix">$1</span>')
  .replace(/_([^_]+)_/g, "<i>$1</i>");
const gc = w => (w.g === "m" || w.g === "f" || w.g === "n") ? "g-" + w.g : "";

/* ================= storage ================= */
function emptyStore() { return { v: 1, dicts: { cs: { groups: [], sheets: [] }, en: { groups: [], sheets: [] } }, prefs: { cs: {}, en: {}, ua: true, theme: "auto", lang: null }, lastBackup: null }; }
function normWord(w) {
  const o = {
    id: String(w.id || newId("w")), cz: String(w.cz || ""), czTr: String(w.czTr ?? w.tr ?? ""), czSyn: arr(w.czSyn ?? w.syn),
    g: ["m", "f", "n", "v", "a", "d", "x"].includes(w.g) ? w.g : "x",
    en: String(w.en || ""), enTr: String(w.enTr || ""), enSyn: arr(w.enSyn),
    ua: String(w.ua || ""), note: String(w.note || ""), def: String(w.def || ""),
    ex: (Array.isArray(w.ex) ? w.ex : []).map(e => typeof e === "string" ? { t: e, ua: "" } : { t: String(e.t ?? e.cz ?? e.en ?? ""), ua: String(e.ua || "") }).filter(e => e.t)
  };
  for (const k of ["pl", "q", "archived", "deleted"]) if (w[k]) o[k] = true;
  if (w.deletedAt) o.deletedAt = w.deletedAt;
  return o;
}
function normDict(d) {
  d = d || {};
  return {
    groups: (d.groups || []).map((g, i) => ({ id: String(g.id || newId("t")), name: String(g.name || g.ua || "—"), sub: String(g.sub || g.cz || ""),
      order: Number.isFinite(g.order) ? g.order : (i + 1) * 10, words: (g.words || []).map(normWord) })),
    sheets: (d.sheets || []).map((s, i) => ({ ...s, id: String(s.id || newId("s")), order: Number.isFinite(s.order) ? s.order : (i + 1) * 10 }))
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return emptyStore();
    const s = JSON.parse(raw), base = emptyStore();
    return { ...base, ...s, dicts: { cs: normDict(s.dicts?.cs), en: normDict(s.dicts?.en) }, prefs: { ...base.prefs, ...(s.prefs || {}) } };
  } catch (_) { return emptyStore(); }
}
let store = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (_) { showToast(t("t_save_fail")); } }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {}

/* ================= theme & language ================= */
function applyTheme() {
  const th = store.prefs.theme || "auto";
  if (th === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = th;
  const dark = th === "dark" || (th === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  $("meta-theme").content = dark ? "#181c24" : "#ffffff";
  document.querySelectorAll("#themeseg [data-theme-v]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeV === th)));
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
function pickLang() {
  if (LANGS.includes(store.prefs.lang)) return store.prefs.lang;
  const n = (navigator.language || "uk").slice(0, 2).toLowerCase();
  return LANGS.includes(n) ? n : "uk";
}
function setLang(l) {
  LANG = l; store.prefs.lang = l; save(); applyI18n();
  if (state.dict) { refreshChrome(); render(); } else showChooser();
}

/* ================= state ================= */
const state = { dict: null, view: "active", selecting: false, selected: new Set(), hide: 0, editing: null };
const D = () => DICTS[state.dict];
const data = () => store.dicts[state.dict];
const pref = () => (store.prefs[state.dict] = store.prefs[state.dict] || {});
const tW = w => w[D().T] || "", tTr = w => w[D().T + "Tr"] || "", tSyn = w => w[D().T + "Syn"] || [];
const mW = w => w[D().M] || "", mTr = w => w[D().M + "Tr"] || "", mSyn = w => w[D().M + "Syn"] || [];
const tCls = w => D().T === "cz" ? gc(w) : "", mCls = w => D().M === "cz" ? gc(w) : "";
const inView = (w, v) => v === "active" ? !w.deleted && !w.archived : v === "archive" ? !w.deleted && !!w.archived : !!w.deleted;
const groupsSorted = () => data().groups.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
const sheetsSorted = () => data().sheets.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
const findGroup = id => data().groups.find(g => g.id === id);
const findWord = (gid, wid) => (findGroup(gid)?.words || []).find(x => x.id === wid);
const key = (gid, wid) => gid + "|" + wid;
function wordsIn(view, ids) {
  const out = [];
  for (const g of groupsSorted()) { if (ids && !ids.includes(g.id)) continue; for (const w of g.words) if (inView(w, view)) out.push({ g, w }); }
  return out;
}
const countActive = k => store.dicts[k].groups.reduce((n, g) => n + g.words.filter(w => !w.deleted && !w.archived).length, 0);

/* ================= routing ================= */
function showChooser() {
  if (state.selecting) toggleSelect(false);
  state.dict = null; delete document.body.dataset.dict;
  $("app").hidden = true; $("chooser").hidden = false;
  $("ch-cs").textContent = t("words_n", countActive("cs")); $("ch-en").textContent = t("words_n", countActive("en"));
  document.title = t("app");
}
function refreshChrome() {
  const k = state.dict;
  $("legend").innerHTML = (k === "cs"
    ? `<span><i class="dot" style="background:var(--m)"></i>${esc(t("leg_m"))}</span><span><i class="dot" style="background:var(--f)"></i>${esc(t("leg_f"))}</span><span><i class="dot" style="background:var(--n)"></i>${esc(t("leg_n"))}</span><span>${esc(t("leg_tr"))}</span>`
    : `<span>${esc(t("leg_cz_color"))} <b class="g-m">${esc(t("leg_m"))}</b> · <b class="g-f">${esc(t("leg_f"))}</b> · <b class="g-n">${esc(t("leg_n"))}</b></span><span>${esc(t("leg_ipa"))}</span>`) +
    `<span>${esc(t("leg_syn"))}</span><span><b style="color:var(--warn)">!</b> ${esc(t("leg_note"))}</span><span>${esc(t("leg_tap"))}</span>`;
  $("hidemode").textContent = t("hide" + state.hide);
  $("selmode").textContent = state.selecting ? t("done") : t("select");
  document.title = `${t("app")} · ${D().tName}`;
}
function openDict(k) {
  if (!DICTS[k]) return showChooser();
  if (state.selecting) toggleSelect(false);
  state.dict = k; state.view = "active"; state.hide = 0;
  document.body.dataset.dict = k;
  document.body.classList.remove("hide-m", "hide-t");
  $("chooser").hidden = true; $("app").hidden = false;
  ["cs", "en"].forEach(x => $("sw-" + x).setAttribute("aria-selected", String(x === k)));
  ["active", "archive", "trash"].forEach(x => $("tab-" + x).setAttribute("aria-selected", String(x === "active")));
  $("selmode").hidden = false; $("q").value = ""; $("hidemode").setAttribute("aria-pressed", "false");
  if (location.hash !== "#" + k) history.replaceState(null, "", "#" + k);
  refreshChrome(); render(); scrollTo({ top: 0 });
}
$("chooser").addEventListener("click", e => { const b = e.target.closest("[data-dict]"); if (b) openDict(b.dataset.dict); });
$("home").addEventListener("click", showChooser);
$("sw-cs").addEventListener("click", () => openDict("cs"));
$("sw-en").addEventListener("click", () => openDict("en"));

/* ================= render ================= */
function rowHTML(g, w) {
  const tt = tTr(w), ts = tSyn(w), mt = mTr(w), ms = mSyn(w);
  const s1 = [tt ? `<span class="tr">${esc(tt)}</span>` : "", ts.length ? `<span>≈ ${esc(ts.join(", "))}</span>` : ""].filter(Boolean).join(" · ");
  const s2 = [mt ? `<span class="tr">${esc(mt)}</span>` : "", ms.length ? `<span>≈ ${esc(ms.join(", "))}</span>` : ""].filter(Boolean).join(" · ");
  const c3 = (w.ua ? `<span class="uaS">${esc(uaShort(w.ua))}</span>` : "") + (w.note ? `<span class="nt">${esc(w.note)}</span>` : "") +
    (w.ex && w.ex.length ? `<button class="expill" type="button" data-act="detail">${esc(t("examples"))}</button>` : "");
  const picked = state.selected.has(key(g.id, w.id));
  return `<div class="w${picked ? " picked" : ""}" data-g="${esc(g.id)}" data-w="${esc(w.id)}">` +
    (state.selecting ? `<input class="sel" type="checkbox" tabindex="-1" aria-hidden="true"${picked ? " checked" : ""}>` : "") +
    `<div class="c1"><div class="t1 ${tCls(w)}">${esc(tW(w) || "—")}${w.pl ? `<span class="pl">${esc(t("pl_tag"))}</span>` : ""}${w.q ? `<span class="q" title="${esc(t("unsure"))}">?</span>` : ""}</div>${s1 ? `<div class="s1">${s1}</div>` : ""}</div>` +
    `<div class="c2"><div class="t2 ${mCls(w)}">${esc(mW(w) || uaShort(w.ua))}</div>${s2 ? `<div class="s2">${s2}</div>` : ""}</div>` +
    `<button class="more" type="button" data-act="menu" aria-label="${esc(t("word_actions"))}" aria-haspopup="menu">${ICON_MORE}</button>` +
    `<div class="c3">${c3}</div></div>`;
}
function sheetHTML(s, no) {
  let h = `<section class="sheet" data-s="${esc(s.id)}"><div class="sbar"><span class="no">${esc(t("sheet_no", no))}</span><button class="x" type="button" data-act="del-sheet" aria-label="${esc(t("sheet_remove"))}">×</button></div><h3>${inline(s.title || "")}</h3>`;
  for (const b of (s.blocks || [])) {
    if (b.t === "p") h += `<p>${inline(b.x)}</p>`;
    else if (b.t === "ul") h += `<ul>${(b.items || []).map(i => `<li>${inline(i)}</li>`).join("")}</ul>`;
    else if (b.t === "table") h += `<div class="tw"><table><tr>${(b.head || []).map(c => `<th>${inline(c)}</th>`).join("")}</tr>` + (b.rows || []).map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") + `</table></div>`;
  }
  return h + `</section>`;
}
function render() {
  if (!state.dict) return;
  const v = state.view, q = fold($("q").value);
  const counts = { active: 0, archive: 0, trash: 0 };
  for (const g of data().groups) for (const w of g.words) { if (w.deleted) counts.trash++; else if (w.archived) counts.archive++; else counts.active++; }
  const trashSheets = sheetsSorted().filter(s => s.deleted);
  counts.trash += trashSheets.length;
  ["active", "archive", "trash"].forEach(x => $("c-" + x).textContent = counts[x] || "");
  const collapsed = new Set(pref().collapsed || []);
  let html = "", nav = "", shownAny = false;
  for (const g of groupsSorted()) {
    const live = g.words.filter(w => inView(w, v));
    if (!live.length) continue;
    nav += `<a href="#" data-goto="${esc(g.id)}">${esc(g.name)}<small>${live.length}</small></a>`;
    const shown = q ? live.filter(w => fold([w.cz, w.en, w.ua, w.note, ...(w.czSyn || []), ...(w.enSyn || [])].join(" ")).includes(q)) : live;
    if (!shown.length) continue;
    shownAny = true;
    const closed = collapsed.has(g.id) && !q;
    const allPicked = state.selecting && shown.every(w => state.selected.has(key(g.id, w.id)));
    const gbtn = state.selecting ? `<button class="btn sm" type="button" data-act="pick-group">${esc(t(allPicked ? "unpick_all" : "pick_all"))}</button>`
      : (v !== "trash" ? `<button class="btn sm" type="button" data-act="practice-group">${esc(t("practice"))}</button>` : "");
    html += `<section class="group${closed ? " closed" : ""}" id="g-${esc(g.id)}"><div class="ghead"><button class="gt" type="button" data-act="toggle" aria-expanded="${!closed}">${ICON_CHEV}<h2>${esc(g.name)}</h2>${g.sub ? `<span class="sub">${esc(g.sub)}</span>` : ""}<span class="cnt">${live.length}</span></button>${gbtn}</div>` +
      `<div class="wl">${shown.map(w => rowHTML(g, w)).join("")}</div></section>`;
  }
  const liveSheets = sheetsSorted().filter(s => !s.deleted);
  const showSheets = v === "active" && !q && liveSheets.length > 0;
  if (showSheets) nav += `<a class="rules" href="#" data-goto="__sheets">${esc(t("sheets_chip"))}</a>`;
  if (v === "trash" && trashSheets.length) {
    shownAny = true;
    html += `<section class="group"><div class="ghead"><div class="gt"><h2>${esc(t("sheets_chip"))}</h2><span class="cnt">${trashSheets.length}</span></div></div><div class="wl">` +
      trashSheets.map(s => `<div class="w" data-s="${esc(s.id)}"><div class="c1"><div class="t1">${esc(s.title)}</div></div><div class="c2"><div class="t2">${esc(t("sheet_kind"))}</div></div><button class="more" type="button" data-act="menu" aria-label="${esc(t("word_actions"))}">${ICON_MORE}</button><div class="c3"></div></div>`).join("") + `</div></section>`;
  }
  $("nav").innerHTML = nav; $("nav").closest(".groups").hidden = !nav;
  $("words").innerHTML = html;
  $("lystochky").hidden = !showSheets;
  $("sheets").innerHTML = showSheets ? liveSheets.map((s, i) => sheetHTML(s, i + 1)).join("") : "";
  const vn = { active: "", archive: t("vn_archive"), trash: t("vn_trash") }[v];
  $("viewnote").hidden = !vn; $("viewnote").textContent = vn;
  let empty = "";
  if (q && !shownAny) empty = t("empty_q");
  else if (!shownAny) empty = { active: counts.archive ? t("empty_allarch") : t("empty_active"), archive: t("empty_archive"), trash: t("empty_trash") }[v];
  $("empty").hidden = !empty;
  $("empty").innerHTML = esc(empty) + (v === "active" && !shownAny && !q ? `<button class="btn" type="button" data-open-settings>${esc(t("open_settings"))}</button>` : "");
  const ng = groupsSorted().filter(g => g.words.some(w => inView(w, "active"))).length;
  $("stats").textContent = t("stats", t("dict_" + state.dict), counts.active, ng, counts.archive);
  updateSelBar();
}
$("empty").addEventListener("click", e => { if (e.target.closest("[data-open-settings]")) openSettings(); });
$("nav").addEventListener("click", e => {
  const a = e.target.closest("[data-goto]"); if (!a) return; e.preventDefault();
  const el = a.dataset.goto === "__sheets" ? $("lystochky") : $("g-" + a.dataset.goto);
  if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});

/* ================= mutations ================= */
function commit() { save(); render(); }
function mutateWords(gid, fn) { const g = findGroup(gid); if (!g) return; g.words = fn(g.words.slice()); commit(); }
const patchWord = (gid, wid, fn) => mutateWords(gid, ws => ws.map(w => w.id === wid ? fn({ ...w }) : w));
const strip = (o, ...ks) => { ks.forEach(k => delete o[k]); return o; };
function bulk(keys, fn) {
  const byG = {};
  for (const k of keys) { const [gid, wid] = k.split("|"); (byG[gid] = byG[gid] || new Set()).add(wid); }
  for (const gid of Object.keys(byG)) { const g = findGroup(gid); if (g) g.words = fn(g.words.slice(), byG[gid]); }
  commit();
}
function setSheet(sid, patch) { const s = data().sheets.find(x => x.id === sid); if (!s) return; Object.assign(s, patch); if (patch.deleted === false) delete s.deleted; commit(); }
function newGroup(name) { const g = { id: newId("t"), name, sub: "", order: Math.max(0, ...data().groups.map(x => x.order || 0)) + 10, words: [] }; data().groups.push(g); return g; }

let toastTimer = null, toastUndo = null;
function showToast(text, undo) {
  $("toast-text").textContent = text; toastUndo = undo || null; $("toast-undo").hidden = !undo; $("toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; toastUndo = null; }, 6000);
}
$("toast-undo").addEventListener("click", () => { const u = toastUndo; $("toast").hidden = true; toastUndo = null; if (u) u(); });

/* ================= online autofill (free services, no keys) ================= */
async function getJSON(url) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (r.status === 404) return null; if (!r.ok) throw new Error("http " + r.status); return await r.json(); }
  finally { clearTimeout(timer); }
}
async function translate(text, from, to) {          // MyMemory: free machine translation, uk / cs / en
  const j = await getJSON(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
  const s = String(j?.responseData?.translatedText || "").trim();
  if (!s || Number(j?.responseStatus) !== 200 || /MYMEMORY WARNING|INVALID|QUERY LENGTH/i.test(s)) return "";
  let out = s.replace(/[.。!]+$/, "");
  if (text[0] && text[0] === text[0].toLowerCase()) out = out.charAt(0).toLowerCase() + out.slice(1);
  return fold(out) === fold(text) ? "" : out;
}
async function englishInfo(word) {                   // Free Dictionary API: IPA, definition, synonyms, example
  const w = word.replace(/^to\s+/i, "").trim();
  if (!w || /\s/.test(w)) return null;
  const j = await getJSON(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(w.toLowerCase())}`);
  if (!Array.isArray(j) || !j[0]) return null;
  const e = j[0], meanings = e.meanings || [];
  const ipa = e.phonetic || (e.phonetics || []).map(p => p.text).find(Boolean) || "";
  const defs = meanings.flatMap(m => m.definitions || []);
  const syn = [...new Set(meanings.flatMap(m => [...(m.synonyms || []), ...(m.definitions || []).flatMap(d => d.synonyms || [])]))].filter(s => s.toLowerCase() !== w.toLowerCase()).slice(0, 2);
  return { ipa, def: defs[0]?.definition || "", example: defs.map(d => d.example).find(Boolean) || "", syn, pos: meanings[0]?.partOfSpeech || "" };
}
function guessGender(cz, pos) {
  const s = cz.toLowerCase().trim();
  if (pos === "verb" || /(at|it|et|ět|out|ovat|nout|ít|ýt)( se| si)?$/.test(s)) return "v";
  if (pos === "adjective" || /ý$/.test(s)) return "a";
  if (pos === "adverb") return "d";
  if (/\s/.test(s)) return "x";
  if (/(a|e|ě|ost)$/.test(s)) return "f";
  if (/(o|í|um)$/.test(s)) return "n";
  return "m";
}

/* ================= trainer ================= */
const T = { deck: [], queue: [], known: 0, missed: new Set(), flipped: false, mode: "mt", title: "", dirs: [] };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function startPractice(items, title, mode) {
  let deck = items.filter(({ w }) => tW(w));
  if (mode === "def") deck = deck.filter(({ w }) => w.def);
  if (mode === "mt" || mode === "tm" || mode === "mix") deck = deck.filter(({ w }) => mW(w) || w.ua);
  if (mode === "ut") deck = deck.filter(({ w }) => w.ua);
  if (!deck.length) { showToast(t(mode === "def" ? "no_def" : "no_words")); return; }
  Object.assign(T, { deck, queue: shuffle(deck.map((_, i) => i)), known: 0, missed: new Set(), mode, title,
    dirs: deck.map(() => mode === "mix" ? (Math.random() < .5 ? "mt" : "tm") : mode) });
  $("trainer").hidden = false; document.body.style.overflow = "hidden"; showCard();
}
function closeTrainer() { $("trainer").hidden = true; document.body.style.overflow = ""; }
function cardFace(w, g, dir) {
  const tBlock = `<div class="big ${tCls(w)}">${esc(tW(w))}</div>${tTr(w) ? `<div class="sub2">${esc(tTr(w))}</div>` : ""}`;
  const mBlock = mW(w) ? `<div class="sub2"><b class="${mCls(w)}" style="font-size:18px">${esc(mW(w))}</b> ${mTr(w) ? `<span class="tr">${esc(mTr(w))}</span>` : ""}</div>` : "";
  const uaLine = w.ua ? `<div class="sub2">UA: ${esc(w.ua)}</div>` : "";
  const extra = (tSyn(w).length ? `<div class="sub2">≈ ${esc(tSyn(w).join(", "))}</div>` : "") + (w.note ? `<div class="sub2">! ${esc(w.note)}</div>` : "");
  const kind = `<div class="kind">${esc(POS(w.g))}${w.pl ? " · " + esc(t("only_pl")) : ""} · ${esc(g.name)}</div>`;
  const hint = s => `<div class="hint">${esc(s)}</div>`;
  if (dir === "mt") return kind + `<div class="big ${mCls(w)}">${esc(mW(w) || w.ua)}</div>` + (T.flipped ? `<div class="ans">${tBlock}${uaLine}${extra}</div>` : hint(t("say_in", t(D().inT))));
  if (dir === "ut") return kind + `<div class="big">${esc(w.ua)}</div>` + (T.flipped ? `<div class="ans">${tBlock}${mBlock}${extra}</div>` : hint(t("say_in", t(D().inT))));
  if (dir === "def") return `<div class="kind">${esc(POS(w.g))} · ${esc(t("what_word"))}</div><div class="defq">${esc(w.def)}</div>` + (T.flipped ? `<div class="ans">${tBlock}${mBlock}${uaLine}</div>` : hint(t("name_in", t(D().inT))));
  return kind + tBlock + (T.flipped ? `<div class="ans">${mBlock || `<div class="big">${esc(w.ua)}</div>`}${uaLine}${extra}</div>` : hint(t("say_in", t(D().inM))));
}
const paint = () => { const i = T.queue[0], { w, g } = T.deck[i]; return `<span class="stamp no" id="st-no">${esc(t("stamp_no"))}</span><span class="stamp yes" id="st-yes">${esc(t("stamp_yes"))}</span>${cardFace(w, g, T.dirs[i])}`; };
function showCard() {
  const total = T.deck.length;
  $("t-title").textContent = `${T.title} · ${modeLabel(T.mode)}`; $("t-prog").textContent = `${T.known} / ${total}`;
  $("t-bar").style.width = (T.known / total * 100) + "%";
  if (!T.queue.length) return showDone();
  T.flipped = false; $("t-foot").hidden = false;
  $("t-stage").innerHTML = `<div class="card" id="card" tabindex="0" role="button" aria-label="${esc(t("card_aria"))}">${paint()}</div>`;
  bindCard($("card"));
}
function flip() { if (!T.queue.length) return; T.flipped = !T.flipped; $("card").innerHTML = paint(); }
function judge(ok) { if (!T.queue.length) return; const i = T.queue.shift(); if (ok) T.known++; else { T.missed.add(i); T.queue.push(i); } showCard(); }
function fly(ok) {
  const c = $("card"); if (!c) return judge(ok);
  c.style.transform = `translateX(${ok ? 140 : -140}%) rotate(${ok ? 16 : -16}deg)`; c.style.opacity = "0";
  setTimeout(() => judge(ok), matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 200);
}
function bindCard(c) {
  let x0 = null, dx = 0;
  c.addEventListener("pointerdown", e => { x0 = e.clientX; dx = 0; try { c.setPointerCapture(e.pointerId); } catch (_) {} c.classList.add("drag"); });
  c.addEventListener("pointermove", e => {
    if (x0 === null) return; dx = e.clientX - x0;
    c.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
    $("st-yes").style.opacity = Math.max(0, Math.min(1, dx / 90)); $("st-no").style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (x0 === null) return; c.classList.remove("drag"); x0 = null;
    if (Math.abs(dx) > 90) fly(dx > 0);
    else { c.style.transform = ""; $("st-yes").style.opacity = 0; $("st-no").style.opacity = 0; if (Math.abs(dx) < 8) flip(); }
  };
  c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
  c.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); flip(); } });
}
function showDone() {
  const total = T.deck.length, first = total - T.missed.size, missed = [...T.missed].map(i => T.deck[i]);
  $("t-foot").hidden = true; $("t-prog").textContent = `${total} / ${total}`;
  $("t-stage").innerHTML = `<div class="done"><h2>${esc(t("done_h"))}</h2><p>${t("first_try", first, total)}</p>` +
    (missed.length ? `<p>${esc(t("work_on"))}</p><ul>${missed.map(({ w }) => `<li><b class="${tCls(w)}">${esc(tW(w))}</b> — ${esc(mW(w) || w.ua)}</li>`).join("")}</ul>` : `<p>${esc(t("all_first"))}</p>`) +
    `<div class="row3">${missed.length ? `<button class="btn primary" type="button" id="d-missed">${esc(t("repeat_mistakes", missed.length))}</button>` : ""}<button class="btn" type="button" id="d-again">${esc(t("again_all"))}</button><button class="btn" type="button" id="d-x">${esc(t("close"))}</button></div></div>`;
  const base = T.title;
  $("d-again").onclick = () => startPractice(T.deck, base, T.mode);
  $("d-x").onclick = closeTrainer;
  if (missed.length) $("d-missed").onclick = () => startPractice(missed, `${base} · ${t("p_mistakes")}`, T.mode);
}
$("t-close").addEventListener("click", closeTrainer);
$("t-yes").addEventListener("click", () => fly(true));
$("t-no").addEventListener("click", () => fly(false));
document.addEventListener("keydown", e => {
  if ($("trainer").hidden) return;
  if (e.key === "Escape") closeTrainer();
  else if (e.key === " " && T.queue.length) { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight" && T.queue.length) fly(true);
  else if (e.key === "ArrowLeft" && T.queue.length) fly(false);
});

/* ================= settings: language, theme, data ================= */
function openSettings() {
  $("exp-share").hidden = !(navigator.canShare && window.File && (() => { try { return navigator.canShare({ files: [new File(["x"], "x.json", { type: "application/json" })] }); } catch (_) { return false; } })());
  $("lastbackup").textContent = store.lastBackup ? t("last_backup", new Date(store.lastBackup).toLocaleDateString(LOCALES[LANG])) : t("no_backup");
  $("imp-err").hidden = true; $("imp-merge").checked = true; $("imp-go").textContent = t("imp_go"); delete $("imp-go").dataset.sure;
  applyI18n(); applyTheme();
  $("setdlg").showModal();
}
$("settings-btn").addEventListener("click", openSettings);
$("ch-settings").addEventListener("click", openSettings);
$("langseg").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (b) { setLang(b.dataset.lang); openSettingsRefresh(); } });
function openSettingsRefresh() {
  $("lastbackup").textContent = store.lastBackup ? t("last_backup", new Date(store.lastBackup).toLocaleDateString(LOCALES[LANG])) : t("no_backup");
  $("imp-go").textContent = $("imp-replace").checked ? t("imp_replace") : t("imp_go");
}
$("themeseg").addEventListener("click", e => { const b = e.target.closest("[data-theme-v]"); if (b) { store.prefs.theme = b.dataset.themeV; save(); applyTheme(); } });
const backupText = () => JSON.stringify({ app: "vokab", type: "backup", version: 1, exportedAt: new Date().toISOString(), dicts: store.dicts });
const backupName = () => `vocab-${new Date().toISOString().slice(0, 10)}.json`;
function markBackup() { store.lastBackup = Date.now(); save(); $("lastbackup").textContent = t("last_backup", new Date().toLocaleDateString(LOCALES[LANG])); }
$("exp-file").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([backupText()], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = backupName(); document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500); markBackup();
});
$("exp-share").addEventListener("click", async () => {
  try { await navigator.share({ files: [new File([backupText()], backupName(), { type: "application/json" })], title: t("app") }); markBackup(); }
  catch (e) { if (e && e.name !== "AbortError") showToast(t("share_fail")); }
});
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); showToast(okMsg); return true; }
  catch (_) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove();
    showToast(ok ? okMsg : t("copy_fail")); return ok;
  }
}
$("exp-copy").addEventListener("click", async () => { if (await copyText(backupText(), t("copied_backup"))) markBackup(); });
$("imp-file").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { $("imp-text").value = String(r.result || ""); $("imp-err").hidden = true; }; r.readAsText(f); e.target.value = "";
});
$("imp-replace").addEventListener("change", () => { $("imp-go").textContent = t("imp_replace"); });
$("imp-merge").addEventListener("change", () => { $("imp-go").textContent = t("imp_go"); delete $("imp-go").dataset.sure; });
function parseImport(text) {
  let s = String(text || "").trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) s = fence[1].trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}"); if (a < 0 || b < a) throw new Error("no json");
  return JSON.parse(s.slice(a, b + 1));
}
function findDup(dict, w, T) {
  for (const g of dict.groups) for (const x of g.words) { if (x.id === w.id) return x; const a = fold(x[T]), b = fold(w[T]); if (a && a === b) return x; }
  return null;
}
function mergeInto(dk, src, stats) {
  const dst = store.dicts[dk], T = DICTS[dk].T;
  for (const sg0 of (src.groups || [])) {
    const sg = { ...sg0, name: sg0.name || sg0.ua || "—" };
    let g = dst.groups.find(x => sg.id && x.id === sg.id) || dst.groups.find(x => fold(x.name) === fold(sg.name));
    if (!g) { g = { id: String(sg.id || newId("t")), name: String(sg.name), sub: String(sg.sub || sg.cz || ""), order: Math.max(0, ...dst.groups.map(x => x.order || 0)) + 10, words: [] }; dst.groups.push(g); stats.groups++; }
    for (const raw of (sg.words || [])) {
      const w = normWord(raw);
      if (!w[T] && !w.ua) continue;
      const hit = findDup(dst, w, T);
      if (hit) {
        for (const k of ["czTr", "en", "enTr", "ua", "note", "def", "cz"]) if (!hit[k] && w[k]) hit[k] = w[k];
        for (const k of ["czSyn", "enSyn", "ex"]) if ((!hit[k] || !hit[k].length) && w[k].length) hit[k] = w[k];
        stats.updated++;
      } else { g.words.push(w); stats.added++; }
    }
  }
  for (const s of (src.sheets || [])) {
    if (!dst.sheets.some(x => (s.id && x.id === s.id) || fold(x.title) === fold(s.title))) { dst.sheets.push({ ...s, id: String(s.id || newId("s")), order: Math.max(0, ...dst.sheets.map(x => x.order || 0)) + 10 }); stats.sheets++; }
  }
}
$("imp-go").addEventListener("click", () => {
  const err = m => { $("imp-err").textContent = m; $("imp-err").hidden = false; };
  let obj; try { obj = parseImport($("imp-text").value); } catch (_) { return err(t("imp_bad")); }
  const replace = $("imp-replace").checked;
  if (replace && $("imp-go").dataset.sure !== "1") { $("imp-go").dataset.sure = "1"; $("imp-go").textContent = t("imp_sure"); return; }
  const stats = { added: 0, updated: 0, groups: 0, sheets: 0 };
  if (obj.dicts) {
    if (replace) store.dicts = { cs: normDict(obj.dicts.cs), en: normDict(obj.dicts.en) };
    else for (const k of ["cs", "en"]) if (obj.dicts[k]) mergeInto(k, obj.dicts[k], stats);
  } else if (obj.groups || obj.words) {
    const k = obj.dict === "en" ? "en" : "cs";
    const src = obj.groups ? obj : { groups: [{ name: obj.group || "—", words: obj.words }] };
    if (replace) store.dicts[k] = { groups: [], sheets: [] };
    mergeInto(k, src, stats);
  } else return err(t("imp_nowords"));
  save();
  $("imp-text").value = ""; $("setdlg").close();
  openDict(obj.dicts ? (state.dict || "cs") : (obj.dict === "en" ? "en" : "cs"));
  showToast(replace ? t("imp_replaced") : [t("imp_added", stats.added), stats.updated ? t("imp_updated", stats.updated) : "", stats.groups ? t("imp_topics", stats.groups) : ""].filter(Boolean).join(", "));
});
function claudePrompt(dk) {
  const topics = store.dicts[dk].groups.map(g => g.name).join(", ") || "—";
  const ex = dk === "cs"
    ? `{"cz":"kalhoty","g":"f","pl":true,"czTr":"[калготі]","czSyn":["džíny"],"en":"trousers","enTr":"/ˈtraʊzəz/","enSyn":["pants"],"ua":"штани","note":"не плутати з kalhotky","def":"Část oblečení, která zakrývá nohy od pasu ke kotníkům.","ex":[{"t":"Ty kalhoty ti sluší.","ua":"Ці штани тобі личать."}]}`
    : `{"en":"tedious","enTr":"/ˈtiːdiəs/","enSyn":["boring","dull"],"cz":"únavný","g":"a","czTr":"","czSyn":["nudný"],"ua":"нудний","note":"","def":"Too long, slow or dull, so that it makes you tired.","ex":[{"t":"Filling in forms is tedious.","ua":"Заповнювати анкети нудно."}]}`;
  return `Я вчу ${dk === "cs" ? "чеську" : "англійську"} мову. Зроби пакет нових слів для мого застосунку-словника з того, що я надішлю (фото зошита чи підручника, голосове або список).
Поверни ТІЛЬКИ JSON у блоці коду, без пояснень, ось у такому форматі:
{"app":"vokab","dict":"${dk}","groups":[{"name":"<тема українською>","sub":"<тема ${dk === "cs" ? "чеською" : "англійською"}>","words":[
${ex}
]}]}
Правила:
- Головне слово — ${dk === "cs" ? "чеське (cz)" : "англійське (en)"}, основний переклад — ${dk === "cs" ? "англійський (en)" : "чеський (cz)"}, ua — українською 1–2 слова.
- g — рід чеського слова: m, f, n; для дієслів v, прикметників a, прислівників d, виразів x. "pl":true — якщо слово буває тільки в множині.
- czTr — як читати чеське слово українськими літерами, тільки для важких слів («:» — довгий звук), інакше "".
- enTr — вимова англійського слова в IPA.
- czSyn і enSyn — до 2 справді вживаних синонімів, або [].
- note — тільки особливість слова (виняток, «не плутати з …», розмовне), інакше "".
- def — пояснення ${dk === "cs" ? "чеською" : "англійською"} одним реченням, у якому немає самого слова.
- ex — 2–3 приклади ${dk === "cs" ? "чеською" : "англійською"} з перекладом українською для складних дієслів і виразів, інакше [].
- Розклади слова за темами. Мої теми зараз: ${topics}. Якщо слово не пасує до жодної — створи нову тему.
- Якщо якесь слово в записі нерозбірливе — додай до нього "q":true.`;
}
$("prompt-cs").addEventListener("click", () => copyText(claudePrompt("cs"), t("prompt_copied")));
$("prompt-en").addEventListener("click", () => copyText(claudePrompt("en"), t("prompt_copied")));

/* ================= start ================= */
LANG = pickLang();
applyI18n(); applyTheme(); applyUa();
addEventListener("hashchange", () => { const k = location.hash.slice(1); if (DICTS[k] && k !== state.dict) openDict(k); });
(function start() {
  const h = location.hash.slice(1);
  if (DICTS[h]) openDict(h);
  else if (DICTS[window.VOKAB_DEFAULT]) openDict(window.VOKAB_DEFAULT);
  else showChooser();
})();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
