<!doctype html>
<html lang="uk">

<meta name="mobile-web-app-capable" content="yes">

<script src="config.js"></script>
<style>
/* Vocabulary app v2. One template, two builds: "claude" (synced database + Claude photo import) and "web" (offline, this device).
   Layout: splash → onboarding (first run) or chooser → dictionary: header, sticky topic chips, topic cards with
   word rows (target word + plural | main translation, extra translation and note underneath), rule sheets. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --ink: #1a2030; --muted: #5f6879; --faint: #8a92a1; --line: #e3e6ec; --chip: #eceff4;
  --note: #fff4c4; --note-ink: #3a3214; --note-line: #e9d98f;
  --m: #1d55b4; --f: #bf2620; --n: #13743b; --m2: #4a7fd8; --f2: #dd5249; --n2: #3a9a5e;
  --accent: #11457e; --on-accent: #ffffff; --warn: #9a5b00; --ok: #17703a; --danger: #b3261e;
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.2, .9, .3, 1.15);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --surface: #181c24; --ink: #e8ebf1; --muted: #a2aab8; --faint: #7f8898; --line: #282e39; --chip: #232936;
    --note: #2a2615; --note-ink: #efe5bf; --note-line: #4a4224;
    --m: #8bb6ff; --f: #ff978e; --n: #74d597; --m2: #b5d0ff; --f2: #ffbdb6; --n2: #a3e6bb;
    --accent: #8bb6ff; --on-accent: #10131a; --warn: #f0b35a; --ok: #74d597; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #181c24; --ink: #e8ebf1; --muted: #a2aab8; --faint: #7f8898; --line: #282e39; --chip: #232936;
  --note: #2a2615; --note-ink: #efe5bf; --note-line: #4a4224;
  --m: #8bb6ff; --f: #ff978e; --n: #74d597; --m2: #b5d0ff; --f2: #ffbdb6; --n2: #a3e6bb;
  --accent: #8bb6ff; --on-accent: #10131a; --warn: #f0b35a; --ok: #74d597; --danger: #ff8a80;
  color-scheme: dark;
}
body[data-dict="en"] { --accent: #4b3bb0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-dict="en"] { --accent: #b9aef5; } }
:root[data-theme="dark"] body[data-dict="en"] { --accent: #b9aef5; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; transition: background-color .3s ease, color .3s ease; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, label:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font-size: 16px; }

/* motion */
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.94); } }
@keyframes logo-in { from { opacity: 0; transform: scale(.55) rotate(-10deg); } }
@keyframes dlg-in { from { opacity: 0; transform: translateY(16px) scale(.97); } }
@keyframes dlg-out { to { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes sheet-in { from { transform: translateY(100%); } }
@keyframes sheet-out { to { transform: translateY(100%); } }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 18px) scale(.96); } }
@keyframes card-in { from { opacity: 0; transform: translateY(18px) scale(.96); } }
@keyframes spin { to { transform: rotate(360deg); } }
.btn, .seg button, .tabs button, .ch-card, .groups a, .expill, .more, .xbtn, .ob-opt, .floatbar button, .menu button {
  transition: background-color .18s ease, color .18s ease, border-color .18s ease, box-shadow .2s ease, transform .14s var(--ease), opacity .18s ease;
}
.btn:active, .seg button:active, .tabs button:active, .ch-card:active, .groups a:active, .expill:active, .xbtn:active, .ob-opt:active, .floatbar button:active { transform: scale(.95); }

/* splash */
.splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--bg); transition: opacity .4s ease, visibility .4s ease; }
.splash .sp-name { font-family: var(--display); font-size: 28px; font-weight: 700; animation: rise .55s .18s var(--ease) both; }
.splash .sp-status { font-size: 13px; color: var(--muted); min-height: 18px; animation: fade-in .4s .6s both; }
.splash.out { opacity: 0; visibility: hidden; }

/* onboarding + chooser */
.chooser, .onboard { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
.ch-inner, .ob-card { width: min(460px, 100%); display: grid; gap: 18px; justify-items: center; text-align: center; }
.ch-inner > *, .ob-step > * { animation: rise .5s var(--ease) both; }
.ch-inner > :nth-child(2), .ob-step > :nth-child(2) { animation-delay: .05s; } .ch-inner > :nth-child(3), .ob-step > :nth-child(3) { animation-delay: .1s; }
.ch-inner > :nth-child(4), .ob-step > :nth-child(4) { animation-delay: .15s; } .ch-inner > :nth-child(n+5), .ob-step > :nth-child(n+5) { animation-delay: .2s; }
.ch-logo { border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.chooser h1, .onboard h1 { margin: 0; font-family: var(--display); font-size: 38px; line-height: 1.05; }
.onboard h1 { font-size: 30px; }
.onboard h2 { margin: 0; font-size: 18px; }
.chooser p, .onboard p { margin: 0; color: var(--muted); }
.ch-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.ch-card { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 22px 14px; display: grid; gap: 6px; justify-items: center; cursor: pointer; }
.ch-card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,.08); }
.ch-card b { font-family: var(--display); font-size: 24px; }
.ch-card small { color: var(--muted); }
.ch-k { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #fff; padding: 3px 9px; border-radius: 6px; }
.ch-card.cz .ch-k { background: #11457e; } .ch-card.en .ch-k { background: #4b3bb0; }
.ver { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ob-card { gap: 16px; }
.ob-dots { display: flex; gap: 6px; }
.ob-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background-color .3s, width .3s var(--ease); }
.ob-dots i.on { background: var(--accent); width: 20px; border-radius: 4px; }
.ob-step { display: grid; gap: 14px; width: 100%; justify-items: center; }
.ob-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.ob-opt { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 10px; font-weight: 700; font-size: 16px; cursor: pointer; }
.ob-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; color: var(--accent); }
.ob-nav { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }
.ob-nav .btn { min-width: 110px; }
.trp { display: grid; gap: 6px; width: 100%; text-align: left; }
.trp .lbl { margin-top: 6px; }
.trp small { color: var(--faint); font-size: 12.5px; }
.trp .seg { width: 100%; }
.trp .seg button { flex: 1; padding: 8px 10px; }
.trp h4 { margin: 8px 0 0; font-size: 13px; }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); transition: background-color .3s ease, border-color .3s ease; }
body.ready .top { animation: fade-in .45s ease; }  /* opacity only: a transform here would trap the fixed phone dock inside the header */
.top .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
.row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 22px; }
.brand img { border-radius: 7px; transition: transform .3s var(--spring); }
.brand:hover img { transform: rotate(-8deg) scale(1.06); }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
#dictseg button { letter-spacing: .06em; }
.spacer { flex: 1; }
.dock { display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 13px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { background: var(--chip); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { opacity: .9; }
.btn.sm { padding: 4px 10px; font-size: 13px; min-height: 30px; }
.btn.icon { padding: 6px 10px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.stats { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.search input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); outline: none; }
.row3 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.tabs small { font-weight: 500; margin-left: 3px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.status { padding: 18px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; background: var(--surface); display: grid; gap: 10px; justify-items: center; animation: rise .4s var(--ease) both; }
.viewnote { color: var(--muted); font-size: 13px; margin: 0; }

/* topic chips */
.groups { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.groups .wrap { padding-block: 7px; display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
.groups .wrap::-webkit-scrollbar { display: none; }
.groups a { flex: none; text-decoration: none; color: var(--ink); background: var(--chip); padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.groups a:hover { background: color-mix(in srgb, var(--accent) 14%, var(--chip)); }
.groups a.rules { background: var(--note); color: var(--note-ink); }
.groups a small { color: var(--faint); margin-left: 4px; }

/* topics */
main.wrap { padding-block: 16px 130px; display: grid; gap: 16px; }
#words { display: grid; gap: 16px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; scroll-margin-top: 56px; overflow: hidden; transition: background-color .3s ease, border-color .3s ease, box-shadow .25s ease; }
#words.enter > .group { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms); }
.ghead { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; }
.ghead .gt { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.ghead h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; }
.ghead .sub { font-size: 13px; color: var(--faint); }
.ghead .cnt { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.chev { width: 18px; height: 18px; color: var(--faint); transition: transform .28s var(--ease); flex: none; align-self: center; }
.group.closed .chev { transform: rotate(-90deg); }
.wlw { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .32s var(--ease); }
.group.closed .wlw { grid-template-rows: 0fr; }
.wl { overflow: hidden; min-height: 0; }
.wli { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); column-gap: 30px; padding: 0 14px 4px; transition: opacity .25s ease; }
.group.closed .wli { opacity: 0; }

/* word row */
.w { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 26px; grid-template-areas: "c1 c2 mo" "c3 c3 c3"; column-gap: 14px; padding: 9px 4px; margin: 0 -4px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 8px; transition: background-color .2s ease; }
.w:hover { background: color-mix(in srgb, var(--chip) 60%, transparent); }
.c1 { grid-area: c1; min-width: 0; } .c2 { grid-area: c2; min-width: 0; } .c3 { grid-area: c3; min-width: 0; }
.t1 { font-weight: 700; font-size: 17px; line-height: 1.25; }
.t2 { font-size: 15.5px; font-weight: 500; line-height: 1.3; }
.s1, .s2 { font-size: 12.5px; color: var(--muted); line-height: 1.35; margin-top: 1px; }
.tr { color: var(--faint); }
.plw i { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--faint); margin-right: 3px; }
.plw b { font-weight: 600; }
.pl { font-size: 10px; font-weight: 700; color: var(--faint); margin-left: 4px; vertical-align: 2px; }
.c3 { display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: baseline; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.c3:empty { display: none; }
.xtr { font-style: italic; }
.nt::before { content: "!"; color: var(--warn); font-weight: 800; margin-right: 4px; }
.expill { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; font-size: 11.5px; font-weight: 600; padding: 1px 9px; cursor: pointer; }
.expill:hover { border-color: var(--accent); }
.q { font-size: 10px; font-weight: 700; color: var(--warn); border: 1px dashed var(--warn); border-radius: 4px; padding: 0 4px; margin-left: 5px; vertical-align: 2px; }
.g-m { color: var(--m); } .g-f { color: var(--f); } .g-n { color: var(--n); }
.p-m { color: var(--m2); } .p-f { color: var(--f2); } .p-n { color: var(--n2); }
.more { grid-area: mo; align-self: start; border: 0; background: transparent; width: 28px; height: 28px; margin: -3px -4px 0 0; border-radius: 8px; cursor: pointer; color: var(--faint); display: grid; place-items: center; padding: 0; }
.more:hover { background: var(--chip); color: var(--ink); }
.more svg { width: 16px; height: 16px; }
body.selecting .w { padding-left: 30px; }
body.selecting .more, body.selecting .expill { visibility: hidden; }
.sel { position: absolute; left: 4px; top: 11px; width: 18px; height: 18px; accent-color: var(--accent); pointer-events: none; animation: pop .2s var(--spring); }
.w.picked { background: color-mix(in srgb, var(--accent) 10%, transparent); }
body.hide-m .w .c2, body.hide-m .w .c3, body.hide-t .w .c1, body.hide-t .w .c3 { transition: filter .25s ease, opacity .25s ease; }
body.hide-m .w:not(.shown) .c2, body.hide-m .w:not(.shown) .c3,
body.hide-t .w:not(.shown) .c1, body.hide-t .w:not(.shown) .c3 { filter: blur(7px); opacity: .75; user-select: none; pointer-events: none; }

/* menu */
.menu { position: fixed; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 34px rgba(0,0,0,.2); padding: 4px; min-width: 210px; display: grid; transform-origin: top right; }
.menu:not([hidden]) { animation: pop .18s var(--spring); }
.menu button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 9px; cursor: pointer; font-size: 15px; }
.menu button:hover { background: var(--chip); }
.menu button.danger { color: var(--danger); }

/* rule sheets */
.sheets-head { display: grid; gap: 4px; scroll-margin-top: 56px; margin-top: 8px; }
.sheets-head h2 { font-family: var(--display); font-size: 24px; margin: 0; }
.sheets-head p { margin: 0; color: var(--muted); font-size: 14px; }
.sheets { columns: 2 24rem; column-gap: 16px; }
.sheet { break-inside: avoid; background: var(--note); color: var(--note-ink); border: 1px solid var(--note-line); border-radius: 12px; padding: 12px 16px 14px; margin: 0 0 16px; display: grid; gap: 9px; transition: transform .2s var(--ease), box-shadow .2s ease; }
.sheet:hover { transform: translateY(-1px) rotate(-.2deg); box-shadow: 0 8px 20px rgba(0,0,0,.08); }
.sheet .sbar { display: flex; justify-content: space-between; align-items: center; }
.sheet .no { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; opacity: .7; }
.sheet .x { border: 0; background: transparent; color: var(--note-ink); opacity: .55; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 18px; line-height: 1; }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 19px; line-height: 1.2; }
.sheet p { margin: 0; font-size: 14px; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.sheet .tw { overflow-x: auto; }
.sheet table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.sheet th, .sheet td { text-align: left; vertical-align: top; padding: 5px 8px 5px 0; border-top: 1px solid var(--note-line); }
.sheet th { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; opacity: .75; border-top: 0; }
.sheet .m { color: var(--m); font-weight: 700; } .sheet .f { color: var(--f); font-weight: 700; } .sheet .n { color: var(--n); font-weight: 700; }
.fix { color: var(--f); text-decoration: line-through; }

/* floating bars */
.floatbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 8px 8px 8px 14px; border-radius: 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 8px; align-items: center; z-index: 25; width: max-content; max-width: calc(100vw - 24px); box-shadow: 0 10px 30px rgba(0,0,0,.28); font-size: 14px; }
.floatbar:not([hidden]) { animation: toast-in .32s var(--spring); }
.floatbar button { background: transparent; border: 1px solid color-mix(in srgb, var(--surface) 45%, transparent); color: inherit; border-radius: 9px; padding: 6px 11px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.floatbar button:disabled { opacity: .45; cursor: default; }
.floatbar button.solid { background: var(--surface); color: var(--ink); border-color: var(--surface); }
#toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; }
#toast.leaving { animation: fade-out .2s ease forwards; }
/* update banner */
.updbar { position: fixed; z-index: 70; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 24px); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 16px; background: color-mix(in srgb, var(--surface) 95%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); border: 1px solid var(--line); box-shadow: 0 12px 34px rgba(0,0,0,.16); font-size: 13.5px; color: var(--ink); }
.updbar:not([hidden]) { animation: upd-in .5s var(--spring); }
.updbar #upd-text span { color: var(--muted); }
.upd-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); animation: upd-pulse 2s ease-in-out infinite; }
.upd-x { border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 10px; cursor: pointer; font-size: 13px; flex: none; }
.upd-x:hover { background: var(--line); }
@keyframes upd-in { from { opacity: 0; transform: translate(-50%, -24px) scale(.96); } }
@keyframes upd-pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent); } }
@media (prefers-reduced-motion: reduce) { .updbar:not([hidden]), .upd-dot { animation: none; } }
@media (max-width: 520px) { .updbar { flex-wrap: wrap; justify-content: flex-end; } .updbar #upd-text { flex: 1 1 calc(100% - 30px); } }

/* dialogs */
dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); padding: 0; width: min(580px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
dialog::backdrop { background: rgba(10, 14, 22, .5); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
dialog[open] { animation: dlg-in .3s var(--spring); }
dialog[open]::backdrop { animation: fade-in .25s ease; }
dialog.closing { animation: dlg-out .18s ease forwards; }
dialog.closing::backdrop { animation: fade-out .18s ease forwards; }
.dbody, dialog form { padding: 18px; display: grid; gap: 12px; }
.dtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
dialog h2 { margin: 0; font-family: var(--display); font-size: 22px; }
.xbtn { border: 0; background: var(--chip); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.xbtn:hover { background: var(--line); }
.field { display: grid; gap: 4px; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; font-family: inherit; transition: border-color .2s, box-shadow .2s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); outline: none; }
.field textarea { resize: vertical; min-height: 70px; }
.field small, .hint { color: var(--faint); font-size: 12.5px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
fieldset { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--accent); padding: 0 6px; text-transform: uppercase; }
.fsets { display: flex; flex-direction: column; gap: 12px; }
#fs-cz { order: 1; } .fsets .afbar { order: 2; } #fs-en { order: 3; } #fs-tr { order: 4; }
body[data-dict="en"] #fs-cz { order: 3; } body[data-dict="en"] #fs-en { order: 1; }
.afbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.afbar .hint { flex: 1 1 200px; }
.afmsg { font-size: 13px; color: var(--muted); flex-basis: 100%; }
.afmsg.err { color: var(--danger); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
.checks label, .opt { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.formbtns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.err { color: var(--danger); font-size: 13px; }
.scope { display: grid; gap: 8px; }
.glist { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; max-height: 200px; overflow: auto; font-size: 14px; }
.glist small { color: var(--faint); }
details.more-f summary { cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 600; padding: 4px 0; }
details.more-f[open] { display: grid; gap: 10px; }
details.more-f[open] > :not(summary) { animation: rise .3s var(--ease) both; }
.dsec { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.dsec h3 { margin: 0; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.dsec .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.dsec p { margin: 0; }
.dsec > * { animation: rise .4s var(--ease) both; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; cursor: pointer; }
.toggle input { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background-color .2s ease; flex: none; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s var(--spring); }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { transform: translateX(18px); }
.syncline { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--muted); }
.syncline i { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); margin-top: 6px; flex: none; }
.syncline.on i { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }

/* word detail */
.dbig { font-family: var(--display); font-size: 32px; font-weight: 700; line-height: 1.1; }
.dline { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: baseline; font-size: 15px; }
.dline .k { font-size: 10.5px; font-weight: 800; color: var(--faint); letter-spacing: .05em; }
.def { margin: 0; }
.def.t { font-style: italic; color: var(--muted); font-size: 14px; }
.exs { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.exs li { display: grid; gap: 1px; }
.exs .c { font-weight: 600; } .exs .u { color: var(--muted); font-size: 14px; }

/* photo import */
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); animation: pop .25s var(--spring); }
.dropzone { display: grid; place-items: center; gap: 6px; padding: 18px; border: 1.5px dashed var(--line); border-radius: 14px; cursor: pointer; text-align: center; color: var(--muted); transition: border-color .2s, background-color .2s; }
.dropzone:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.dropzone svg { width: 30px; height: 30px; color: var(--accent); }
.busy { display: grid; justify-items: center; gap: 12px; padding: 18px 0; text-align: center; color: var(--muted); }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.pbar2 { width: 100%; height: 5px; border-radius: 4px; background: var(--line); overflow: hidden; }
.pbar2 i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s var(--ease); }
.rv { display: grid; gap: 0; max-height: 52vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
.rv label { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr); gap: 8px 10px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); cursor: pointer; animation: rise .35s var(--ease) both; }
.rv label:first-child { border-top: 0; }
.rv input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.rv .rw b { font-size: 15.5px; } .rv .rw small { display: block; color: var(--muted); font-size: 12.5px; }
.rv select { grid-column: 2 / 4; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.rv .dup { color: var(--warn); font-size: 11.5px; font-weight: 700; }

/* trainer */
.trainer { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.trainer:not([hidden]) { animation: fade-in .25s ease; }
.t-top { display: flex; align-items: center; gap: 12px; max-width: 560px; width: 100%; margin: 0 auto; }
.t-top .ttl { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-top .prog { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pbar { height: 4px; background: var(--line); border-radius: 4px; max-width: 560px; width: 100%; margin: 8px auto 0; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .35s var(--ease); }
.stage { display: grid; place-items: center; min-height: 0; padding-block: 14px; overflow: auto; }
.card { position: relative; width: min(540px, 100%); min-height: min(360px, 54vh); background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 12px 34px rgba(0,0,0,.09); display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 10px; text-align: center; padding: 30px 20px; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; transition: transform .28s var(--ease), opacity .28s ease; animation: card-in .38s var(--spring) both; }
.card.drag { transition: none; cursor: grabbing; }
.card .kind { font-size: 12px; color: var(--faint); font-weight: 600; }
.card .big { font-family: var(--display); font-size: clamp(26px, 7vw, 40px); font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.card .defq { font-size: clamp(17px, 4.2vw, 21px); line-height: 1.45; max-width: 44ch; justify-self: center; }
.card .sub2 { font-size: 15px; color: var(--muted); }
.card .ans { display: grid; gap: 5px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; animation: rise .3s var(--ease) both; }
.card .ans .big { font-size: clamp(24px, 6vw, 32px); }
.card .hint { font-size: 12.5px; color: var(--faint); }
.stamp { position: absolute; top: 16px; font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; border: 2px solid; opacity: 0; }
.stamp.yes { right: 16px; color: var(--ok); } .stamp.no { left: 16px; color: var(--danger); }
.t-btns { display: flex; gap: 10px; max-width: 560px; width: 100%; margin: 0 auto; }
.t-btns .btn { flex: 1; padding: 13px; font-size: 16px; border-radius: 14px; }
.t-btns .no { color: var(--danger); } .t-btns .yes { color: var(--ok); }
.keys { text-align: center; font-size: 12px; color: var(--faint); margin-top: 8px; }
.done { width: min(540px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: grid; gap: 12px; animation: card-in .4s var(--spring) both; }
.done h2 { margin: 0; font-family: var(--display); font-size: 26px; }
.done p { margin: 0; }
.done ul { margin: 0; padding-left: 18px; max-height: 40vh; overflow: auto; display: grid; gap: 3px; }
.done .row3 { display: flex; flex-wrap: wrap; gap: 8px; }

/* credits */
.credit { font-size: 12.5px; color: var(--faint); text-align: center; }
.credit .nick { font-weight: 800; letter-spacing: .02em; background: linear-gradient(90deg, var(--accent), #e0524a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.heart { color: #e25555; display: inline-block; animation: beat 1.8s ease-in-out infinite; }
@keyframes beat { 0%, 48%, 100% { transform: scale(1); } 12% { transform: scale(1.28); } 36% { transform: scale(1.14); } }
.chooser, .onboard { grid-template-rows: 1fr auto; }
.page-foot { padding-top: 18px; animation: fade-in .6s .15s both; }
.splash .sp-credit { animation: fade-in .6s .45s both; }
.app-foot { display: grid; justify-items: center; gap: 4px; padding: 20px 0 4px; margin-top: 8px; border-top: 1px solid var(--line); }

/* toast as a top-layer popover */
#toast[popover] { inset: auto; left: 50%; right: auto; top: auto; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); margin: 0; border: 0; overflow: visible; color: var(--surface); background: var(--ink); }
#toast[popover]:not(:popover-open) { display: none; }
#toast[popover]:popover-open { animation: toast-in .32s var(--spring); }

/* several photos */
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.thumb { position: relative; margin: 0; aspect-ratio: 1; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--chip); animation: pop .3s var(--spring) both; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .tnum { position: absolute; left: 6px; top: 6px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 11px; font-weight: 800; border-radius: 999px; min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 5px; }
.thumb .tdel { position: absolute; right: 5px; top: 5px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .62); color: #fff; font-size: 17px; line-height: 1; cursor: pointer; transition: transform .14s var(--ease); }
.thumb .tdel:active { transform: scale(.9); }
.thumb.add { display: grid; place-content: center; justify-items: center; gap: 4px; border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); cursor: pointer; font-size: 12.5px; font-weight: 700; text-align: center; padding: 6px; background: color-mix(in srgb, var(--accent) 6%, var(--surface)); transition: background-color .2s, transform .14s var(--ease); }
.thumb.add:hover { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.thumb.add:active { transform: scale(.96); }
.thumb.add svg { width: 28px; height: 28px; }
.scanstrip { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.thumb.sm { width: 66px; height: 66px; aspect-ratio: auto; }
.thumb.scanning { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.thumb.scanning::after { content: ""; position: absolute; left: 0; right: 0; height: 40%; top: -40%; background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--accent) 60%, transparent), transparent); animation: scan 1.1s linear infinite; }
.thumb.scanned::before { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, .45); color: #fff; font-size: 24px; font-weight: 800; animation: fade-in .3s; z-index: 1; }
@keyframes scan { to { top: 100%; } }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; text-align: left; width: min(340px, 100%); }
.steps li { display: flex; gap: 10px; align-items: center; color: var(--faint); font-size: 14px; transition: color .25s; }
.steps li i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; transition: background-color .25s, border-color .25s; }
.steps li.on { color: var(--ink); font-weight: 600; }
.steps li.on i { border-top-color: var(--accent); animation: spin .8s linear infinite; }
.steps li.ok { color: var(--muted); }
.steps li.ok i { background: var(--ok); border-color: var(--ok); color: #fff; animation: pop .3s var(--spring); }
.steps li.ok i::after { content: "✓"; }

/* review */
dialog.wide { width: min(760px, calc(100vw - 24px)); }
.rv-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rv-stat { background: var(--chip); border-radius: 14px; padding: 10px 12px; display: grid; animation: pop .35s var(--spring) both; }
.rv-stat b { font-size: 26px; font-family: var(--display); line-height: 1.1; }
.rv-stat span { font-size: 12px; color: var(--muted); }
.rv-stat:nth-child(2) { animation-delay: .06s; } .rv-stat:nth-child(3) { animation-delay: .12s; }
.rv-stat.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }
.rv-stat.warn b { color: var(--warn); }
.rv-check { display: grid; gap: 10px; padding: 12px; border-radius: 16px; background: color-mix(in srgb, var(--warn) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); animation: rise .4s var(--ease) both; }
.rv-check h3 { margin: 0; font-size: 15px; color: var(--warn); }
.rv-check > .hint { margin: -4px 0 0; }
.ck-card { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; animation: rise .4s var(--ease) both; overflow: hidden; }
.ck-card.nocrop { grid-template-columns: minmax(0, 1fr); }
.ck-crop { border: 0; padding: 0; background: none; cursor: zoom-in; display: grid; gap: 5px; justify-items: start; align-content: start; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.ck-crop canvas { border-radius: 10px; border: 1px solid var(--line); max-width: 100%; display: block; transition: transform .2s var(--ease), box-shadow .2s; }
.ck-crop:hover canvas { transform: scale(1.02); box-shadow: 0 6px 16px rgba(0, 0, 0, .15); }
.ck-crop span { display: inline-flex; align-items: center; gap: 4px; }
.ck-crop svg, .pbadge svg { width: 14px; height: 14px; flex: none; }
.ck-body { display: grid; gap: 7px; min-width: 0; align-content: start; }
.ck-guess { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.ck-guess b { font-size: 19px; }
.ck-guess span { color: var(--muted); }
.ck-guess small { color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background-color .18s, border-color .18s, color .18s, transform .14s var(--ease); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip:active { transform: scale(.95); }
.chip.cur { background: var(--surface); border-style: dashed; }
.ck-type { display: flex; gap: 6px; }
.ck-type input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.ck-type input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.ck-act { display: flex; gap: 6px; flex-wrap: wrap; }
.ck-busy { position: absolute; inset: 0; background: color-mix(in srgb, var(--surface) 84%, transparent); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); display: grid; place-content: center; justify-items: center; gap: 8px; font-size: 13px; color: var(--muted); animation: fade-in .2s; }
.rv-sec { display: grid; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms); }
.rv-sec header { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--chip); }
.rv-sec header h3 { flex: 1; margin: 0; font-family: var(--display); font-size: 17px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.rv-sec .cnt { font-size: 12px; color: var(--faint); }
.newtag { font-family: var(--body); font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); padding: 2px 7px; border-radius: 999px; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 12.5px; cursor: pointer; padding: 4px; }
.rv-row { display: grid; grid-template-columns: 22px minmax(0, 1.1fr) minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); cursor: pointer; transition: background-color .2s, opacity .2s; }
.rv-sec header + .rv-row, .rv-dups .rv-sec > .rv-row:first-child { border-top: 0; }
.rv-row:hover { background: color-mix(in srgb, var(--chip) 55%, transparent); }
.rv-row:has(input[type=checkbox]:not(:checked)) { opacity: .5; }
.rv-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.rv-row .rw b { font-size: 15.5px; }
.rv-row small { display: block; font-size: 12px; color: var(--muted); }
.rv-row .rt { font-size: 14px; }
.rv-row .rx { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.rv-row select { font-size: 12.5px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink); max-width: 160px; }

  ["What is this app?", "Your own dictionary for learning Czech or English. Each word can have translations, plural, a colour for its gender, synonyms, an explanation, a note and example sentences. Words are kept in topics, and you practise them with flip cards."],
  ["Website or Claude version: what's the difference?", "- **Website**: free and works in any browser. Words are saved on your device. To sync between devices, connect your own Google Drive. For AI help, add your own key: Gemini has a free tier, OpenAI is paid.\n- **Claude version**: opens inside Claude. Sync and AI are built in and use your own Claude account. Someone has to share it with you first.\n\nBoth work the same way, and you can move words between them (see “Sync and backup”)."],
  ["How do I put the app on my home screen?", "- **iPhone / iPad**: open the site in Safari, tap Share (the square with an arrow), then **Add to Home Screen** → **Add**.\n- **Android**: open the site in Chrome, tap ⋮, then **Add to home screen** or **Install app**.\n- **Computer**: in Chrome or Edge, click the install icon at the right end of the address bar (or ⋮ → **Install**).\n\nOn iPhone this also keeps your words safer: Safari can clear the data of websites you haven't opened for a while, but not of apps on the home screen."],
  ["How do I change the languages?", "Settings → Languages. The interface can be Ukrainian, English, Czech or Russian, and explanations, notes and example translations follow it. For each dictionary you choose a main translation and, if you like, an additional one shown in smaller text."],
 ]],
 ["Words", [
  ["How do I add a word?", "Tap **+ Word**, type the word and at least one translation, choose a topic and save. The ✨ button fills in the rest for you."],
  ["What does the ✨ button fill in?", "With AI (the Claude version, or your own AI key on the website) it fills in everything: translations, transcription, plural, gender, synonyms, explanation, a note when it helps, example sentences and the topic. You can type the word in any of your languages, even in the wrong field, and it finds the right word.\n\nWithout AI the website uses free online dictionaries, so you only get translations and pronunciation."],
  ["How do I add words from a photo?", "Tap **Photo**, add up to 10 photos of your notebook or textbook (or type a list), then start. The AI reads every photo, fills in each word and sorts the words into topics. Words it isn't sure about come first, with the spot on the photo marked, so you can pick the right word, type it yourself or skip it. Tick the words you want and tap Add.\n\nNo AI key on the website? Copy the instructions, send them with the photo to any AI chat (ChatGPT, Gemini, Claude), then paste the answer back."],
  ["What do the colours and symbols mean?", "- Blue: masculine, red: feminine, green: neuter. A lighter shade marks the plural.\n- **pl.** plural form · **≈** synonyms · **!** a note worth knowing\n- **[…]** how to read the Czech word (**:** is a long sound) · **/…/** English pronunciation\n\nTap a word to see everything about it."],
  ["How do I edit, move or delete words?", "Tap ⋯ next to a word to edit it, move it to another topic, archive it or delete it. For many words at once, tap **Select**, tick the words and choose what to do.\n- **Archive** is for words you already know: they leave the list and practice but stay saved.\n- **Trash** keeps deleted words until you delete them forever, so you can always restore them."],
  ["Topics, search and hiding", "Tap a topic's name to fold it, or tap the chips at the top to jump to a topic. The search box finds words in any language. **Hide translation** and **Hide word** turn the list into a quick self-test."],
 ]],
 ["Practice", [
  ["How does practice work?", "Tap **Practice** (or Practice next to a topic), choose what to practise and how: word → translation, translation → word, a mix, explanation → word, or the additional language. Tap the card to flip it. Swipe right (✓) if you know it, left (✕) to see it again. Missed words come back until you get them, and at the end you see which ones to work on.\n\nOn a computer: Space flips the card, → means I know, ← means again."],
 ]],
 ["Sync and backup", [
  ["How does sync work?", "**Claude version**: sign in to Claude with the same account on your phone and computer and open the same link. Every change is saved at once and appears on the other device.\n\n**Website**: Settings → Sync → **Connect Google Drive** and choose your Google account. Your words are saved in a hidden app folder in your own Google Drive. On the other device, connect the same Google account. Google lets a website stay signed in for about an hour, so after that the app shows **Sync** at the top: one tap and you're up to date.\n\nChanges from both devices are combined word by word, so nothing gets lost."],
  ["Is my dictionary private?", "Yes. On the website your words stay on your device, and in your own Google Drive if you connect it. In the Claude version every person has their own dictionary that nobody else can see, not even the person who shared the page."],
  ["Can I lose my words if I close the app or it updates?", "No. Every change is saved straight away. Updates never delete words, and before an update the website keeps a safety copy. For extra safety make a backup now and then: Settings → Backup → **Download file**."],
  ["How do I move words to another device or between the website and the Claude version?", "On the first one: Settings → **Copy my words** (or Backup → Download file). On the other one: Settings → Import → paste the text or choose the file → **Add to my words**. Nothing is overwritten: new words are added and missing details are filled in."],
  ["How do updates work?", "The website shows **Version X is out** at the top: tap **Update**. Your words stay. The Claude version updates by itself. The version number is at the bottom of the app and in Settings."],
 ]],
 ["AI", [
  ["Do I need AI?", "No. Everything works without it. AI only saves time: it fills in words for you and reads photos."],
  ["Who pays for the AI?", "Everyone uses their own. In the Claude version it runs on the Claude account of whoever is using it. On the website it uses your own key: Gemini has a free tier, OpenAI is paid per use. Nobody else's money or limits are used."],
  ["How do I get a free Gemini key?", "- Open [Google AI Studio](https://aistudio.google.com/apikey) and sign in with Google.\n- Tap **Create API key** and copy it.\n- In the app: Settings → AI helper → **Gemini** → paste the key → **Save and check**.\n\nOn the free tier Google may use what you send to improve its products, so don't send anything private. Free use has daily limits; if you reach one, try again later."],
  ["Can I use ChatGPT / OpenAI?", "Yes, with an API key from [platform.openai.com](https://platform.openai.com/api-keys). The API is paid separately from a ChatGPT subscription, so that account needs credit. Then Settings → AI helper → **OpenAI** → paste → **Save and check**."],
  ["Is my key safe?", "It's stored only on this device and sent only to Google or OpenAI. It's never synced and never included in backups. Don't share it; you can remove it in Settings at any time."],
  ["No key? Use any AI chat", "Settings → New words via an AI chat: copy the instructions and send them to any free chat (ChatGPT, Gemini, Claude) with a photo or a list of words. Then paste the answer into Import."],
 ]],
 ["Other", [
  ["Sounds", "Soft sounds play when you open the app, windows and tabs, add words and practise. Turn them off in Settings → Appearance → **Sounds**. On iPhone the silent switch mutes them too."],
  ["Dark mode", "Settings → Appearance: like your device, light or dark."],
  ["Does it work offline?", "Yes. Once the website has been opened, it works without internet. Sync and AI need internet; your changes are sent when you're back online."],
  ["Something isn't working", "Reload the page or the app first. If words seem to be missing, check the Archive and Trash tabs. On the website, check Settings → Sync. And keep a backup file, so nothing can ever be lost."],
  ["Who made this?", "aykus. Made with ♥."],
 ]],
],
uk: [
 ["Початок", [
  ["Що це за застосунок?", "Твій власний словник для вивчення чеської або англійської. У кожного слова можуть бути переклади, множина, колір роду, синоніми, пояснення, нотатка й приклади речень. Слова зібрані за темами, а вчити їх можна на картках."],
  ["Сайт чи версія в Claude: у чому різниця?", "- **Сайт**: безкоштовний і працює в будь-якому браузері. Слова зберігаються на твоєму пристрої. Для синхронізації між пристроями підключи свій Google Диск. Для допомоги ШІ додай свій ключ: у Gemini є безкоштовний рівень, OpenAI платний.\n- **Версія в Claude**: відкривається всередині Claude. Синхронізація й ШІ вже вбудовані й працюють на твоєму акаунті Claude. Спершу хтось має поділитися нею з тобою.\n\nОбидві працюють однаково, і слова можна переносити між ними (див. «Синхронізація і резервна копія»)."],
  ["Як додати застосунок на головний екран?", "- **iPhone / iPad**: відкрий сайт у Safari, натисни «Поділитися» (квадрат зі стрілкою) → **На початковий екран** → **Додати**.\n- **Android**: відкрий сайт у Chrome, натисни ⋮ → **Додати на головний екран** або **Установити застосунок**.\n- **Комп'ютер**: у Chrome чи Edge натисни значок встановлення праворуч в адресному рядку (або ⋮ → **Установити**).\n\nНа iPhone так слова ще й надійніше збережені: Safari може стерти дані сайтів, які давно не відкривали, але не застосунків на головному екрані."],
  ["Як змінити мови?", "Налаштування → Мови. Інтерфейс може бути українською, англійською, чеською або російською — пояснення, нотатки й переклади прикладів підлаштовуються під нього. Для кожного словника обери головний переклад і, за бажанням, додатковий — він показується дрібніше."],
 ]],
 ["Слова", [
  ["Як додати слово?", "Натисни **+ Слово**, напиши слово й хоча б один переклад, обери тему й збережи. Кнопка ✨ допише решту сама."],
  ["Що заповнює кнопка ✨?", "З ШІ (версія в Claude або твій власний ключ ШІ на сайті) — усе: переклади, транскрипцію, множину, рід, синоніми, пояснення, нотатку, якщо вона корисна, приклади речень і тему. Слово можна написати будь-якою своєю мовою, навіть не в тому полі, — воно знайде правильне.\n\nБез ШІ сайт бере дані з безкоштовних онлайн-словників, тож буде лише переклад і вимова."],
  ["Як додати слова з фото?", "Натисни **Фото**, додай до 10 фото зошита чи підручника (або напиши список) і запусти. ШІ прочитає кожне фото, заповнить кожне слово й розкладе слова за темами. Слова, у яких він не впевнений, будуть першими — з позначеним місцем на фото: обери правильне слово, напиши своє або пропусти. Познач потрібні слова й натисни «Додати».\n\nНемає ключа ШІ на сайті? Скопіюй інструкцію, надішли її разом із фото в будь-який чат ШІ (ChatGPT, Gemini, Claude) і встав відповідь назад."],
  ["Що означають кольори й позначки?", "- Синій — чоловічий рід, червоний — жіночий, зелений — середній. Світліший відтінок — множина.\n- **мн.** / **pl.** форма множини · **≈** синоніми · **!** нотатка, яку варто знати\n- **[…]** як читати чеське слово (**:** — довгий звук) · **/…/** англійська вимова\n\nТоркнись слова, щоб побачити все про нього."],
  ["Як редагувати, переносити чи видаляти слова?", "Натисни ⋯ біля слова: редагувати, перенести в іншу тему, в архів або видалити. Щоб зробити це з багатьма словами одразу, натисни **Вибрати**, познач слова й обери дію.\n- **Архів** — для слів, які ти вже знаєш: їх немає в списку й практиці, але вони збережені.\n- **Кошик** тримає видалені слова, доки не видалиш їх назавжди, тож їх завжди можна повернути."],
  ["Теми, пошук і приховування", "Торкнись назви теми, щоб згорнути її, або чипів угорі, щоб перейти до теми. Пошук знаходить слова будь-якою мовою. **Сховати переклад** і **Сховати слово** перетворюють список на швидку самоперевірку."],
 ]],
 ["Практика", [
  ["Як працює практика?", "Натисни **Практика** (або «Практика» біля теми), обери, що вчити і як: слово → переклад, переклад → слово, мікс, пояснення → слово або додаткова мова. Торкнись картки, щоб перевернути. Тягни вправо (✓), якщо знаєш, вліво (✕) — щоб повторити. Пропущені слова повертаються, доки не вивчиш, а в кінці видно, над якими попрацювати.\n\nНа комп'ютері: пробіл — перевернути, → — знаю, ← — ще раз."],
 ]],
 ["Синхронізація і резервна копія", [
  ["Як працює синхронізація?", "**Версія в Claude**: увійди в Claude з тим самим акаунтом на телефоні й комп'ютері та відкрий те саме посилання. Кожна зміна зберігається одразу й з'являється на іншому пристрої.\n\n**Сайт**: Налаштування → Синхронізація → **Підключити Google Диск** і обери свій акаунт Google. Слова зберігаються в прихованій папці застосунку на твоєму власному Google Диску. На іншому пристрої підключи той самий акаунт. Google тримає сайт увійденим приблизно годину, тож потім угорі з'явиться **Синхронізувати** — один дотик, і все оновлено.\n\nЗміни з обох пристроїв об'єднуються слово за словом, тож нічого не губиться."],
  ["Мій словник приватний?", "Так. На сайті слова лишаються на твоєму пристрої — і на твоєму Google Диску, якщо підключиш. У версії в Claude у кожної людини свій словник, який ніхто інший не бачить, навіть той, хто поділився сторінкою."],
  ["Чи можу я втратити слова, якщо закрию застосунок або він оновиться?", "Ні. Кожна зміна зберігається одразу. Оновлення ніколи не видаляють слова, а перед оновленням сайт зберігає запасну копію. Для надійності час від часу роби резервну копію: Налаштування → Резервна копія → **Завантажити файл**."],
  ["Як перенести слова на інший пристрій або між сайтом і версією в Claude?", "На першому: Налаштування → **Скопіювати мої слова** (або Резервна копія → Завантажити файл). На іншому: Налаштування → Імпорт → встав текст або обери файл → **Додати до моїх слів**. Нічого не перезаписується: нові слова додаються, а відсутні деталі доповнюються."],
  ["Як працюють оновлення?", "Угорі сайту з'являється **Вийшла версія X** — натисни **Оновити**. Слова лишаються. Версія в Claude оновлюється сама. Номер версії — внизу застосунку й у Налаштуваннях."],
 ]],
 ["ШІ", [
  ["Мені потрібен ШІ?", "Ні. Усе працює й без нього. ШІ лише економить час: заповнює слова за тебе й читає фото."],
  ["Хто платить за ШІ?", "Кожен користується своїм. У версії в Claude — акаунт Claude того, хто нею користується. На сайті — твій власний ключ: у Gemini є безкоштовний рівень, OpenAI оплачується за використання. Чужі гроші чи ліміти не витрачаються."],
  ["Як отримати безкоштовний ключ Gemini?", "- Відкрий [Google AI Studio](https://aistudio.google.com/apikey) і увійди через Google.\n- Натисни **Create API key** і скопіюй ключ.\n- У застосунку: Налаштування → Помічник ШІ → **Gemini** → встав ключ → **Зберегти й перевірити**.\n\nНа безкоштовному рівні Google може використовувати надіслане для покращення своїх продуктів, тож не надсилай нічого приватного. Безкоштовне використання має денні ліміти: якщо досягнеш, спробуй пізніше."],
  ["Чи можна з ChatGPT / OpenAI?", "Так, з ключем API з [platform.openai.com](https://platform.openai.com/api-keys). API оплачується окремо від підписки ChatGPT, тож на цьому акаунті потрібні кошти. Потім Налаштування → Помічник ШІ → **OpenAI** → встав → **Зберегти й перевірити**."],
  ["Мій ключ у безпеці?", "Він зберігається лише на цьому пристрої й надсилається тільки в Google або OpenAI. Він ніколи не синхронізується й не потрапляє в резервні копії. Нікому його не давай; прибрати можна в Налаштуваннях будь-коли."],
  ["Немає ключа? Будь-який чат ШІ", "Налаштування → Нові слова через чат ШІ: скопіюй інструкцію й надішли в будь-який безкоштовний чат (ChatGPT, Gemini, Claude) разом із фото чи списком слів. Потім встав відповідь в Імпорт."],
 ]],
 ["Інше", [
  ["Звуки", "М'які звуки грають, коли відкриваєш застосунок, вікна й вкладки, додаєш слова й практикуєшся. Вимкнути: Налаштування → Оформлення → **Звуки**. На iPhone їх також вимикає перемикач беззвучного режиму."],
  ["Темна тема", "Налаштування → Оформлення: як на пристрої, світла або темна."],
  ["Чи працює без інтернету?", "Так. Після першого відкриття сайт працює без інтернету. Синхронізації й ШІ потрібен інтернет; зміни надішлються, коли зв'язок повернеться."],
  ["Щось не працює", "Спершу перезавантаж сторінку або застосунок. Якщо слова ніби зникли, перевір вкладки «Архів» і «Кошик». На сайті перевір Налаштування → Синхронізація. І тримай файл резервної копії — тоді нічого не загубиться."],
  ["Хто це зробив?", "aykus. Зроблено з ♥."],
 ]],
],
cs: [
 ["Začínáme", [
  ["Co je to za aplikaci?", "Tvůj vlastní slovník pro učení češtiny nebo angličtiny. Každé slovo může mít překlady, množné číslo, barvu podle rodu, synonyma, vysvětlení, poznámku a příklady vět. Slova jsou rozdělená do témat a procvičuješ je na kartičkách."],
  ["Web, nebo verze v Claude: jaký je rozdíl?", "- **Web**: zdarma a funguje v každém prohlížeči. Slova se ukládají v tvém zařízení. Pro synchronizaci mezi zařízeními připoj svůj Google Disk. Pro pomoc AI přidej vlastní klíč: Gemini má bezplatnou úroveň, OpenAI je placené.\n- **Verze v Claude**: otevírá se uvnitř Claude. Synchronizace i AI jsou vestavěné a běží na tvém účtu Claude. Nejdřív ti ji musí někdo nasdílet.\n\nObě fungují stejně a slova mezi nimi můžeš přenášet (viz „Synchronizace a záloha“)."],
  ["Jak dát aplikaci na plochu?", "- **iPhone / iPad**: otevři web v Safari, klepni na Sdílet (čtverec se šipkou) → **Přidat na plochu** → **Přidat**.\n- **Android**: otevři web v Chromu, klepni na ⋮ → **Přidat na plochu** nebo **Nainstalovat aplikaci**.\n- **Počítač**: v Chromu nebo Edge klikni na ikonu instalace vpravo v adresním řádku (nebo ⋮ → **Nainstalovat**).\n\nNa iPhonu jsou tak slova i lépe chráněná: Safari může smazat data webů, které jsi dlouho neotevřel, ale ne aplikací na ploše."],
  ["Jak změnit jazyky?", "Nastavení → Jazyky. Rozhraní může být ukrajinsky, anglicky, česky nebo rusky a vysvětlení, poznámky i překlady příkladů se mu přizpůsobí. Pro každý slovník si vyber hlavní překlad a případně doplňkový, zobrazený menším písmem."],
 ]],
 ["Slova", [
  ["Jak přidat slovo?", "Klepni na **+ Slovo**, napiš slovo a aspoň jeden překlad, vyber téma a ulož. Tlačítko ✨ doplní zbytek za tebe."],
  ["Co doplní tlačítko ✨?", "S AI (verze v Claude nebo vlastní klíč AI na webu) úplně vše: překlady, výslovnost, množné číslo, rod, synonyma, vysvětlení, poznámku, když se hodí, příklady vět i téma. Slovo můžeš napsat v kterémkoli svém jazyce, i do špatného pole, a najde správné slovo.\n\nBez AI web používá bezplatné online slovníky, takže doplní jen překlady a výslovnost."],
  ["Jak přidat slova z fotky?", "Klepni na **Fotka**, přidej až 10 fotek sešitu nebo učebnice (nebo napiš seznam) a spusť. AI přečte každou fotku, doplní každé slovo a rozdělí slova do témat. Slova, kterými si není jistá, jsou první, s označeným místem na fotce: vyber správné slovo, napiš vlastní, nebo ho přeskoč. Zaškrtni slova, která chceš, a klepni na Přidat.\n\nNemáš na webu klíč AI? Zkopíruj návod, pošli ho s fotkou do libovolného chatu s AI (ChatGPT, Gemini, Claude) a odpověď vlož zpět."],

<script>
"use strict";
const APP_VERSION = "0.7";
const NICK = "aykus";
const BUILD = window.VOKAB_BUILD || "web";

/* ================= i18n ================= */
const LANGS = ["uk", "en", "cs", "ru"];
const LOCALES = { uk: "uk-UA", en: "en-GB", cs: "cs-CZ", ru: "ru-RU" };
let LANG = "uk";
let AI_NAME = "Claude";                                        // on the website: the person's own AI (Gemini / GPT)
const AI_KEYS = new Set(["ph_hint", "ph_reading", "ph_err_grant", "ph_err_rate", "af_claude", "af_claude_hint", "rv_check_p", "rv_refilling"]);
function t(k, ...a) {
  const row = I18N[k];
  if (!row) { console.error("i18n missing: " + k); return k; }
  let s = row[LANGS.indexOf(LANG)] ?? row[0];
  if (AI_NAME !== "Claude" && AI_KEYS.has(k)) s = s.replace(/Claude/g, AI_NAME);
  a.forEach((v, i) => { s = s.split("{" + i + "}").join(v); });
  return s;
}
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
  const at = $("meta-apptitle"); if (at) at.content = t("app") + (window.VOKAB_DEFAULT === "cs" ? " CZ" : window.VOKAB_DEFAULT === "en" ? " EN" : "");
  const mf = $("manifest-link"); if (mf) mf.href = `manifest-${window.VOKAB_DEFAULT ? window.VOKAB_DEFAULT + "-" : ""}${LANG}.json`;
  document.querySelectorAll("#langseg [data-lang], #ob-langs [data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  $("ch-ver").textContent = t("s_version", APP_VERSION);
  document.querySelectorAll("[data-credit]").forEach(el => { el.innerHTML = creditHTML(); });
  const av = $("app-ver"); if (av) av.textContent = `${t("app")} · ${t("s_version", APP_VERSION)}`;
}
function creditHTML() { return esc(t("made_by")).replace("♥", '<span class="heart" aria-hidden="true">♥</span>').replace("{0}", `<b class="nick">${NICK}</b>`); }

/* ================= helpers ================= */
const $ = id => document.getElementById(id);

/* ================= autofill: Claude (Claude version) or free online dictionaries (website) ================= */
async function getJSON(url) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (r.status === 404) return null; if (!r.ok) throw new Error("http " + r.status); return await r.json(); }
  finally { clearTimeout(timer); }
}
async function translate(text, from, to) {
  const j = await getJSON(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
  const s = String(j?.responseData?.translatedText || "").trim();
  if (!s || Number(j?.responseStatus) !== 200 || /MYMEMORY WARNING|INVALID|QUERY LENGTH/i.test(s)) return "";
  let out = s.replace(/[.。!]+$/, "");
  if (text[0] && text[0] === text[0].toLowerCase()) out = out.charAt(0).toLowerCase() + out.slice(1);
  return fold(out) === fold(text) ? "" : out;
}
async function englishInfo(word) {
  const w = word.replace(/^to\s+/i, "").trim();
  if (!w || /\s/.test(w)) return null;
  const j = await getJSON(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(w.toLowerCase())}`);
  if (!Array.isArray(j) || !j[0]) return null;
  const e = j[0], meanings = e.meanings || [];
  const ipa = e.phonetic || (e.phonetics || []).map(p => p.text).find(Boolean) || "";
  const defs = meanings.flatMap(m => m.definitions || []);
  const syn = [...new Set(meanings.flatMap(m => [...(m.synonyms || []), ...(m.definitions || []).flatMap(d => d.synonyms || [])]))].filter(s => s.toLowerCase() !== w.toLowerCase()).slice(0, 2);
  return { ipa, def: defs[0]?.definition || "", example: defs.map(d => d.example).find(Boolean) || "", syn, pos: meanings[0]?.partOfSpeech || "" };
}
function guessGender(cz, pos) {
  const s = cz.toLowerCase().trim();
  if (pos === "verb" || /(at|it|et|ět|out|ovat|nout|ít|ýt)( se| si)?$/.test(s)) return "v";
  if (pos === "adjective" || /ý$/.test(s)) return "a";
  if (pos === "adverb") return "d";
  if (/\s/.test(s)) return "x";
  if (/(a|e|ě|ost)$/.test(s)) return "f";
  if (/(o|í|um)$/.test(s)) return "n";

}

let sample = null, sampleImages = null;

function sampleErr(e) {

  if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(c)) return t("ph_err_grant");

}
function fieldSpec(dk) {

- "g": gender of the Czech noun "m", "f", "n"; for other words "v" verb, "a" adjective, "d" adverb, "x" phrase
- "pl": true only if the noun exists only in the plural (kalhoty)

- "czTr": how to read the Czech word in Ukrainian letters in square brackets, ":" marks a long vowel, e.g. "[ржі:м]"; only for words that are hard to read, otherwise ""
- "czSyn": up to 2 common Czech synonyms, or []
- "en": short English translation; "enTr": its IPA, e.g. "/ˈtraʊzəz/"; "enSyn": up to 2 English synonyms
- "uk": Ukrainian translation (1–3 words); "ru": Russian translation (1–3 words)

/* ================= import / merge ================= */
function parseImport(text) {
  let s = String(text || "").trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) s = fence[1].trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}"); if (a < 0 || b < a) throw new Error(t("imp_bad"));
  try { return JSON.parse(s.slice(a, b + 1)); } catch (_) { throw new Error(t("imp_bad")); }
}
function packToDict(obj, dk) {
  if (Array.isArray(obj.groups)) return normDict({ groups: obj.groups, sheets: obj.sheets }, dk);
  const out = emptyDict();
  out.topics = (obj.topics || []).map((g, i) => normTopic(g, i, dk));
  for (const w of (obj.words || [])) {
    let gid = w.gid;
    if (!gid && w.topic) {
      const r = resolveTopic(dk, w.topic);
      if (r.id) gid = r.id;
      else {
        const vals = Object.values(r.name).map(fold);
        let tp = out.topics.find(x => Object.values(x.name).some(n => vals.includes(fold(n))));
        if (!tp) { tp = normTopic({ name: r.name }, out.topics.length, dk); out.topics.push(tp); }
        gid = tp.id;
      }
    }
    out.words.push(normWord({ ...w, gid: gid || "" }, dk));
  }
  out.sheets = (obj.sheets || []).map(normSheet);
  return out;
}
function fillWord(dst, src) {
  for (const k of ["cz", "czTr", "plural", "en", "enTr", "uk", "ru"]) if (!dst[k] && src[k]) dst[k] = src[k];
  if (dst.g === "x" && src.g !== "x") dst.g = src.g;
  for (const k of ["czSyn", "enSyn"]) if (!dst[k].length && src[k].length) dst[k] = src[k].slice();
  for (const k of ["note", "expl"]) { const o = { ...dst[k] }; for (const l of LANGS) if (!o[l] && src[k][l]) o[l] = src[k][l]; dst[k] = o; }
  if (!dst.ex.length) dst.ex = src.ex.map(e => ({ ...e }));
  else dst.ex = dst.ex.map(e => { const m = src.ex.find(x => fold(x.t) === fold(e.t)); if (!m) return e; const o = { ...e }; for (const l of LANGS) if (!o[l] && m[l]) o[l] = m[l]; return o; });
}
function mergeInto(dk, src, stats) {
  const dst = store.dicts[dk], TFk = LF[DICTS[dk].T], tmap = new Map();
  for (const tp of src.topics) {
    const vals = Object.values(tp.name).map(fold);
    let hit = dst.topics.find(x => x.id === tp.id) || dst.topics.find(x => Object.values(x.name).some(n => vals.includes(fold(n))));
    if (!hit) { hit = { ...tp, order: maxOrder(dst.topics) + 10 }; dst.topics.push(hit); stats.groups++; }
    else { const nm = { ...hit.name }; for (const l of LANGS) if (!nm[l] && tp.name[l]) nm[l] = tp.name[l]; hit.name = nm; }
    tmap.set(tp.id, hit.id);
  }
  let o = Date.now();
  for (const w0 of src.words) {
    const w = { ...w0, gid: tmap.get(w0.gid) || w0.gid };
    if (!w[TFk] && !w.uk && !w.en) continue;
    const hit = dst.words.find(x => x.id === w.id) || dst.words.find(x => !x.deleted && low(x[TFk]) && low(x[TFk]) === low(w[TFk]));
    if (hit) { fillWord(hit, w); stats.updated++; }
    else { if (!Number.isFinite(w.o) || w.o > 1e12) w.o = o++; dst.words.push(w); stats.added++; }
  }
  for (const s of src.sheets) {
    const hit = dst.sheets.find(x => x.id === s.id) || dst.sheets.find(x => fold(loc(x.title)) === fold(loc(s.title)));
    if (!hit) { dst.sheets.push({ ...s, order: maxOrder(dst.sheets) + 10 }); stats.sheets++; }
    else {
      const title = { ...hit.title }, blocks = { ...hit.blocks };
      for (const l of LANGS) { if (!title[l] && s.title[l]) title[l] = s.title[l]; if (!blocks[l] && s.blocks[l]) blocks[l] = s.blocks[l]; }
      hit.title = title; hit.blocks = blocks;
    }
  }

}
function importText(text, replace) {
  const obj = parseImport(text);
  const stats = { added: 0, updated: 0, groups: 0, sheets: 0, dict: null };
  if (obj.dicts) {
    if (replace) store.dicts = { cs: normDict(obj.dicts.cs, "cs"), en: normDict(obj.dicts.en, "en") };
    else for (const k of ["cs", "en"]) if (obj.dicts[k]) mergeInto(k, normDict(obj.dicts[k], k), stats);
  } else if (obj.groups || obj.words) {
    const k = obj.dict === "en" ? "en" : "cs"; stats.dict = k;
    if (replace) store.dicts[k] = emptyDict();
    mergeInto(k, packToDict(obj, k), stats);
  } else throw new Error(t("imp_nowords"));
  save(); state.animate = true;
  if (stats.dict && stats.dict !== state.dict) openDict(stats.dict); else if (state.dict) render(); else showChooser();
  return stats;
}
const importSummary = (st, replace) => replace ? t("imp_replaced") : [t("imp_added", st.added), st.updated ? t("imp_updated", st.updated) : "", st.groups ? t("imp_topics", st.groups) : ""].filter(Boolean).join(", ");

/* ================= sounds: soft, short, made on the fly; off switch in Settings (per device) ================= */
const SFX = { ctx: null, out: null, last: 0 };
const soundOn = () => dev.sound !== false;
function unlockAudio() {                                   // browsers allow audio only after the first tap
  if (!soundOn()) return;
  if (!SFX.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      const c = new AC(), comp = c.createDynamicsCompressor(), out = c.createGain();
      out.gain.value = 1.5; out.connect(comp); comp.connect(c.destination);
      const b = c.createBufferSource(); b.buffer = c.createBuffer(1, 1, 22050); b.connect(c.destination); b.start(0);
      SFX.ctx = c; SFX.out = out;
    } catch (_) { return; }
  }
  if (SFX.ctx.state === "suspended") SFX.ctx.resume().catch(() => {});
}
addEventListener("pointerdown", unlockAudio, { capture: true, passive: true });
addEventListener("keydown", unlockAudio, { capture: true });
function tone(c, at, { f = 880, f2 = 0, type = "sine", dur = .2, vol = .06, attack = .008 } = {}) {
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, at);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + dur * .8);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + attack); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.connect(g); g.connect(SFX.out); o.start(at); o.stop(at + dur + .05);
}
function air(c, at, { dur = .22, vol = .05, from = 2600, to = 500, q = .9 } = {}) {   // a filtered breath of noise
  const n = Math.max(1, Math.floor(c.sampleRate * dur)), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
  s.buffer = buf; bp.type = "bandpass"; bp.Q.value = q;
  bp.frequency.setValueAtTime(from, at); bp.frequency.exponentialRampToValueAtTime(to, at + dur);
  g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + dur * .3); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  s.connect(bp); bp.connect(g); g.connect(SFX.out); s.start(at); s.stop(at + dur + .02);
}
const bell = (c, at, f, dur, vol) => { tone(c, at, { f, dur, vol, attack: .01 }); tone(c, at, { f: f * 2.01, dur: dur * .45, vol: vol * .18, attack: .008 }); };
const SOUNDS = {
  tap: (c, t0) => tone(c, t0, { f: 1900, f2: 1500, dur: .045, vol: .045, attack: .002 }),
  on: (c, t0) => tone(c, t0, { f: 1250, f2: 1650, dur: .065, vol: .05, attack: .003 }),
  off: (c, t0) => tone(c, t0, { f: 1300, f2: 950, dur: .065, vol: .045, attack: .003 }),
  open: (c, t0) => { air(c, t0, { dur: .16, vol: .025, from: 900, to: 2600, q: .7 }); tone(c, t0 + .02, { f: 587, f2: 880, dur: .17, vol: .04 }); },
  enter: (c, t0) => { air(c, t0, { dur: .35, vol: .016, from: 700, to: 3200, q: .6 }); [[659.25, .02], [987.77, .11], [1318.5, .2]].forEach(([f, d]) => bell(c, t0 + d, f, 1.1, .038)); },
  success: (c, t0) => { bell(c, t0, 783.99, .5, .045); bell(c, t0 + .08, 1174.66, .6, .04); },
  swoosh: (c, t0) => air(c, t0, { dur: .26, vol: .06, from: 2800, to: 480 }),
  flip: (c, t0) => air(c, t0, { dur: .1, vol: .05, from: 1500, to: 2600, q: 1.4 }),
  know: (c, t0) => { bell(c, t0, 1046.5, .35, .04); bell(c, t0 + .06, 1567.98, .45, .03); },
  again: (c, t0) => tone(c, t0, { f: 494, f2: 392, dur: .22, vol: .035, type: "triangle" }),
  done: (c, t0) => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(c, t0 + i * .09, f, .9, .036)),
  notify: (c, t0) => { bell(c, t0, 880, .5, .035); bell(c, t0 + .1, 1318.5, .7, .03); },
  error: (c, t0) => { tone(c, t0, { f: 330, dur: .13, vol: .04, type: "triangle" }); tone(c, t0 + .11, { f: 262, dur: .2, vol: .04, type: "triangle" }); },
};
function sfx(name) {
  const c = SFX.ctx;
  if (!c || !soundOn() || c.state === "closed" || !SOUNDS[name]) return;
  const now = performance.now();
  if ((name === "tap" || name === "open") && now - SFX.last < 60) return;   // one sound per gesture
  SFX.last = now;
  try { SOUNDS[name](c, c.currentTime + .005); } catch (_) {}
}

/* ================= updates (website): a banner when a new version is out; words always stay on the device ================= */
const verNum = v => String(v || "0").split(".").map(n => parseInt(n, 10) || 0);
const newer = (a, b) => { const x = verNum(a), y = verNum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0; } return false; };
let updShown = "", updBusy = false, lastUpdCheck = 0;
async function checkUpdate() {
  if (BUILD !== "web" || !/^https?:$/.test(location.protocol) || updBusy || Date.now() - lastUpdCheck < 60000) return;
  lastUpdCheck = Date.now();
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.version && newer(j.version, APP_VERSION) && updShown !== String(j.version)) showUpdate(String(j.version));
  } catch (_) {}
}
function showUpdate(v) {
  updShown = v;
  $("upd-text").innerHTML = `<b>${esc(t("upd_ready", v))}</b> <span>${esc(t("upd_safe"))}</span>`;
  $("updbar").hidden = false; sfx("notify");
}
function keepCopy(from) {                                  // a safety copy of the words from before an update
  const raw = lsGet(KEY);
  if (raw) lsSet("vokab:before-update", JSON.stringify({ at: Date.now(), from, data: raw }));
}
async function applyUpdate() {
  if (updBusy) return;
  updBusy = true; $("upd-go").disabled = true; $("upd-go").textContent = "…";
  persistLocal(); keepCopy(APP_VERSION);
  const pages = [...new Set(["./", "index.html", "cs.html", "en.html", location.pathname])];
  await Promise.all(pages.map(u => fetch(u, { cache: "reload" }).catch(() => {})));     // refresh the browser's copy of the pages
  try { const regs = (navigator.serviceWorker && await navigator.serviceWorker.getRegistrations()) || []; await Promise.all(regs.map(r => r.update().catch(() => {}))); } catch (_) {}
  try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (_) {}
  location.reload();
}
$("upd-go").addEventListener("click", applyUpdate);
$("upd-x").addEventListener("click", () => { $("updbar").hidden = true; });

/* ================= your own AI on the website: Gemini or OpenAI, with each person's own key (kept on this device) ================= */
const AIP = {
  gemini: { name: "Gemini", keyUrl: "https://aistudio.google.com/apikey" },
  openai: { name: "GPT", keyUrl: "https://platform.openai.com/api-keys" },

const aiCfg = () => (BUILD === "web" && dev.ai && dev.ai.key && AIP[dev.ai.p]) ? dev.ai : null;
const aiName = () => BUILD === "claude" ? "Claude" : (aiCfg() ? AIP[dev.ai.p].name : "AI");
const aiErr = (code, message) => Object.assign(new Error(message || code), { code });
const blobB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function parseAiJSON(text) {
  let s = String(text || "").trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) s = fence[1].trim();
  try { return JSON.parse(s); } catch (_) {}
  const a = s.search(/[[{]/), b = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]"));
  if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch (_) {} }

}
async function aiFetch(url, init, signal) {
  let r;
  try { r = await fetch(url, { ...init, signal }); }
  catch (e) { throw aiErr(e && e.name === "AbortError" ? "cancelled" : "offline"); }
  if (r.ok) return r.json();
  let body = null; try { body = await r.json(); } catch (_) {}
  const msg = JSON.stringify(body || "").toLowerCase();
  if (r.status === 429) throw aiErr(/quota|billing|insufficient/.test(msg) ? "quota" : "rate_limited");
  if (r.status === 401 || r.status === 403 || /api[_ ]?key|invalid.*key|permission/.test(msg)) throw aiErr("bad_key");
  if (r.status === 404 || /model.*(not.*found|does not exist|not supported)/.test(msg)) throw aiErr("no_model");
  if (r.status === 402 || /quota|billing|insufficient/.test(msg)) throw aiErr("quota");

async function geminiModels(key) {                          // the newest Flash model this key can use

  const ok = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent") && /flash/i.test(m.name) && !/image|tts|audio|live|thinking|embed/i.test(m.name));
