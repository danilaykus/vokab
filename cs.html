}

/* ================= website sync through each person's own Google Drive (hidden app folder) =================
   Every word, topic and sheet carries "u" (when it last changed); deleted ones leave a short note in store.gone,
   so two devices can be merged item by item without losing either side's changes. */
const GCID = () => String(window.VOKAB_GOOGLE_CLIENT_ID || "").trim();
const driveReady = () => BUILD === "web" && /\.apps\.googleusercontent\.com$/.test(GCID()) && /^https?:$/.test(location.protocol);
const DRIVE_FILE = "vokab-sync.json";
const known = new Map();                                     // "cs:w:id" -> canonical JSON without "u"
const itemKeys = () => { const out = []; for (const dk of ["cs", "en"]) for (const kind of ["w", "t", "s"]) for (const x of store.dicts[dk][listKey(kind)]) out.push([`${dk}:${kind}:${x.id}`, x]); return out; };
const bare = x => { const { u, ...r } = x; return canon(clean(r)); };
const prefsBare = () => canon(clean(store.prefs));
function rememberAll() { known.clear(); for (const [k, x] of itemKeys()) known.set(k, bare(x)); known.set("prefs", prefsBare()); }
function stampChanges() {                                    // called on every save: stamp what changed since the last save
  const now = Date.now(), seen = new Set();
  store.gone = store.gone || {};
  for (const [k, x] of itemKeys()) {
    seen.add(k);
    const c = bare(x);
    if (known.get(k) !== c) { x.u = now; known.set(k, c); delete store.gone[k]; }
  }
  for (const k of [...known.keys()]) if (k !== "prefs" && !seen.has(k)) { known.delete(k); store.gone[k] = now; }
  const pc = prefsBare(); if (known.get("prefs") !== pc) { known.set("prefs", pc); store.prefsU = now; }
  const old = now - 90 * 864e5; for (const k of Object.keys(store.gone)) if (store.gone[k] < old) delete store.gone[k];
}
function syncPayload() { return { app: "vokab", type: "sync", version: 2, at: Date.now(), dicts: store.dicts, prefs: store.prefs, prefsU: store.prefsU || 0, gone: store.gone || {} }; }
function mergeRemote(remote) {                               // newest version of every item wins; deletions win over older versions
  const gone = { ...(remote.gone || {}) };
  for (const [k, v] of Object.entries(store.gone || {})) gone[k] = Math.max(gone[k] || 0, v);
  let changed = false;
  for (const dk of ["cs", "en"]) {
    const rd = normDictKeepU(remote.dicts?.[dk], dk);
    for (const kind of ["w", "t", "s"]) {
      const key = listKey(kind), mine = store.dicts[dk][key], theirs = rd[key], out = [], ids = new Set([...mine.map(x => x.id), ...theirs.map(x => x.id)]);
      for (const id of ids) {
        const a = mine.find(x => x.id === id), b = theirs.find(x => x.id === id), g = gone[`${dk}:${kind}:${id}`] || 0;
        let pick = a && b ? ((b.u || 0) > (a.u || 0) ? b : a) : (a || b);
        if (g && g >= (pick.u || 0)) pick = null;
        if (pick) out.push(pick);
        if (pick !== a) changed = true;
      }
      store.dicts[dk][key] = out;
    }
    ensureTopics(store.dicts[dk]);
  }
  if ((remote.prefsU || 0) > (store.prefsU || 0) && remote.prefs) { store.prefs = normPrefs(remote.prefs); store.prefsU = remote.prefsU; changed = true; }
  store.gone = gone;
  return changed;
}
function normDictKeepU(d, dk) {
  const nd = normDict(d || {}, dk);
  for (const kind of ["w", "t", "s"]) { const src = (d && d[listKey(kind)]) || []; nd[listKey(kind)].forEach((x, i) => { const u = +(src.find(s => String(s.id) === x.id) || {}).u; if (u) x.u = u; }); }
  return nd;
}

/* sign-in: Google gives websites a key for about an hour, so after that one tap renews it */
const DRV = { tok: null, exp: 0, client: null, busy: false, timer: null, waiters: [] };
function loadGis() {
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true; s.onload = () => res(); s.onerror = () => rej(aiErr("offline")); document.head.appendChild(s); });
}
function tokenValid() {
  if (!DRV.tok && dev.drive?.tok && dev.drive.exp > Date.now() + 60000) { DRV.tok = dev.drive.tok; DRV.exp = dev.drive.exp; }
  return DRV.tok && DRV.exp > Date.now() + 60000;
}
function driveToken(ask) {                                   // ask = true only from a tap: Google may show a small window
  if (tokenValid()) return Promise.resolve(DRV.tok);
  if (!ask) return Promise.resolve(null);
  if (!window.google?.accounts?.oauth2) { loadGis().catch(() => {}); return Promise.reject(aiErr("gis_loading")); }
  return new Promise((res, rej) => {                       // no waiting before the request: browsers allow the Google window only straight from a tap
    const first = !dev.drive?.on;
    DRV.client = google.accounts.oauth2.initTokenClient({
      client_id: GCID(), scope: "https://www.googleapis.com/auth/drive.appdata",
      callback: r => {
        if (!r || r.error || !r.access_token) return rej(aiErr(r && r.error === "access_denied" ? "cancelled" : "drive_denied"));
        DRV.tok = r.access_token; DRV.exp = Date.now() + (+r.expires_in || 3600) * 1000;
        dev.drive = { ...(dev.drive || {}), on: true, tok: DRV.tok, exp: DRV.exp }; saveDev(); res(DRV.tok);
      },
      error_callback: e => rej(aiErr(e && e.type === "popup_closed" ? "cancelled" : "drive_denied")),
    });
    DRV.client.requestAccessToken({ prompt: first ? "consent" : "" });
  });
}
async function gfetch(url, init = {}) {
  const r = await fetch(url, { ...init, headers: { ...(init.headers || {}), Authorization: "Bearer " + DRV.tok } }).catch(() => { throw aiErr("offline"); });
  if (r.status === 401) { DRV.tok = null; if (dev.drive) { delete dev.drive.tok; saveDev(); } throw aiErr("drive_expired"); }
  if (!r.ok) throw aiErr(r.status === 403 || r.status === 429 ? "rate_limited" : "drive_failed", "http " + r.status);
  return r;
}
async function driveFind() {
  if (dev.drive?.fileId) return dev.drive.fileId;
  const q = encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
  const j = await (await gfetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime desc`)).json();
  const id = j.files?.[0]?.id || "";
  if (id) { dev.drive.fileId = id; saveDev(); }
  return id;
}
async function driveUpload(id, text) {
  if (id) return gfetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: text });
  const meta = { name: DRIVE_FILE, parents: ["appDataFolder"], mimeType: "application/json" };
  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
  fd.append("file", new Blob([text], { type: "application/json" }));
  const j = await (await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method: "POST", body: fd })).json();
  dev.drive.fileId = j.id; saveDev();
}
async function driveSync(ask) {
  if (!driveReady() || !dev.drive?.on) return false;
  if (DRV.busy) return new Promise(r => DRV.waiters.push(r));
  DRV.busy = true; driveUi();
  let ok = false;
  try {
    const tok = await driveToken(ask);
    if (!tok) { driveUi(); return false; }
    stampChanges();
    let id = await driveFind(), remote = null;
    if (id) {
      try { remote = await (await gfetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); }
      catch (e) { if (e.code === "drive_failed") { id = ""; dev.drive.fileId = ""; saveDev(); } else throw e; }
    }
    let changed = false;
    if (remote && remote.app === "vokab") changed = mergeRemote(remote);
    rememberAll();
    persistLocal();
    if (changed) { LANG = pickLang(); applyI18n(); applyTheme(); applyPlural(); if (state.dict) { refreshChrome(); render(); } else if (!$("chooser").hidden) showChooser(); }
    const text = JSON.stringify(syncPayload());
    if (!remote || canon(clean({ d: remote.dicts, p: remote.prefs, g: remote.gone })) !== canon(clean({ d: store.dicts, p: store.prefs, g: store.gone }))) await driveUpload(id, text);
    dev.drive.last = Date.now(); dev.drive.dirty = false; saveDev();
    $("syncbar").hidden = true;
    ok = true;
    return true;
  } catch (e) {
    console.warn("drive sync", e && e.code);
    if (e.code === "drive_expired" && !ask) showSyncBar();
    else if (ask && e.code !== "cancelled") showToast(t(e.code === "offline" ? "ai_err_offline" : e.code === "gis_loading" ? "drive_wait" : "drive_fail"));
    return false;
  } finally {
    DRV.busy = false; driveUi();
    const w = DRV.waiters.splice(0); w.forEach(r => r(ok));
  }
}
function driveAfterSave() {                                   // after each change: send it soon if the sign-in is still fresh
  if (!driveReady() || !dev.drive?.on) return;
  if (!dev.drive.dirty) { dev.drive.dirty = true; saveDev(); }
  clearTimeout(DRV.timer);
  if (tokenValid()) DRV.timer = setTimeout(() => driveSync(false), 2500);
  else showSyncBar();
}
function showSyncBar() {
  if (!driveReady() || !dev.drive?.on || !booted) return;
  $("syncbar").hidden = false;
}
function driveUi() {
  const sec = $("drive-sec"); if (!sec) return;
  sec.hidden = BUILD !== "web";
  if (BUILD !== "web") return;
  const ready = driveReady(), on = ready && !!dev.drive?.on;
  $("drive-connect").hidden = !ready || on; $("drive-connect").parentElement.hidden = !ready;
  $("drive-now").hidden = !on; $("drive-off").hidden = !on;
  $("drive-now").disabled = DRV.busy;
  $("drive-state").classList.toggle("on", on);
  $("drive-status").textContent = !ready ? t("drive_unset") : !on ? t("drive_offline") :
    DRV.busy ? t("drive_syncing") : dev.drive.last ? t("drive_last", new Date(dev.drive.last).toLocaleString(LOCALES[LANG], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })) : t("drive_on");
  $("sb-go").disabled = DRV.busy;
}
async function driveConnect() {
  sfx("tap");
  dev.drive = { ...(dev.drive || {}), on: false }; saveDev();
  try {
    await driveToken(true);
    dev.drive.on = true; saveDev();
    const ok = await driveSync(true);
    if (ok) { showToast(t("drive_connected")); sfx("success"); }
  } catch (e) {
    if (!dev.drive?.tok) { delete dev.drive; saveDev(); }
    if (e && e.code !== "cancelled") showToast(t(e.code === "gis_loading" ? "drive_wait" : "drive_fail"));
  }
  driveUi();
}
function driveDisconnect() {
  const tok = DRV.tok;
  DRV.tok = null; DRV.exp = 0; delete dev.drive; saveDev(); $("syncbar").hidden = true;
  try { if (tok && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(tok, () => {}); } catch (_) {}
  driveUi(); showToast(t("drive_disconnected"));
}
if ($("drive-connect")) {
  $("drive-connect").addEventListener("click", driveConnect);
  $("drive-now").addEventListener("click", async () => { sfx("tap"); if (await driveSync(true)) { showToast(t("drive_done")); sfx("success"); } });
  $("drive-off").addEventListener("click", driveDisconnect);
  $("sb-go").addEventListener("click", async () => { sfx("tap"); if (await driveSync(true)) { showToast(t("drive_done")); sfx("success"); } });
  $("sb-x").addEventListener("click", () => { $("syncbar").hidden = true; });
}
function driveBoot() {                                       // on start: sync now if the sign-in is still fresh, otherwise offer a one-tap sync
  if (!driveReady() || !dev.drive?.on) return;
  if (tokenValid()) driveSync(false); else showSyncBar();
  setInterval(() => { if (!document.hidden && dev.drive?.on && tokenValid()) driveSync(false); }, 90000);   // pick up the other device's changes
}

/* ================= the book logo and a touch of neon on the start screens ================= */
const FINE_POINTER = matchMedia("(hover: hover) and (pointer: fine)").matches;
document.querySelectorAll("[data-book]").forEach(b => {
  b.addEventListener("click", () => {                        // a tap on the book: it peeks open and closes again
    if (b.classList.contains("open") || b.classList.contains("peek")) return;
    sfx("flip"); b.classList.add("peek"); setTimeout(() => b.classList.remove("peek"), 650);
  });
});
function neonZone(root) {
  let raf = 0, last = null;
  const place = (el, x, y) => { const r = el.getBoundingClientRect(); el.style.setProperty("--cx", (x - r.left) + "px"); el.style.setProperty("--cy", (y - r.top) + "px"); };
  root.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    last = e; if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0; const ev = last;
      root.style.setProperty("--mx", ev.clientX + "px"); root.style.setProperty("--my", ev.clientY + "px"); root.classList.add("lit");
      const card = ev.target.closest && ev.target.closest(".ng"); if (card) place(card, ev.clientX, ev.clientY);
      const bk = root.querySelector("[data-book]");
      if (bk && !reduced()) {                                // the book turns a little toward the pointer
        const r = bk.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const nx = Math.max(-1, Math.min(1, (ev.clientX - cx) / (innerWidth / 2))), ny = Math.max(-1, Math.min(1, (ev.clientY - cy) / (innerHeight / 2)));
        bk.style.setProperty("--tx", nx.toFixed(3)); bk.style.setProperty("--ty", ny.toFixed(3));
      }
    });
  });
  root.addEventListener("pointerleave", () => { root.classList.remove("lit"); const bk = root.querySelector("[data-book]"); if (bk) { bk.style.setProperty("--tx", 0); bk.style.setProperty("--ty", 0); } });
  root.addEventListener("pointerdown", e => {
    const card = e.target.closest(".ng");
    if (card) { place(card, e.clientX, e.clientY); card.classList.remove("tap"); void card.offsetWidth; card.classList.add("tap"); setTimeout(() => card.classList.remove("tap"), 700); }
    if (e.pointerType !== "mouse") {                       // phones: the glow appears where you touch
      root.style.setProperty("--mx", e.clientX + "px"); root.style.setProperty("--my", e.clientY + "px");
      root.classList.add("lit"); clearTimeout(root._lit); root._lit = setTimeout(() => root.classList.remove("lit"), 900);
    }
  });
}
neonZone($("chooser")); neonZone($("onboard"));
async function openFromStart(k, rootId) {                   // the book opens, then the dictionary appears
  const root = $(rootId), book = root.querySelector("[data-book]");
  sfx("enter");
  if (reduced() || !book || root.classList.contains("leaving")) return openDict(k, true);
  root.classList.add("leaving"); book.classList.remove("peek"); book.classList.add("open");
  await sleep(640);
  openDict(k, true);
  requestAnimationFrame(() => { root.classList.remove("leaving"); book.classList.remove("open"); });
}

/* ================= help ================= */
function helpHTML(q) {
  const data = HELP[LANG] || HELP.en, f = fold(q || "");
  const fmt = s => s.split(/\n\n+/).map(p => /^- /m.test(p)
    ? `<ul>${p.split("\n").map(l => `<li>${helpInline(l.replace(/^- /, ""))}</li>`).join("")}</ul>`
    : `<p>${helpInline(p).replace(/\n/g, "<br>")}</p>`).join("");
  let html = "", n = 0;
  data.forEach(([sec, items], si) => {
    const shown = items.filter(([qq, a]) => !f || fold(qq + " " + a).includes(f));
    if (!shown.length) return;
    html += `<section class="hsec" style="--i:${Math.min(si, 8)}"><h3>${esc(sec)}</h3>` +
      shown.map(([qq, a]) => `<details${f && shown.length < 4 ? " open" : ""}><summary>${esc(qq)}</summary><div class="ha">${fmt(a)}</div></details>`).join("") + `</section>`;
    n += shown.length;
  });
  return n ? html : `<p class="hint">${esc(t("help_none"))}</p>`;
}
function helpInline(s) {
  const links = [];
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, txt, url) => { links.push([txt, url]); return `\u0000${links.length - 1}\u0000`; });
  let h = inline(s);
  h = h.replace(/\u0000(\d+)\u0000/g, (_, i) => `<a href="${esc(links[+i][1])}" target="_blank" rel="noopener">${esc(links[+i][0])}</a>`);
  return h;
}
function openHelp(topic) {
  $("help-q").value = topic || "";
  $("helpbody").innerHTML = helpHTML(topic);
  openDlg($("helpdlg"));
  $("helpbody").scrollTop = 0;
}
$("help-q").addEventListener("input", () => { $("helpbody").innerHTML = helpHTML($("help-q").value); });
$("helpbody").addEventListener("toggle", e => { if (e.target.open) sfx("tap"); }, true);
["help-btn", "ch-help", "ob-help", "set-help"].forEach(id => { const el = $(id); if (el) el.addEventListener("click", () => openHelp()); });

/* ================= start ================= */
async function boot() {
  const t0 = Date.now();
  if (dev.lastVersion && dev.lastVersion !== APP_VERSION) keepCopy(dev.lastVersion);
  store = loadLocal();
  if (BUILD === "web") { rememberAll(); useOwnAi(); if (driveReady() && dev.drive?.on) loadGis().catch(() => {}); }
  LANG = pickLang(); applyI18n(); applyTheme(); applyPlural();
  const slow = setTimeout(() => { $("sp-status").textContent = t("loading"); }, 1200);
  if (window.claude && typeof window.claude.use === "function") {
    const use = n => window.claude.use(n).catch(() => null);
    const [db, user] = await Promise.all([use("db"), use("user")]);
    let uid = null, canWrite = null;
    if (user) {
      try { uid = await user.id(); } catch (_) {}
      try { canWrite = await user.can("data.write"); } catch (_) {}
    }
    if (db && uid && canWrite === null) {                 // not told: try one small write in this person's own space
      try { await db.doc(`data/users/${uid}/app/meta/hello`).set({ v: APP_VERSION, at: Date.now() }); canWrite = true; }
      catch (e) { if (e && e.code === "invalid_argument") canWrite = false; }
    }
    if (db && uid && canWrite !== false) {
      syncMode = "cloud"; CP = `data/users/${uid}/app/`;
      const cached = bootCached = store, queued = loadPending();
      store = { ...emptyStore(), prefs: cached.prefs, lastBackup: cached.lastBackup };
      const offline = await bootCloud(db);
      if (offline && !store.dicts.cs.words.length && !store.dicts.en.words.length) { store.dicts = cached.dicts; setTimeout(() => showToast(t("offline")), 1200); }
      if (queued.length) { applyPendingToStore(queued); flushCloud(); }
      persistLocal();
    } else syncMode = uid ? "view" : "noid";
    initSample().then(() => { if ($("phdlg").open && !PH.ctl) phInput(); });
  }
  clearTimeout(slow);
  LANG = pickLang(); applyI18n(); applyTheme(); applyPlural();
  if (dev.lastVersion && dev.lastVersion !== APP_VERSION) setTimeout(() => showToast(t("updated_to", APP_VERSION)), 900);
  dev.lastVersion = APP_VERSION; saveDev();
  await sleep(reduced() ? 0 : Math.max(0, 700 - (Date.now() - t0)));
  const spBook = $("splash").querySelector("[data-book]");
  if (spBook && !reduced()) { spBook.classList.add("open"); await sleep(380); }
  booted = true;
  const h = location.hash.slice(1);
  if (!store.prefs.onboarded) showOnboarding();
  else if (DICTS[h]) openDict(h);
  else if (DICTS[window.VOKAB_DEFAULT]) openDict(window.VOKAB_DEFAULT);
  else showChooser();
  document.body.classList.add("ready");
  $("splash").classList.add("out");
  setTimeout(() => { $("splash").hidden = true; }, 450);
  if (BUILD === "web") { setTimeout(checkUpdate, 3000); setInterval(checkUpdate, 30 * 60000); driveBoot(); }
}
addEventListener("hashchange", () => { const k = location.hash.slice(1); if (booted && store.prefs.onboarded && DICTS[k] && k !== state.dict) openDict(k); });
boot();
if (BUILD === "web" && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
