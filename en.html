/* Vocabulary app v2. One template, two builds: "claude" (synced database + Claude photo import) and "web" (offline, this device).
   Layout: splash → onboarding (first run) or chooser → dictionary: header, sticky topic chips, topic cards with
   word rows (target word + plural | main translation, extra translation and note underneath), rule sheets. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --ink: #1a2030; --muted: #5f6879; --faint: #8a92a1; --line: #e3e6ec; --chip: #eceff4;
  --note: #fff4c4; --note-ink: #3a3214; --note-line: #e9d98f;
  --m: #1d55b4; --f: #bf2620; --n: #13743b; --m2: #4a7fd8; --f2: #dd5249; --n2: #3a9a5e;
  --accent: #11457e; --on-accent: #ffffff; --warn: #9a5b00; --ok: #17703a; --danger: #b3261e;
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.2, .9, .3, 1.15);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --surface: #181c24; --ink: #e8ebf1; --muted: #a2aab8; --faint: #7f8898; --line: #282e39; --chip: #232936;
    --note: #2a2615; --note-ink: #efe5bf; --note-line: #4a4224;
    --m: #8bb6ff; --f: #ff978e; --n: #74d597; --m2: #b5d0ff; --f2: #ffbdb6; --n2: #a3e6bb;
    --accent: #8bb6ff; --on-accent: #10131a; --warn: #f0b35a; --ok: #74d597; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #181c24; --ink: #e8ebf1; --muted: #a2aab8; --faint: #7f8898; --line: #282e39; --chip: #232936;
  --note: #2a2615; --note-ink: #efe5bf; --note-line: #4a4224;
  --m: #8bb6ff; --f: #ff978e; --n: #74d597; --m2: #b5d0ff; --f2: #ffbdb6; --n2: #a3e6bb;
  --accent: #8bb6ff; --on-accent: #10131a; --warn: #f0b35a; --ok: #74d597; --danger: #ff8a80;
  color-scheme: dark;
}
body[data-dict="en"] { --accent: #4b3bb0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-dict="en"] { --accent: #b9aef5; } }
:root[data-theme="dark"] body[data-dict="en"] { --accent: #b9aef5; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; transition: background-color .3s ease, color .3s ease; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, label:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font-size: 16px; }

/* motion */
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.94); } }
@keyframes logo-in { from { opacity: 0; transform: scale(.55) rotate(-10deg); } }
@keyframes dlg-in { from { opacity: 0; transform: translateY(16px) scale(.97); } }
@keyframes dlg-out { to { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes sheet-in { from { transform: translateY(100%); } }
@keyframes sheet-out { to { transform: translateY(100%); } }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 18px) scale(.96); } }
@keyframes card-in { from { opacity: 0; transform: translateY(18px) scale(.96); } }
@keyframes spin { to { transform: rotate(360deg); } }
.btn, .seg button, .tabs button, .ch-card, .groups a, .expill, .more, .xbtn, .ob-opt, .floatbar button, .menu button {
  transition: background-color .18s ease, color .18s ease, border-color .18s ease, box-shadow .2s ease, transform .14s var(--ease), opacity .18s ease;
}
.btn:active, .seg button:active, .tabs button:active, .ch-card:active, .groups a:active, .expill:active, .xbtn:active, .ob-opt:active, .floatbar button:active { transform: scale(.95); }

/* splash */
.splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--bg); transition: opacity .4s ease, visibility .4s ease; }
.splash .sp-name { font-family: var(--display); font-size: 28px; font-weight: 700; animation: rise .55s .18s var(--ease) both; }
.splash .sp-status { font-size: 13px; color: var(--muted); min-height: 18px; animation: fade-in .4s .6s both; }
.splash.out { opacity: 0; visibility: hidden; }

/* onboarding + chooser */
.chooser, .onboard { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
.ch-inner, .ob-card { width: min(460px, 100%); display: grid; gap: 18px; justify-items: center; text-align: center; }
.ch-inner > *, .ob-step > * { animation: rise .5s var(--ease) both; }
.ch-inner > :nth-child(2), .ob-step > :nth-child(2) { animation-delay: .05s; } .ch-inner > :nth-child(3), .ob-step > :nth-child(3) { animation-delay: .1s; }
.ch-inner > :nth-child(4), .ob-step > :nth-child(4) { animation-delay: .15s; } .ch-inner > :nth-child(n+5), .ob-step > :nth-child(n+5) { animation-delay: .2s; }
.ch-logo { border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.chooser h1, .onboard h1 { margin: 0; font-family: var(--display); font-size: 38px; line-height: 1.05; }
.onboard h1 { font-size: 30px; }
.onboard h2 { margin: 0; font-size: 18px; }
.chooser p, .onboard p { margin: 0; color: var(--muted); }
.ch-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.ch-card { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 22px 14px; display: grid; gap: 6px; justify-items: center; cursor: pointer; }
.ch-card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,.08); }
.ch-card b { font-family: var(--display); font-size: 24px; }
.ch-card small { color: var(--muted); }
.ch-k { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #fff; padding: 3px 9px; border-radius: 6px; }
.ch-card.cz .ch-k { background: #11457e; } .ch-card.en .ch-k { background: #4b3bb0; }
.ver { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ob-card { gap: 16px; }
.ob-dots { display: flex; gap: 6px; }
.ob-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background-color .3s, width .3s var(--ease); }
.ob-dots i.on { background: var(--accent); width: 20px; border-radius: 4px; }
.ob-step { display: grid; gap: 14px; width: 100%; justify-items: center; }
.ob-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.ob-opt { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 10px; font-weight: 700; font-size: 16px; cursor: pointer; }
.ob-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; color: var(--accent); }
.ob-nav { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }
.ob-nav .btn { min-width: 110px; }
.trp { display: grid; gap: 6px; width: 100%; text-align: left; }
.trp .lbl { margin-top: 6px; }
.trp small { color: var(--faint); font-size: 12.5px; }
.trp .seg { width: 100%; }
.trp .seg button { flex: 1; padding: 8px 10px; }
.trp h4 { margin: 8px 0 0; font-size: 13px; }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); transition: background-color .3s ease, border-color .3s ease; }
body.ready .top { animation: fade-in .45s ease; }  /* opacity only: a transform here would trap the fixed phone dock inside the header */
.top .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
.row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 22px; }
.brand img { border-radius: 7px; transition: transform .3s var(--spring); }
.brand:hover img { transform: rotate(-8deg) scale(1.06); }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
#dictseg button { letter-spacing: .06em; }
.spacer { flex: 1; }
.dock { display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 13px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { background: var(--chip); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { opacity: .9; }
.btn.sm { padding: 4px 10px; font-size: 13px; min-height: 30px; }
.btn.icon { padding: 6px 10px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.stats { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.search input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); outline: none; }
.row3 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.tabs small { font-weight: 500; margin-left: 3px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.status { padding: 18px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; background: var(--surface); display: grid; gap: 10px; justify-items: center; animation: rise .4s var(--ease) both; }
.viewnote { color: var(--muted); font-size: 13px; margin: 0; }

/* topic chips */
.groups { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.groups .wrap { padding-block: 7px; display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
.groups .wrap::-webkit-scrollbar { display: none; }
.groups a { flex: none; text-decoration: none; color: var(--ink); background: var(--chip); padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.groups a:hover { background: color-mix(in srgb, var(--accent) 14%, var(--chip)); }
.groups a.rules { background: var(--note); color: var(--note-ink); }
.groups a small { color: var(--faint); margin-left: 4px; }

/* topics */
main.wrap { padding-block: 16px 130px; display: grid; gap: 16px; }
#words { display: grid; gap: 16px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; scroll-margin-top: 56px; overflow: hidden; transition: background-color .3s ease, border-color .3s ease, box-shadow .25s ease; }
#words.enter > .group { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms); }
.ghead { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; }
.ghead .gt { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.ghead h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; }
.ghead .sub { font-size: 13px; color: var(--faint); }
.ghead .cnt { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.chev { width: 18px; height: 18px; color: var(--faint); transition: transform .28s var(--ease); flex: none; align-self: center; }
.group.closed .chev { transform: rotate(-90deg); }
.wlw { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .32s var(--ease); }
.group.closed .wlw { grid-template-rows: 0fr; }
.wl { overflow: hidden; min-height: 0; }
.wli { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); column-gap: 30px; padding: 0 14px 4px; transition: opacity .25s ease; }
.group.closed .wli { opacity: 0; }

/* word row */
.w { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 26px; grid-template-areas: "c1 c2 mo" "c3 c3 c3"; column-gap: 14px; padding: 9px 4px; margin: 0 -4px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 8px; transition: background-color .2s ease; }
.w:hover { background: color-mix(in srgb, var(--chip) 60%, transparent); }
.c1 { grid-area: c1; min-width: 0; } .c2 { grid-area: c2; min-width: 0; } .c3 { grid-area: c3; min-width: 0; }
.t1 { font-weight: 700; font-size: 17px; line-height: 1.25; }
.t2 { font-size: 15.5px; font-weight: 500; line-height: 1.3; }
.s1, .s2 { font-size: 12.5px; color: var(--muted); line-height: 1.35; margin-top: 1px; }
.tr { color: var(--faint); }
.plw i { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--faint); margin-right: 3px; }
.plw b { font-weight: 600; }
.pl { font-size: 10px; font-weight: 700; color: var(--faint); margin-left: 4px; vertical-align: 2px; }
.c3 { display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: baseline; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.c3:empty { display: none; }
.xtr { font-style: italic; }
.nt::before { content: "!"; color: var(--warn); font-weight: 800; margin-right: 4px; }
.expill { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; font-size: 11.5px; font-weight: 600; padding: 1px 9px; cursor: pointer; }
.expill:hover { border-color: var(--accent); }
.q { font-size: 10px; font-weight: 700; color: var(--warn); border: 1px dashed var(--warn); border-radius: 4px; padding: 0 4px; margin-left: 5px; vertical-align: 2px; }
.g-m { color: var(--m); } .g-f { color: var(--f); } .g-n { color: var(--n); }
.p-m { color: var(--m2); } .p-f { color: var(--f2); } .p-n { color: var(--n2); }
.more { grid-area: mo; align-self: start; border: 0; background: transparent; width: 28px; height: 28px; margin: -3px -4px 0 0; border-radius: 8px; cursor: pointer; color: var(--faint); display: grid; place-items: center; padding: 0; }
.more:hover { background: var(--chip); color: var(--ink); }
.more svg { width: 16px; height: 16px; }
body.selecting .w { padding-left: 30px; }
body.selecting .more, body.selecting .expill { visibility: hidden; }
.sel { position: absolute; left: 4px; top: 11px; width: 18px; height: 18px; accent-color: var(--accent); pointer-events: none; animation: pop .2s var(--spring); }
.w.picked { background: color-mix(in srgb, var(--accent) 10%, transparent); }
body.hide-m .w .c2, body.hide-m .w .c3, body.hide-t .w .c1, body.hide-t .w .c3 { transition: filter .25s ease, opacity .25s ease; }
body.hide-m .w:not(.shown) .c2, body.hide-m .w:not(.shown) .c3,
body.hide-t .w:not(.shown) .c1, body.hide-t .w:not(.shown) .c3 { filter: blur(7px); opacity: .75; user-select: none; pointer-events: none; }

/* menu */
.menu { position: fixed; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 34px rgba(0,0,0,.2); padding: 4px; min-width: 210px; display: grid; transform-origin: top right; }
.menu:not([hidden]) { animation: pop .18s var(--spring); }
.menu button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 9px; cursor: pointer; font-size: 15px; }
.menu button:hover { background: var(--chip); }
.menu button.danger { color: var(--danger); }

/* rule sheets */
.sheets-head { display: grid; gap: 4px; scroll-margin-top: 56px; margin-top: 8px; }
.sheets-head h2 { font-family: var(--display); font-size: 24px; margin: 0; }
.sheets-head p { margin: 0; color: var(--muted); font-size: 14px; }
.sheets { columns: 2 24rem; column-gap: 16px; }
.sheet { break-inside: avoid; background: var(--note); color: var(--note-ink); border: 1px solid var(--note-line); border-radius: 12px; padding: 12px 16px 14px; margin: 0 0 16px; display: grid; gap: 9px; transition: transform .2s var(--ease), box-shadow .2s ease; }
.sheet:hover { transform: translateY(-1px) rotate(-.2deg); box-shadow: 0 8px 20px rgba(0,0,0,.08); }
.sheet .sbar { display: flex; justify-content: space-between; align-items: center; }
.sheet .no { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; opacity: .7; }
.sheet .x { border: 0; background: transparent; color: var(--note-ink); opacity: .55; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 18px; line-height: 1; }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 19px; line-height: 1.2; }
.sheet p { margin: 0; font-size: 14px; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.sheet .tw { overflow-x: auto; }
.sheet table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.sheet th, .sheet td { text-align: left; vertical-align: top; padding: 5px 8px 5px 0; border-top: 1px solid var(--note-line); }
.sheet th { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; opacity: .75; border-top: 0; }
.sheet .m { color: var(--m); font-weight: 700; } .sheet .f { color: var(--f); font-weight: 700; } .sheet .n { color: var(--n); font-weight: 700; }
.fix { color: var(--f); text-decoration: line-through; }

/* floating bars */
.floatbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 8px 8px 8px 14px; border-radius: 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 8px; align-items: center; z-index: 25; width: max-content; max-width: calc(100vw - 24px); box-shadow: 0 10px 30px rgba(0,0,0,.28); font-size: 14px; }
.floatbar:not([hidden]) { animation: toast-in .32s var(--spring); }

.tour-blk, .tour-cover { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: auto; }
.tour-coach { position: fixed; left: 0; top: 0; z-index: 2; width: min(400px, calc(100vw - 20px)); display: flex; align-items: flex-end; gap: 4px; pointer-events: auto;
  transform: translate3d(var(--x, 0px), var(--y, 0px), 0); transition: transform .62s var(--spring); }
.tour-coach.notrans { transition: none; }
.tour-coach.flip { flex-direction: row-reverse; }
.tour-coach .booky { margin-bottom: -6px; }
.tour-bubble { position: relative; flex: 1; min-width: 0; padding: 11px 14px 11px; border-radius: 18px; background: var(--surface); color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--neon) 34%, var(--line)); box-shadow: 0 22px 50px -18px rgba(3, 8, 24, .55), 0 0 0 5px color-mix(in srgb, var(--neon) 8%, transparent); transform-origin: 0 100%; }
.tour-coach.flip .tour-bubble { transform-origin: 100% 100%; }
.tour-bubble::before { content: ""; position: absolute; left: -7px; bottom: 30px; width: 13px; height: 13px; background: var(--surface); border-left: 1px solid color-mix(in srgb, var(--neon) 34%, var(--line)); border-bottom: 1px solid color-mix(in srgb, var(--neon) 34%, var(--line)); border-bottom-left-radius: 3px; transform: rotate(45deg); }
.tour-coach.flip .tour-bubble::before { left: auto; right: -7px; transform: rotate(-135deg); }
.tour-coach.enter .tour-bubble { animation: bubble-in .55s var(--spring) both; }
.tour-coach.enter .booky { animation: bk-drop .8s cubic-bezier(.3, .7, .3, 1) both; }
@keyframes bubble-in { from { opacity: 0; transform: scale(.82); } }
.tour-bubble.nudge { animation: nudge .45s ease; }
@keyframes nudge { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.tb-top { display: flex; align-items: center; gap: 8px; margin: -3px -6px 3px 0; min-height: 24px; }
.tb-ch { flex: 1; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--neon); }
.tb-x { border: 0; background: transparent; color: var(--faint); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 13px; display: grid; place-items: center; padding: 0; transition: background-color .2s, color .2s; }
.tb-x:hover { background: var(--chip); color: var(--ink); }
.tb-text { font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
.tb-text b { color: var(--accent); font-weight: 750; }
.tb-text .m, .tour-demo .m { color: var(--m); font-weight: 700; } .tb-text .f, .tour-demo .f { color: var(--f); font-weight: 700; } .tb-text .n, .tour-demo .n { color: var(--n); font-weight: 700; }
.tour-bubble .tb-text, .tour-bubble .tb-extra, .tour-bubble .tb-do { transition: opacity .18s ease, transform .25s var(--ease); }
.tour-bubble.swap .tb-text, .tour-bubble.swap .tb-extra, .tour-bubble.swap .tb-do { opacity: 0; transform: translateY(5px); }
.tb-do { display: flex; align-items: center; gap: 8px; margin-top: 9px; padding: 7px 10px; border-radius: 11px; font-size: 13px; font-weight: 700; color: var(--neon); background: color-mix(in srgb, var(--neon) 12%, transparent); }
.tb-finger { display: inline-block; animation: finger 1s ease-in-out infinite; }
@keyframes finger { 50% { transform: translateY(-3px) scale(1.1); } }
.tb-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.tb-bar { flex: 1; min-width: 36px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.tb-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--neon), var(--neon2)); transition: width .55s var(--ease); }
.tb-n { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tb-skip { border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 6px 4px; cursor: pointer; white-space: nowrap; }
.tb-skip:hover { color: var(--ink); text-decoration: underline; }
.tb-next, .to-yes { position: relative; overflow: hidden; border: 0; cursor: pointer; color: var(--on-neon); background: linear-gradient(135deg, var(--neon), var(--neon2));
  transition: transform .15s var(--ease), box-shadow .25s ease, filter .2s ease; }
.tb-next { border-radius: 12px; padding: 8px 16px; min-height: 38px; font-size: 14px; font-weight: 750; white-space: nowrap; box-shadow: 0 8px 18px -8px var(--neon); }
.tb-next:hover, .to-yes:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 14px 26px -10px var(--neon); }
.tb-next:active, .to-yes:active { transform: scale(.95); }
.tb-next::after, .to-yes::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent); transform: skewX(-18deg); animation: shimmer 3.4s ease-in-out infinite; pointer-events: none; }
@keyframes shimmer { 0%, 55% { left: -60%; } 85%, 100% { left: 130%; } }
.tour-coach.mini { width: auto; }
.tour-coach.mini .tb-top, .tour-coach.mini .tb-text, .tour-coach.mini .tb-extra, .tour-coach.mini .tb-do, .tour-coach.mini .tb-bar, .tour-coach.mini .tb-n, .tour-coach.mini .tb-skip, .tour-coach.mini .tour-bubble::before { display: none; }
.tour-coach.mini .tour-bubble { padding: 6px; flex: none; }
.tour-coach.mini .tb-foot { margin: 0; }
.tour-coach.mini .booky { width: 44px; height: 53px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tour-demo { display: grid; margin-top: 9px; padding: 2px 10px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.td-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
.td-row:first-child { border-top: 0; }
.td-row > b { font-size: 16px; } .td-t { font-weight: 600; text-align: right; }
.td-s { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.td-s i { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--faint); margin-right: 3px; }
@media (max-width: 520px) {
  .tour-coach .booky { width: 58px; height: 70px; }
  .tour-bubble { padding: 10px 12px; }
  .tb-text { font-size: 14.5px; }
}

/* the first question: take the tour or not */
.tour-offer { position: fixed; inset: 0; z-index: 96; display: grid; place-items: center; padding: 76px 18px 24px; overflow: auto; background: rgba(6, 10, 20, .5); -webkit-backdrop-filter: blur(7px) saturate(1.2); backdrop-filter: blur(7px) saturate(1.2); animation: fade-in .35s ease both; }
.tour-offer.out { animation: fade-out .34s ease forwards; pointer-events: none; }
.tour-offer.out .to-card { animation: to-out .34s ease forwards; }
.to-card { position: relative; width: min(400px, 100%); padding: 80px 22px 18px; border-radius: 28px; text-align: center; background: var(--surface); color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--neon) 36%, var(--line)); box-shadow: 0 30px 80px -24px rgba(5, 10, 30, .6), 0 0 0 6px color-mix(in srgb, var(--neon) 9%, transparent); animation: to-pop .6s var(--spring) both; }
.to-card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--neon) 17%, transparent), transparent 62%); }
.to-card .booky { position: absolute; left: 50%; top: -66px; margin-left: -56px; animation: bk-drop .95s .15s cubic-bezier(.3, .7, .3, 1) both; }
.to-card h2 { position: relative; margin: 0 0 8px; font-family: var(--display); font-size: 27px; line-height: 1.15; animation: rise .5s .35s var(--ease) both; }
.to-card p { position: relative; margin: 0 0 18px; color: var(--muted); line-height: 1.5; animation: rise .5s .45s var(--ease) both; }
.to-btns { position: relative; display: grid; gap: 10px; }
.to-btns button { animation: rise .5s var(--ease) both; }
.to-btns button:nth-child(1) { animation-delay: .55s; } .to-btns button:nth-child(2) { animation-delay: .63s; }
.to-yes { min-height: 52px; border-radius: 16px; font-size: 16.5px; font-weight: 800; box-shadow: 0 14px 28px -12px var(--neon); }
.to-no { min-height: 46px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color .2s, color .2s, transform .15s var(--ease); }
.to-no:hover { background: var(--chip); color: var(--ink); }
.to-no:active { transform: scale(.96); }
.to-card small { position: relative; display: block; margin-top: 12px; color: var(--faint); font-size: 12.5px; line-height: 1.4; animation: fade-in .6s .85s both; }
.to-spark { position: absolute; font-style: normal; color: var(--neon2); font-size: 16px; pointer-events: none; opacity: 0; animation: twinkle 2.6s ease-in-out infinite; }
.to-spark.s1 { left: 22%; top: -24px; animation-delay: 1s; } .to-spark.s2 { right: 21%; top: -48px; font-size: 12px; animation-delay: 1.5s; }
.to-spark.s3 { left: 31%; top: -62px; font-size: 11px; color: var(--neon); animation-delay: 2.1s; } .to-spark.s4 { right: 29%; top: -12px; font-size: 14px; animation-delay: 1.25s; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0); } 40% { opacity: 1; transform: scale(1.15) rotate(25deg); } 70% { opacity: .25; transform: scale(.7) rotate(50deg); } }
@keyframes to-pop { from { opacity: 0; transform: translateY(26px) scale(.86); } }
@keyframes to-out { to { opacity: 0; transform: translateY(14px) scale(.94); } }
.tour-confetti { position: fixed; inset: 0; z-index: 99; pointer-events: none; overflow: hidden; }
.tour-confetti i { position: absolute; top: -16px; width: 8px; height: 13px; border-radius: 2px; opacity: 0; animation: confetti 2.7s cubic-bezier(.25, .6, .35, 1) forwards; }
@keyframes confetti { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: .9; transform: translate(var(--dx), 112vh) rotate(var(--r)); } }

/* "Take the tour" in Help */
.tour-help { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 14px 8px 10px; text-align: left; cursor: pointer; color: var(--ink); border-radius: 16px;
  border: 1px solid color-mix(in srgb, var(--neon) 40%, var(--line)); background: linear-gradient(120deg, color-mix(in srgb, var(--neon) 13%, var(--surface)), color-mix(in srgb, var(--neon2) 11%, var(--surface)));
  transition: transform .15s var(--ease), box-shadow .25s ease; }
.tour-help:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -14px var(--neon); }
.tour-help:active { transform: scale(.98); }
.tour-help .booky { width: 42px; height: 50px; }
.th-t { flex: 1; min-width: 0; display: grid; gap: 1px; }
.th-t b { font-size: 15px; } .th-t small { color: var(--muted); font-size: 12.5px; }
.tour-help::after { content: "→"; font-weight: 800; color: var(--neon); font-size: 18px; transition: transform .2s var(--ease); }
.tour-help:hover::after { transform: translateX(3px); }
#onboard:not([hidden]) ~ #helpdlg .tour-help { display: none; }
/* ===== v0.8 (2): the name, word levels, neon inside the dictionary and behind every window, contacts ===== */
:root { --neon3: color-mix(in srgb, var(--neon) 50%, var(--neon2)); }
.ay { background: linear-gradient(120deg, var(--neon), var(--neon2) 62%, var(--neon3)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .05em; }
:root.noneon .ay { background: none; color: var(--accent); }
.credit .nick { background: linear-gradient(90deg, var(--neon), var(--neon2)); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: none; }
.credit a.nick { cursor: pointer; transition: filter .2s ease; }
.credit a.nick:hover { filter: brightness(1.2) drop-shadow(0 0 6px color-mix(in srgb, var(--neon) 60%, transparent)); }
:root.noneon .credit .nick { background: linear-gradient(90deg, var(--accent), #e0524a); -webkit-background-clip: text; background-clip: text; }

/* word levels: A — green, B — blue, C — purple and gold */
.lv { --lvc: #6b7280; display: inline-block; margin-left: 7px; padding: 3px 5px 2px; border-radius: 6px; font: 800 10.5px/1 var(--body); letter-spacing: .04em; font-style: normal; white-space: nowrap; vertical-align: 2.5px;
  color: var(--lvc); background: color-mix(in srgb, var(--lvc) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lvc) 34%, transparent); }
.lv-a1 { --lvc: #2c9a58; } .lv-a2 { --lvc: #10917f; } .lv-b1 { --lvc: #2f6ee0; } .lv-b2 { --lvc: #5a4ee0; } .lv-c1 { --lvc: #9a3fe0; } .lv-c2 { --lvc: #e0661a; }
.lv.lv-c1, .lv.lv-c2 { color: #fff; box-shadow: 0 3px 10px -4px var(--lvc); }
.lv.lv-c1 { background: linear-gradient(135deg, #b062f7, #7c3aed); }
.lv.lv-c2 { background: linear-gradient(135deg, #f7a21b, #ef4444 68%, #db2777); text-shadow: 0 1px 1px rgba(120, 20, 0, .35); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) :is(.lv-a1, .lv-a2, .lv-b1, .lv-b2) { --lvc: var(--lvd); } }
:root[data-theme="dark"] :is(.lv-a1, .lv-a2, .lv-b1, .lv-b2) { --lvc: var(--lvd); }
.lv-a1 { --lvd: #63d692; } .lv-a2 { --lvd: #4fd1bf; } .lv-b1 { --lvd: #82adff; } .lv-b2 { --lvd: #a59cff; }
.lv.big { font-size: 13px; padding: 4px 7px 3px; border-radius: 8px; margin-left: 10px; vertical-align: 7px; }
.card .kind .lv { margin-left: 8px; vertical-align: 1px; }
.legend .lv { margin: 0 1px; vertical-align: 1px; font-size: 9.5px; padding: 2px 4px 1.5px; }
.rv-row .lv { margin-left: 6px; }
.statsrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.linkbtn.lvfill { padding: 2px 0; font-size: 13px; }
.linkbtn.lvfill:disabled { color: var(--muted); cursor: default; }
.lvpick { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.lvpick button { border: 1px solid var(--line); background: var(--bg); color: var(--lvc); border-radius: 11px; min-height: 40px; font: 800 14px/1 var(--body); letter-spacing: .03em; cursor: pointer;
  transition: background-color .2s ease, color .2s ease, border-color .2s ease, box-shadow .25s ease, transform .15s var(--ease); }
.lvpick button:hover { border-color: var(--lvc); }
.lvpick button:active { transform: scale(.93); }
.lvpick button[aria-pressed="true"] { color: #fff; background: var(--lvc); border-color: var(--lvc); box-shadow: 0 8px 18px -9px var(--lvc); transform: translateY(-1px); }
.lvpick .lv-c1[aria-pressed="true"] { background: linear-gradient(135deg, #b062f7, #7c3aed); }
.lvpick .lv-c2[aria-pressed="true"] { background: linear-gradient(135deg, #f7a21b, #ef4444 68%, #db2777); }
.lvname { font-weight: 700; color: var(--ink); }
#f-lv-field small { color: var(--faint); font-size: 12.5px; }
.lvscale { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 12px; font-size: 13px; color: var(--muted); }
.lvscale > span { display: flex; align-items: center; gap: 8px; }
.lvscale .lv { margin: 0; min-width: 26px; text-align: center; }

/* neon light that follows the mouse inside the dictionary; it goes under the cards and lights up their edges */
#app { position: relative; isolation: isolate; }
#app::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .7s ease;
  background: radial-gradient(720px circle at var(--mx, 50%) var(--my, 30%), color-mix(in srgb, var(--neon) 23%, transparent), color-mix(in srgb, var(--neon2) 12%, transparent) 33%, color-mix(in srgb, var(--neon3) 6%, transparent) 51%, transparent 68%); }
#app.lit::before { opacity: 1; }
.group, .sheet, #empty { position: relative; }
.group::after, .sheet::after, #empty::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; padding: 1.5px; pointer-events: none; opacity: 0; transition: opacity .55s ease;
  background: radial-gradient(250px circle at var(--gx, -999px) var(--gy, -999px), var(--neon), color-mix(in srgb, var(--neon2) 80%, transparent) 38%, color-mix(in srgb, var(--neon3) 35%, transparent) 60%, transparent 78%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; }
#app.lit .group::after, #app.lit .sheet::after, #app.lit #empty::after { opacity: 1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #app::before { background: radial-gradient(720px circle at var(--mx, 50%) var(--my, 30%), color-mix(in srgb, var(--neon) 27%, transparent), color-mix(in srgb, var(--neon2) 14%, transparent) 33%, color-mix(in srgb, var(--neon3) 7%, transparent) 51%, transparent 68%); } }
:root[data-theme="dark"] #app::before { background: radial-gradient(720px circle at var(--mx, 50%) var(--my, 30%), color-mix(in srgb, var(--neon) 27%, transparent), color-mix(in srgb, var(--neon2) 14%, transparent) 33%, color-mix(in srgb, var(--neon3) 7%, transparent) 51%, transparent 68%); }

/* a soft neon glow behind every window */
dialog { border-color: color-mix(in srgb, var(--neon) 24%, var(--line)); }
:root:not(.noneon) dialog { box-shadow: -34px -24px 80px -28px color-mix(in srgb, var(--neon) 58%, transparent), 34px 28px 90px -26px color-mix(in srgb, var(--neon2) 52%, transparent), 0 40px 110px -44px color-mix(in srgb, var(--neon3) 55%, transparent), 0 24px 60px -32px rgba(4, 8, 20, .5); }
:root:not(.noneon) dialog::backdrop { background: radial-gradient(70% 55% at 50% 50%, color-mix(in srgb, var(--neon, #4f7cff) 15%, transparent), transparent 72%), rgba(10, 14, 22, .5); }
@media (max-width: 640px) {
  :root:not(.noneon) dialog { box-shadow: -60px -26px 80px -40px color-mix(in srgb, var(--neon) 72%, transparent), 60px -30px 90px -40px color-mix(in srgb, var(--neon2) 66%, transparent), 0 -34px 80px -34px color-mix(in srgb, var(--neon3) 50%, transparent); }
  :root:not(.noneon) dialog::backdrop { background: radial-gradient(90% 45% at 50% 100%, color-mix(in srgb, var(--neon, #4f7cff) 20%, transparent), transparent 75%), rgba(10, 14, 22, .5); }
}
:root:not(.noneon) .menu { border-color: color-mix(in srgb, var(--neon) 26%, var(--line)); box-shadow: 0 14px 34px rgba(0, 0, 0, .2), 0 12px 44px -16px color-mix(in srgb, var(--neon) 55%, transparent); }
:root:not(.noneon) .card, :root:not(.noneon) .done { box-shadow: 0 12px 34px rgba(0, 0, 0, .09), -26px -18px 70px -32px color-mix(in srgb, var(--neon) 50%, transparent), 26px 24px 80px -32px color-mix(in srgb, var(--neon2) 45%, transparent); }
:root.noneon #app::before, :root.noneon .group::after, :root.noneon .sheet::after, :root.noneon #empty::after,
:root.noneon .chooser::before, :root.noneon .onboard::before, :root.noneon .ng::after, :root.noneon .ng::before, :root.noneon .book::before { display: none; }

/* a short neon ring around whatever you press */
:is(.btn, .seg button, .tabs button, .chip, .ch-card, .ob-opt, .xbtn, .expill, .groups a, .floatbar button, .to-no, .tour-help, .nsw, .lvpick button, .menu button, .linkbtn) { position: relative; }
.zap { position: absolute; inset: -1px; z-index: 2; border-radius: inherit; pointer-events: none; animation: zap .62s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes zap {
  0% { opacity: 1; box-shadow: 0 0 0 0 color-mix(in srgb, var(--neon) 80%, transparent), 0 0 14px 2px color-mix(in srgb, var(--neon2) 60%, transparent), inset 0 0 12px color-mix(in srgb, var(--neon) 30%, transparent); }
  100% { opacity: 0; box-shadow: 0 0 0 10px color-mix(in srgb, var(--neon) 0%, transparent), 0 0 30px 10px color-mix(in srgb, var(--neon2) 0%, transparent), inset 0 0 0 transparent; }
}

/* the neon colour picker */
.neonpick { display: grid; gap: 8px; margin-top: 4px; }
.nswatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
.nsw { display: grid; justify-items: center; gap: 6px; min-width: 0; padding: 9px 4px 7px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--muted); cursor: pointer; font-size: 11.5px; font-weight: 650;
  transition: border-color .2s ease, box-shadow .25s ease, transform .15s var(--ease), color .2s ease; }
.nsw i { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .28), 0 2px 8px -3px rgba(0, 0, 0, .35); transition: box-shadow .3s ease, transform .3s var(--spring); }
.nsw span { max-width: 100%; overflow-wrap: anywhere; hyphens: auto; text-align: center; line-height: 1.15; }
.nsw:hover { transform: translateY(-1px); color: var(--ink); }
.nsw:active { transform: scale(.95); }
.nsw[aria-pressed="true"] { color: var(--ink); border-color: var(--neon); box-shadow: 0 0 0 1px var(--neon), 0 8px 22px -12px var(--neon); }
.nsw[aria-pressed="true"] i { transform: scale(1.08); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35), 0 0 16px 1px color-mix(in srgb, var(--neon2) 60%, transparent); }

:root.toast-top #toast:not([popover]) { top: calc(14px + env(safe-area-inset-top, 0px)); bottom: auto; }
/* ===== v0.9: several words at once, start from scratch ===== */

/* rows: a quick "learned" button */

@keyframes undo-drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
/* Progress */

.statsv { position: relative; display: grid; gap: 14px; padding: 4px 0 26px; }

.st-hero, .st-tile, .st-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; animation: rise .4s var(--ease) both; }

.st-up { color: var(--s-up); font-weight: 700; display: inline-flex; align-items: center; gap: 2px; } .st-up svg { width: 12px; height: 12px; }
.st-card { display: grid; gap: 10px; }
.st-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; } .st-h h3 { margin: 0; font-size: 16px; }

/* Practice: setup */

}

.c-body { display: grid; gap: 12px; align-content: center; }
.c-meta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; }
.c-chip { font-size: 11.5px; font-weight: 700; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 3px 9px; }
.c-meta .lv { margin-left: 0; vertical-align: 0; }
.c-q { font-family: var(--display); font-size: clamp(30px, 8vw, 46px); font-weight: 700; line-height: 1.12; overflow-wrap: anywhere; }
.c-def { font-size: clamp(17px, 4.2vw, 21px); line-height: 1.45; max-width: 44ch; justify-self: center; }
.c-hint { display: inline-flex; gap: 6px; align-items: center; justify-content: center; font-size: 12.5px; color: var(--faint); } .c-hint svg { width: 14px; height: 14px; flex: none; }
.c-ans { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 14px; animation: rise .3s var(--ease) both; }
.c-word { font-family: var(--display); font-size: clamp(26px, 6.4vw, 36px); font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.c-tr { font-size: 19px; } .c-line { font-size: 14.5px; color: var(--muted); }
.c-note { font-size: 13px; color: var(--note-ink); background: var(--note); border-radius: 10px; padding: 6px 10px; justify-self: center; max-width: 44ch; }
.t-btns { max-width: 600px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; }
.t-btns .btn { padding: 14px 12px; font-size: 16px; border-radius: 16px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.t-btns .btn svg { width: 18px; height: 18px; flex: none; }
.t-btns .no { color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--surface)); border-color: color-mix(in srgb, var(--danger) 30%, var(--line)); }
.t-btns .yes { color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 32%, var(--line)); }
.t-btns .flip { color: var(--ink); min-width: 118px; }
@media (max-width: 560px) { .t-btns { grid-template-columns: 1fr 1fr; } .t-btns .flip { grid-column: 1 / -1; order: -1; padding: 11px; } }
.done { width: min(560px, 100%); border-radius: 28px; padding: 26px 22px; text-align: center; gap: 14px; }
.d-hero { display: grid; } .d-hero b { font: 700 56px/1 var(--body); letter-spacing: -.02em; } .d-hero small { color: var(--muted); font-size: 13px; margin-top: 4px; }
.d-meter { margin-top: 0; }
.done h2 { font-size: 24px; }
.d-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.d-stats div { background: var(--chip); border-radius: 14px; padding: 10px 6px; display: grid; gap: 1px; } .d-stats b { font-size: 22px; } .d-stats small { color: var(--muted); font-size: 12px; }
.d-lbl { margin: 2px 0 0; font-weight: 700; font-size: 13px; color: var(--muted); }
.d-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-height: 30vh; overflow: auto; }
.d-chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; } .d-chip b { margin-right: 4px; }
.d-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px; }
.btn.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); display: inline-flex; gap: 6px; align-items: center; } .btn.ok svg { width: 16px; height: 16px; }
/* guides */
#guidedlg { width: min(620px, calc(100vw - 24px)); }
.g-steps { margin: 0; padding: 0; list-style: none; counter-reset: g; display: grid; gap: 9px; }
.g-steps li { counter-increment: g; position: relative; padding: 10px 12px 10px 46px; background: var(--bg); border: 1px solid var(--line); border-radius: 13px; line-height: 1.5; font-size: 14px; animation: rise .35s var(--ease) both; }
.g-steps li::before { content: counter(g); position: absolute; left: 12px; top: 10px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 800 12px var(--body); color: var(--on-accent); background: var(--accent); }
.g-steps code, #g-intro code, #g-foot code { font-size: 12.5px; background: var(--chip); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
.g-steps a, #g-intro a, #g-foot a { color: var(--accent); font-weight: 600; }
.g-btns { justify-content: flex-end; }
.drive-unset { display: grid; gap: 8px; }

/* ===== v0.11 ===== */
:root { --h1: #86b6ef; --h2: #5598e7; --h3: #2a78d6; --h4: #1c5cab; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --h1: #1c5cab; --h2: #2a78d6; --h3: #5598e7; --h4: #86b6ef; } }
:root[data-theme="dark"] { --h1: #1c5cab; --h2: #2a78d6; --h3: #5598e7; --h4: #86b6ef; }
/* selection: the checkbox gets its own space, never on top of the word */
body.selecting #words .w { padding-left: 30px; }
#words[data-cols="3"] .sel { top: 9px; }
/* a smaller round "learned" button */
.w { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 26px 26px; }
.lrn { width: 24px; height: 24px; margin-top: 0; border-width: 1.4px; } .lrn svg { width: 13px; height: 13px; }
#words[data-cols="3"] .w { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 22px 22px; }
#words[data-cols="3"] .lrn { width: 21px; height: 21px; } #words[data-cols="3"] .lrn svg { width: 11.5px; height: 11.5px; }
/* Practice: words waiting for review */
#practice { position: relative; overflow: visible; }
#practice[data-due]::after { content: attr(data-due); position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--danger); color: #fff; font: 800 11px/20px var(--body); text-align: center; box-shadow: 0 0 0 2px var(--surface); pointer-events: none; animation: pop .3s var(--spring); }
.p-scope { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 720px) { .p-scope { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .p-scope { grid-template-columns: minmax(0, 1fr); } }
.p-ic.due { color: var(--danger); } .p-card.on .p-ic.due { background: var(--danger); color: #fff; }
.p-cnt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.p-speak { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.p-speak input { width: 17px; height: 17px; accent-color: var(--accent); }
/* pronunciation */
.say { display: inline-grid; place-items: center; width: 30px; height: 30px; margin-left: 8px; vertical-align: middle; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; padding: 0; transition: transform .2s var(--spring), background-color .15s ease; font: inherit; }
.say svg { width: 16px; height: 16px; }
.say:hover { background: var(--chip); } .say:active { transform: scale(.9); }
.say.on { animation: say-pulse .55s var(--ease); }
@keyframes say-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
.dline .say { width: 24px; height: 24px; margin-left: 6px; } .dline .say svg { width: 13px; height: 13px; }
.dbig .say { width: 34px; height: 34px; }
.srs-line { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.c-box { letter-spacing: 1px; color: var(--accent); font-size: 10px; }
/* typing mode */
.trainer.wr-mode .t-btns, .trainer.wr-mode .keys { display: none; }
.c-write { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
.c-write input { flex: 1; min-width: 0; max-width: 340px; font: 600 20px var(--body); padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); text-align: center; }
.c-write input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.c-write .btn { border-radius: 14px; }
.c-keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.c-keys button { min-width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 15px var(--body); cursor: pointer; padding: 0 6px; }
.c-keys button:hover { background: var(--chip); } .c-keys button:active { transform: scale(.92); }
.c-wres .c-verdict { font-weight: 800; font-size: 15px; }
.c-wres.ok .c-verdict { color: var(--ok); } .c-wres.almost .c-verdict { color: var(--warn); } .c-wres.bad .c-verdict { color: var(--danger); }
.c-typed { color: var(--muted); font-size: 15px; } .c-typed s { text-decoration-color: var(--danger); }
.c-word mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 4px; padding: 0 1px; }
.c-next { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }
.d-streak { margin: 0; font-weight: 700; color: var(--muted); }
.stage { min-width: 0; } .card, .c-body, .c-body > * { min-width: 0; max-width: 100%; }
.c-write input { width: 100%; }
@media (max-width: 560px) { .c-write { flex-wrap: wrap; } .c-write input { flex-basis: 100%; max-width: none; } .c-write .btn { flex: 1; } .card { padding: 26px 16px 20px; } }
/* Progress: rows open their words; activity; hard words */
.st-row { cursor: pointer; border-radius: 10px; padding: 3px 4px; margin: -3px -4px; transition: background-color .15s ease; }
.st-row:hover, .st-row:focus-visible { background: var(--chip); outline: none; }
.st-rl > svg { width: 14px; height: 14px; flex: none; color: var(--faint); transition: transform .2s var(--ease); transform: rotate(-90deg); }
.st-row.open .st-rl > svg { transform: none; }
.st-open { margin: 2px 0 6px; padding: 10px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); display: grid; gap: 8px; animation: rise .25s var(--ease) both; }
.st-oh { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.st-wl { display: flex; flex-wrap: wrap; gap: 6px; max-height: 300px; overflow: auto; padding: 1px; }
.st-w { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font: 13px var(--body); color: var(--ink); cursor: pointer; max-width: 100%; text-align: left; transition: border-color .15s ease, transform .2s var(--spring); }
.st-w b { font-weight: 700; } .st-w small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
.st-w em { font-style: normal; font-size: 11.5px; font-weight: 800; color: var(--danger); } .st-w em.okm { color: var(--ok); }
.st-w.ok { background: color-mix(in srgb, var(--ok) 7%, var(--surface)); }
.st-w:hover { border-color: var(--accent); } .st-w:active { transform: scale(.97); }
.act-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .act-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.act-k { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.act-k b { font: 700 24px/1.15 var(--body); } .act-k small { font-size: 12px; color: var(--muted); } .act-k .btn { justify-self: start; margin-top: 6px; }
.heat { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 6px; row-gap: 4px; max-width: 620px; }
.hm-m { grid-column: 2; display: grid; gap: 3px; font-size: 10.5px; color: var(--faint); }
.hm-m span { white-space: nowrap; overflow: visible; min-width: 0; }
.hm-wd { grid-column: 1; grid-row: 2; display: grid; grid-template-rows: repeat(7, minmax(0, 1fr)); gap: 3px; font-size: 10px; color: var(--faint); align-items: center; }
.hm { grid-column: 2; grid-row: 2; display: grid; grid-template-rows: repeat(7, auto); gap: 3px; }
.hc { display: block; aspect-ratio: 1; border-radius: 3px; background: var(--chip); }
.hc.h1 { background: var(--h1); } .hc.h2 { background: var(--h2); } .hc.h3 { background: var(--h3); } .hc.h4 { background: var(--h4); }
.hc.fut { background: transparent; }
.hm-key { display: flex; align-items: center; gap: 4px; justify-content: flex-start; font-size: 11.5px; color: var(--faint); }
.hm-key .hc { width: 11px; height: 11px; }
/* ===== v0.12: topic menu and dialog, duplicates, search highlight ===== */
.ghead .tmore { width: 32px; height: 32px; flex: none; border: 0; background: transparent; border-radius: 9px; color: var(--faint); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background-color .18s ease, color .18s ease; }
.ghead .tmore:hover, .ghead .tmore[aria-expanded="true"] { background: var(--chip); color: var(--ink); }
.ghead .tmore svg { width: 17px; height: 17px; }
.group.flash { animation: tp-flash 1s var(--ease); }
@keyframes tp-flash { 30% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--neon) 55%, transparent), 0 10px 30px -12px var(--neon); } }
.tp-body { display: grid; gap: 10px; }
.tp-names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .tp-names { grid-template-columns: 1fr; } }
.tp-opt { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; transition: border-color .2s, background-color .2s; }
.tp-opt:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.tp-opt.danger:has(input:checked) { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 7%, var(--surface)); color: var(--danger); }
.tp-opt input { accent-color: var(--accent); } .tp-opt.danger input { accent-color: var(--danger); }
.tp-sub { margin: -4px 0 2px 30px; }
.tp-sub select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.btn.primary.danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.dup-seg { width: max-content; max-width: 100%; }
.dup-g { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); animation: rise .35s var(--ease) both; }
.dup-g header { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 2px; }
.dup-g header b { font-size: 18px; font-family: var(--display); }
.dup-g header small { color: var(--faint); font-size: 12px; }
.dup-w { display: flex; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 10px; cursor: pointer; transition: background-color .2s; }
.dup-w:hover { background: color-mix(in srgb, var(--chip) 60%, transparent); }
.dup-w:has(input:checked) { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.dup-w input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex: none; }
.dw-main { display: grid; min-width: 0; }
.dw-main small { color: var(--muted); font-size: 12.5px; }
.dup-act { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.dup-undo { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 8px 7px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; background: color-mix(in srgb, var(--ok) 11%, var(--surface)); border: 1px solid color-mix(in srgb, var(--ok) 35%, var(--line)); animation: rise .3s var(--ease) both; }
.dup-none { display: grid; justify-items: center; gap: 8px; padding: 22px 12px; text-align: center; color: var(--muted); }
.dup-none b { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); font-size: 22px; animation: pop .4s var(--spring) both; }
.dup-none p { margin: 0; }
.w mark { background: color-mix(in srgb, var(--neon) 24%, transparent); color: inherit; border-radius: 4px; padding: 0 1px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--neon) 30%, transparent); }
/* ===== v0.13: multiple choice, listening, gender, plural; the daily goal ===== */
.c-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; text-align: left; }
.c-opts.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.c-opt { position: relative; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font: 600 15.5px/1.3 var(--body); text-align: left; cursor: pointer;
  transition: border-color .18s ease, background-color .18s ease, opacity .2s ease, transform .14s var(--ease); }
.c-opt:hover:not(:disabled) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.c-opt:active:not(:disabled) { transform: scale(.97); }
.c-opt:disabled { cursor: default; }
.c-opt kbd { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font: 700 11.5px var(--body); color: var(--faint); background: var(--chip); transition: background-color .2s, color .2s; }
.c-opt span { min-width: 0; overflow-wrap: anywhere; }
.c-opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, var(--surface)); animation: pop .3s var(--spring); }
.c-opt.wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 11%, var(--surface)); animation: nudge .4s ease; }
.c-opt.right kbd { background: var(--ok); color: #fff; } .c-opt.wrong kbd { background: var(--danger); color: #fff; }
.c-opt.dim { opacity: .45; }
.c-opts.g3 .c-opt { flex-direction: column; justify-content: center; gap: 5px; min-height: 66px; text-align: center; font-size: 15px; }
.c-opt.gm span { color: var(--m); } .c-opt.gf span { color: var(--f); } .c-opt.gn span { color: var(--n); }
.c-opt.gm:not(:disabled) { border-color: color-mix(in srgb, var(--m) 35%, var(--line)); } .c-opt.gf:not(:disabled) { border-color: color-mix(in srgb, var(--f) 35%, var(--line)); } .c-opt.gn:not(:disabled) { border-color: color-mix(in srgb, var(--n) 35%, var(--line)); }
.c-verdict.bad { color: var(--danger); font-weight: 800; font-size: 14px; }
.c-khint { font-size: 12px; color: var(--faint); }
@media (pointer: coarse) { .c-khint { display: none; } .c-opt kbd { display: none; } .c-opts.g3 .c-opt kbd { display: none; } }
.c-listen { justify-self: center; width: 86px; height: 86px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center; color: var(--on-neon, #fff); background: linear-gradient(135deg, var(--neon), var(--neon2)); box-shadow: 0 14px 30px -14px var(--neon); transition: transform .15s var(--ease); }
.c-listen:hover { transform: scale(1.04); } .c-listen:active { transform: scale(.94); }
.c-listen svg { width: 40px; height: 40px; }
.c-listen.playing { animation: listen-ring 1s ease-out; }
@keyframes listen-ring { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--neon) 55%, transparent), 0 14px 30px -14px var(--neon); } to { box-shadow: 0 0 0 24px transparent, 0 14px 30px -14px var(--neon); } }
.pm-g { gap: 1px; letter-spacing: -1px; } .pm-g b { font-size: 10px; }
@media (max-width: 560px) { .c-opts { grid-template-columns: minmax(0, 1fr); } .c-opts.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .c-opt { min-height: 48px; } }
.p-goal { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; background: color-mix(in srgb, var(--neon) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--neon) 22%, var(--line)); font: 650 13.5px var(--body); }
.p-goal > span:first-child { white-space: nowrap; }
.gm { flex: 1 1 80px; height: 7px; border-radius: 7px; background: var(--line); overflow: hidden; }
.gm i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--neon), var(--neon2)); transition: width .5s var(--ease); }
.p-goal.done, .act-goal.done { background: color-mix(in srgb, var(--ok) 11%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.p-goal.done .gm i, .act-goal.done .gm i { background: var(--ok); }
.t-score .sc-goal { color: var(--muted); }
.t-score .sc-goal.done { color: var(--ok); }
.act-goal { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 2px 0 12px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); font-size: 13px; }
.act-goal .ag-l { font-weight: 700; }
.act-goal small { color: var(--muted); }
.goal-seg button { padding: 4px 9px; font-variant-numeric: tabular-nums; }
/* ===== v0.14: starter packs, CSV, privacy ===== */
.btn.pack { border-color: color-mix(in srgb, var(--neon) 45%, var(--line)); background: color-mix(in srgb, var(--neon) 8%, var(--surface)); }
.btn.pack:hover { background: color-mix(in srgb, var(--neon) 15%, var(--surface)); }
.csv-row, .pack-row { display: grid; gap: 6px; margin-top: 4px; padding-top: 10px; border-top: 1px dashed var(--line); }
.pv-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pv-list li { position: relative; padding: 11px 14px 11px 40px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); font-size: 14.5px; line-height: 1.5; animation: rise .4s var(--ease) both; }
.pv-list li::before { content: "✓"; position: absolute; left: 13px; top: 11px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 900; color: #fff; background: var(--ok); }
.pv-list b { color: var(--ink); }
/* ===== v0.15: sharing a topic, a shared topic arriving, installing ===== */
.sh-info { margin: -4px 0 0; color: var(--muted); font-size: 14px; }
.sh-btns { display: grid; gap: 8px; }
.sh-btns .btn { min-height: 44px; justify-content: flex-start; padding-inline: 14px; }
.pk-head { display: grid; gap: 2px; }
.pk-head b { font-family: var(--display); font-size: 21px; }
.pk-head span { color: var(--muted); font-size: 13.5px; }
.pk-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pk-chip { padding: 4px 10px; border-radius: 999px; background: var(--chip); font-size: 13.5px; font-weight: 600; animation: pop .3s var(--spring) both; }
.pk-chip.more { color: var(--muted); }
/* ===== v0.16: sorting, aspect pairs, the backup reminder ===== */
.sortbtn svg { width: 15px; height: 15px; }
.sortbtn.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
body.stats-on .sortbtn { display: none !important; }
@media (max-width: 640px) { .sortbtn span { display: none; } }
.menu button.on { color: var(--accent); font-weight: 700; }
.menu button.on::after { content: "✓"; float: right; margin-left: 14px; }
.ap-pair { font-weight: 600; } .ap-pair i { font-style: normal; color: var(--faint); margin: 0 2px; }
.bkbar .sb-cloud { font-size: 18px; line-height: 1; }
.updbar:not([hidden]) ~ .bkbar { top: calc(70px + env(safe-area-inset-top, 0px)); }
@media (max-width: 520px) { .bkbar #bk-text { flex: 1 1 calc(100% - 40px); } }
/* ===== v0.17: new words, an example on the answer side, dropping files, printing ===== */
.p-scope { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 720px) { .p-scope { grid-template-columns: repeat(2, minmax(0, 1fr)); } .p-scope .p-card:last-child { grid-column: 1 / -1; } }
@media (max-width: 420px) { .p-scope { grid-template-columns: minmax(0, 1fr); } }
.p-ic.new { color: var(--neon); } .p-card.on .p-ic.new { background: linear-gradient(135deg, var(--neon), var(--neon2)); color: #fff; }
.c-ex { display: grid; gap: 2px; justify-self: center; max-width: 46ch; font-size: 14.5px; font-style: italic; color: var(--ink); padding: 8px 12px; border-left: 3px solid color-mix(in srgb, var(--neon) 55%, var(--line)); background: color-mix(in srgb, var(--neon) 5%, transparent); border-radius: 4px 10px 10px 4px; text-align: left; }
.c-ex span { font-style: normal; font-size: 13px; color: var(--muted); }
.dropv { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 20px; background: color-mix(in srgb, var(--bg) 72%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); pointer-events: none; animation: fade-in .2s ease; }
.dv-in { display: grid; justify-items: center; gap: 8px; padding: 34px 44px; border-radius: 26px; border: 2.5px dashed var(--neon); background: var(--surface); color: var(--ink); text-align: center; box-shadow: 0 30px 80px -30px var(--neon); animation: pop .3s var(--spring); }
.dv-in svg { width: 44px; height: 44px; color: var(--neon); }
.dv-in b { font: 700 22px var(--display); } .dv-in small { color: var(--muted); font-size: 14px; }
.printv { display: none; }
@media print {
  body > :not(.printv) { display: none !important; }
  html, body { background: #fff !important; }
  .printv { display: block; color: #000; font: 10.5pt/1.35 var(--body); }
  .pv-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12pt; border-bottom: 1.4pt solid #000; padding-bottom: 4pt; margin-bottom: 6pt; }
  .pv-h b { font: 700 15pt var(--display); } .pv-h span { color: #444; }
  .printv h2 { font: 700 12.5pt var(--display); margin: 12pt 0 3pt; break-after: avoid; }
  .printv h2 small { font: 400 9pt var(--body); color: #777; }
  .printv table { width: 100%; border-collapse: collapse; }
  .printv td { padding: 2.5pt 5pt; border-bottom: .5pt solid #ccc; vertical-align: top; }
  .printv tr { break-inside: avoid; }
  .printv .pr-w { width: 42%; } .printv .pr-lv { width: 26pt; text-align: right; color: #666; font-size: 8.5pt; }
  .printv small { color: #555; }
  .printv .g-m { color: #1d55b4; } .printv .g-f { color: #bf2620; } .printv .g-n { color: #13743b; }
  @page { margin: 14mm 12mm; }
}
/* ===== v0.18: "you already have this word" in the form; the toast sits above the selection bar ===== */
.dupw { margin: -4px 0 0; font-size: 12.5px; line-height: 1.35; color: var(--note-ink); background: var(--note); border: 1px solid var(--note-line); border-radius: 9px; padding: 5px 8px; }
.dupw .linkbtn { padding: 0 2px; font-size: 12.5px; }
:root.sel-on:not(.toast-top) #toast[popover], :root.sel-on:not(.toast-top) #toast:not([popover]) { bottom: calc(var(--selh, 52px) + 26px + env(safe-area-inset-bottom, 0px)); }
/* ===== v0.19: "Fill the gap", the keyboard keys ===== */
.c-cloze { line-height: 1.6; }
.c-gap { display: inline-block; min-width: 3.2em; height: 1.05em; margin: 0 2px; vertical-align: -2px; border-bottom: 2.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); border-radius: 4px 4px 0 0; }
.c-cloze mark { background: color-mix(in srgb, var(--ok) 22%, transparent); color: inherit; border-radius: 4px; padding: 0 2px; font-weight: 700; }
.pm-gap { letter-spacing: 0; }
.kb-body { display: grid; gap: 14px; }
.kb-sec { display: grid; gap: 6px; }
.kb-sec h3 { margin: 0 0 2px; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.kb-row { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14.5px; }
.kb-k { display: flex; flex-wrap: wrap; gap: 4px; }
.kb-body kbd { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 7px; border: 1px solid var(--line); border-bottom-width: 2.5px; background: var(--surface); font: 700 12.5px var(--body); color: var(--ink); }
/* ===== v0.20: example sentences on demand ===== */
.p-clhint { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 9px 12px; border-radius: 12px; background: color-mix(in srgb, var(--neon) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--neon) 22%, var(--line)); font-size: 13.5px; animation: rise .3s var(--ease) both; }
.p-clhint > span { flex: 1 1 200px; }
.p-clhint small { color: var(--muted); font-size: 12.5px; flex-basis: 100%; }
/* ===== v0.21: word forms ===== */
.fm-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fm { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.fm th, .fm td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.fm thead th { font-size: 12px; font-weight: 800; color: var(--muted); }
.fm thead th small { font-weight: 600; color: var(--faint); }
.fm tbody th { font-weight: 600; color: var(--muted); white-space: nowrap; width: 1%; }
.fm tbody th small { font-weight: 500; color: var(--faint); font-size: 12px; }
.fm td { font-weight: 650; }
.fm tr:last-child > * { border-bottom: 0; }
.fm .fm-sep > * { border-top: 2px solid var(--line); }
.fm-busy { display: flex; align-items: center; gap: 10px; }
.fm-busy .spinner { width: 18px; height: 18px; border-width: 2px; }
@media (max-width: 420px) { .fm { font-size: 13.5px; } .fm th, .fm td { padding: 4px 5px; } .fm tbody th small { display: block; } }

:root[data-theme="dark"] { --page-pen: #a9c1ff; }
.status { position: relative; justify-items: start; gap: 6px; text-align: left; padding: 15px 22px 20px 46px; border: 1px solid var(--line); border-radius: 6px; color: var(--page-pen); font: 600 23px/30px var(--hand);
  background-color: var(--surface); background-image: repeating-linear-gradient(to bottom, transparent 0 29px, var(--rule2) 29px 30px); background-position: 0 15px;
  box-shadow: 4px 4px 0 -1px var(--surface), 4px 4px 0 0 var(--line), var(--paper-shadow); }
.status::before { content: ""; position: absolute; top: 0; bottom: 0; left: 32px; width: 1.5px; background: var(--rule-red); pointer-events: none; }
.status :is(.btn, button) { font-family: var(--body); line-height: 1.2; }
.status .empty-btns { justify-content: flex-start; margin-top: 10px; }
@media (max-width: 640px) { .status { padding: 15px 12px 18px 19px; font-size: 22px; } .status::before { left: 10px; } }
.updbar { background: linear-gradient(172deg, var(--sheet1), var(--sheet2)); color: var(--sheet-ink); border: 0; border-radius: 3px 3px 4px 18px / 3px 3px 4px 8px; -webkit-backdrop-filter: none; backdrop-filter: none;
  box-shadow: 0 1px 1px rgba(60, 45, 0, .08), 0 16px 24px -14px rgba(60, 45, 0, .55); rotate: .8deg; }
.updbar.bkbar, .updbar.syncbar { rotate: -1deg; }
.updbar #upd-text span { color: color-mix(in srgb, var(--sheet-ink) 68%, transparent); }
.upd-x { color: color-mix(in srgb, var(--sheet-ink) 72%, transparent); }
.upd-x:hover { background: color-mix(in srgb, var(--sheet-ink) 10%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .updbar { box-shadow: 0 16px 26px -14px rgba(0, 0, 0, .8); } }
:root[data-theme="dark"] .updbar { box-shadow: 0 16px 26px -14px rgba(0, 0, 0, .8); }
.done h2 { font: 600 34px/1.1 var(--hand); color: var(--pen-red); transform: rotate(-2deg); }
@media (max-width: 640px) { .updbar { rotate: .4deg; } .updbar.bkbar, .updbar.syncbar { rotate: -.5deg; } }
/* ===== v0.29: a computer gets more words on screen — the search sits in the top row and the counts live on the tabs; practice happens on the same squared desk ===== */
@media (min-width: 1000px) {
  .top .wrap { grid-template-columns: auto auto minmax(220px, 1fr) auto auto auto; grid-template-areas: "br sw q dk hb sb" "st st st st st st" "r3 r3 r3 r3 r3 r3" "lg lg lg lg lg lg"; column-gap: 10px; align-items: center; }
  .top .row1 { display: contents; }
  .top .row1 > .spacer { display: none; }
  .top #home { grid-area: br; } .top #dictseg { grid-area: sw; } .top #dock { grid-area: dk; } .top #help-btn { grid-area: hb; } .top #settings-btn { grid-area: sb; }
  .top .search { grid-area: q; max-width: 560px; margin-inline: 8px 6px; }
  .top .statsrow { grid-area: st; } .top .row3 { grid-area: r3; } .top .legend { grid-area: lg; }
  .top .statsrow .stats { display: none; }
  .top .statsrow:not(:has(> button:not([hidden]))) { display: none; }
}
.trainer { isolation: isolate; }
.trainer::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .75;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; background-position: center -1px; }
/* ===== v0.30: every page has its title written by hand, like a heading in a real notebook; sticky notes too ===== */
.ghead h2 { font: 600 28px/1 var(--hand); color: var(--page-pen); letter-spacing: .005em; padding-top: 2px; }
.sheet h3 { font: 600 25px/1.05 var(--hand); }
@media (max-width: 640px) { .ghead h2 { font-size: 26px; } .sheet h3 { font-size: 24px; } }
/* ===== v0.31: tablets — a tidy header: the search and the list tools share a row, the tabs sit below, the counts live only on the tabs ===== */
@media (min-width: 641px) and (max-width: 999px) {
  .top .wrap { grid-template-columns: minmax(0, 1fr) auto auto auto auto; grid-template-areas: "r1 r1 r1 r1 r1" "st st st st st" "q so cs se hi" "tb tb tb tb tb" "lg lg lg lg lg"; column-gap: 8px; }
  .top .row1 { grid-area: r1; }
  .top .statsrow { grid-area: st; }
  .top .statsrow .stats { display: none; }
  .top .statsrow:not(:has(> button:not([hidden]))) { display: none; }
  .top .search { grid-area: q; min-width: 0; }
  .top .row3 { display: contents; }
  .top .row3 > .spacer { display: none; }
  .top .tabs { grid-area: tb; justify-self: start; }
  .top #sortbtn { grid-area: so; } .top #colseg { grid-area: cs; } .top #selmode { grid-area: se; } .top #hidemode { grid-area: hi; }
  .top .legend { grid-area: lg; }
  body.stats-on .top .wrap { grid-template-areas: "r1 r1 r1 r1 r1" "st st st st st" "tb tb tb tb tb"; }
}
/* honest "Learned": the ring around ✓ fills box by box; only a full ring (box 5) can move a word to learned */
.lrn { position: relative; }
.lrn:not(.back):not(.ready) { color: var(--faint); border-color: color-mix(in srgb, var(--ok) 16%, var(--line)); }
.lrn:not(.back):not(.ready)::before { content: ""; position: absolute; inset: -1.5px; border-radius: 50%; pointer-events: none; background: conic-gradient(var(--ok) calc(var(--b, 0) * 72deg), transparent 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.2px), #000 calc(100% - 1.8px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2.2px), #000 calc(100% - 1.8px)); }
.lrn:not(.back):not(.ready):hover, .lrn:not(.back):not(.ready):focus-visible { background: var(--chip); color: var(--muted); border-color: color-mix(in srgb, var(--ok) 16%, var(--line)); }
.lrn.ready { background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: var(--ok); }
.lrn.nope { animation: nudge .4s ease; }
.p-check { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 12px 10px 14px; border-radius: 3px 3px 4px 18px / 3px 3px 4px 8px; background: linear-gradient(172deg, var(--sheet1), var(--sheet2)); color: var(--sheet-ink);
  box-shadow: 0 1px 1px rgba(60, 45, 0, .08), 0 12px 18px -12px rgba(60, 45, 0, .5); rotate: -.4deg; }
.p-check > b { flex: 1 1 200px; font-size: 14px; }

.d-back { margin: 0; font-size: 13.5px; font-weight: 650; color: var(--warn); }
#viewnote .linkbtn { margin-left: 6px; font-size: 13px; }
