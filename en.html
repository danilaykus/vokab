  tu_type_ai: ["Напиши слово — можна навіть своєю мовою, я знайду потрібне. Потім натисни **✨** — заповняться переклади, вимова, рід, приклади й навіть тема.", "Type a word, even in your own language, and I'll find the right one. Then tap **✨**: translations, pronunciation, gender, examples and even the topic get filled in.", "Napiš slovo, klidně i ve svém jazyce, najdu to správné. Pak klepni na **✨** a doplní se překlady, výslovnost, rod, příklady i téma.", "Напиши слово — можно даже на своём языке, я найду нужное. Потом нажми **✨** — заполнятся переводы, произношение, род, примеры и даже тема."],
  tu_type_free: ["Напиши слово й натисни **«Заповнити з інтернету»** — підтягнуться переклади й вимова. Підключиш свій ШІ в Налаштуваннях — кнопка стане **✨** і заповнюватиме все.", "Type a word and tap **“Fill from the internet”** to get translations and pronunciation. Connect your own AI in Settings and the button turns into **✨** that fills in everything.", "Napiš slovo a klepni na **„Doplnit z internetu“**, doplní se překlady a výslovnost. Když si v Nastavení připojíš vlastní AI, tlačítko se změní na **✨** a doplní všechno.", "Напиши слово и нажми **«Заполнить из интернета»** — подтянутся переводы и произношение. Подключишь свой ИИ в Настройках — кнопка станет **✨** и будет заполнять всё."],
  tu_topic: ["**Тема** — це папка для слова. Обери готову або напиши назву нової.", "The **topic** is a folder for the word. Pick one or type a name for a new one.", "**Téma** je složka pro slovo. Vyber hotové nebo napiš název nového.", "**Тема** — это папка для слова. Выбери готовую или напиши название новой."],
  tu_save: ["Усе готово? Натисни **«Зберегти»** — і слово в словнику! Потрібен хоча б один переклад.", "All set? Tap **“Save”** and the word is in your dictionary! It needs at least one translation.", "Hotovo? Klepni na **„Uložit“** a slovo je ve slovníku! Potřebuje aspoň jeden překlad.", "Всё готово? Нажми **«Сохранить»** — и слово в словаре! Нужен хотя бы один перевод."],
  tu_row_cs: ["Ось так виглядає слово. **Колір — це рід**: [m:синій] — чоловічий, [f:червоний] — жіночий, [n:зелений] — середній. Поруч: множина, [як читати], ≈ синоніми й **!** особливість.", "This is what a word looks like. **The colour shows the gender**: [m:blue] masculine, [f:red] feminine, [n:green] neuter. Next to it: the plural, [how to read it], ≈ synonyms and **!** a note.", "Takhle vypadá slovo. **Barva ukazuje rod**: [m:modrá] mužský, [f:červená] ženský, [n:zelená] střední. Vedle je množné číslo, [výslovnost], ≈ synonyma a **!** poznámka.", "Вот так выглядит слово. **Цвет — это род**: [m:синий] — мужской, [f:красный] — женский, [n:зелёный] — средний. Рядом: множественное число, [как читать], ≈ синонимы и **!** особенность."],
  tu_row_en: ["Ось так виглядає слово: англійське, /вимова/ й ≈ синоніми, а поруч — переклад. Чеський переклад розфарбований за родом: [m:синій], [f:червоний], [n:зелений].", "This is what a word looks like: the English word, its /pronunciation/ and ≈ synonyms, with the translation next to it. A Czech translation is coloured by gender: [m:blue], [f:red], [n:green].", "Takhle vypadá slovo: anglické slovo, /výslovnost/ a ≈ synonyma, vedle překlad. Český překlad je obarvený podle rodu: [m:modrá], [f:červená], [n:zelená].", "Вот так выглядит слово: английское, /произношение/ и ≈ синонимы, а рядом — перевод. Чешский перевод раскрашен по роду: [m:синий], [f:красный], [n:зелёный]."],
  tu_row_demo: ["Коли додаси слова, вони виглядатимуть так. **Колір — це рід**: [m:синій] — чоловічий, [f:червоний] — жіночий, [n:зелений] — середній.", "Once you add words, they'll look like this. **The colour shows the gender**: [m:blue] masculine, [f:red] feminine, [n:green] neuter.", "Až přidáš slova, budou vypadat takhle. **Barva ukazuje rod**: [m:modrá] mužský, [f:červená] ženský, [n:zelená] střední.", "Когда добавишь слова, они будут выглядеть так. **Цвет — это род**: [m:синий] — мужской, [f:красный] — женский, [n:зелёный] — средний."],
  tu_row_demo_en: ["Коли додаси слова, вони виглядатимуть так: слово, /вимова/ і переклад поруч.", "Once you add words, they'll look like this: the word, its /pronunciation/ and the translation next to it.", "Až přidáš slova, budou vypadat takhle: slovo, /výslovnost/ a vedle překlad.", "Когда добавишь слова, они будут выглядеть так: слово, /произношение/ и перевод рядом."],
  tu_tap: ["Натисни на слово — відкриється його картка.", "Tap the word to open its card.", "Klepni na slovo a otevře se jeho karta.", "Нажми на слово — откроется его карточка."],
  tu_detail: ["Тут усе про слово: переклади, пояснення й приклади. **«Редагувати»** — якщо треба щось виправити.", "Everything about the word: translations, explanation and examples. **“Edit”** if something needs fixing.", "Tady je o slově všechno: překlady, vysvětlení a příklady. **„Upravit“**, když je potřeba něco opravit.", "Здесь всё о слове: переводы, объяснение и примеры. **«Редактировать»** — если нужно что-то поправить."],
  tu_more: ["**⋯** — меню слова: редагувати, прибрати **в архів**, коли вивчив, або видалити.", "**⋯** is the word menu: edit the word, **archive** it once you know it, or delete it.", "**⋯** je nabídka slova: upravit, dát **do archivu**, když ho umíš, nebo smazat.", "**⋯** — меню слова: редактировать, убрать **в архив**, когда выучил, или удалить."],
  tu_photo: ["**Фото** — справжня магія ✨ Сфотографуй сторінку зошита чи підручника (до 10 фото): ШІ прочитає слова, заповнить їх і розкладе за темами. Сумнівні слова покаже першими.", "**Photo** is real magic ✨ Snap a page of your notebook or textbook (up to 10 photos): the AI reads the words, fills them in and sorts them into topics. Words it isn't sure about come first.", "**Fotka** je opravdové kouzlo ✨ Vyfoť stránku sešitu nebo učebnice (až 10 fotek): AI přečte slova, doplní je a roztřídí do témat. Nejistá slova ukáže jako první.", "**Фото** — настоящая магия ✨ Сфотографируй страницу тетради или учебника (до 10 фото): ИИ прочитает слова, заполнит их и разложит по темам. Сомнительные слова покажет первыми."],
  tu_photo_noai: ["Поки ключа ШІ немає, надішли фото в будь-який чат ШІ за інструкцією в цьому вікні.", "Until you add an AI key, send the photo to any AI chat using the instructions in that window.", "Dokud nemáš klíč AI, pošli fotku do libovolného chatu s AI podle návodu v tom okně.", "Пока ключа ИИ нет, отправь фото в любой чат с ИИ по инструкции в этом окне."],
  tu_tabs: ["**Активні** — те, що вчиш зараз. **Архів** — те, що вже знаєш: не заважає, але збережене. **Кошик** — видалене, його можна повернути.", "**Active** is what you're learning now. **Archive** holds words you already know: out of the way, but saved. **Trash** keeps deleted words, so you can bring them back.", "**Aktivní** je to, co se učíš teď. **Archiv** jsou slova, která už umíš: nepřekážejí, ale zůstanou. **Koš** jsou smazaná slova, dají se vrátit.", "**Активные** — то, что учишь сейчас. **Архив** — то, что уже знаешь: не мешает, но сохранено. **Корзина** — удалённое, его можно вернуть."],
  tu_select: ["**«Вибрати»** — познач одразу кілька слів: потренувати тільки їх, перенести в іншу тему, прибрати в архів або видалити.", "**“Select”** lets you tick several words at once: practise just those, move them to another topic, archive or delete them.", "**„Vybrat“**: zaškrtni víc slov najednou a procvič jen je, přesuň je do jiného tématu, dej do archivu nebo smaž.", "**«Выбрать»** — отметь сразу несколько слов: потренировать только их, перенести в другую тему, убрать в архив или удалить."],
  tu_hide: ["Перевір себе просто в списку! Натисни **«Сховати переклад»**.", "Test yourself right in the list! Tap **“Hide translation”**.", "Vyzkoušej se přímo v seznamu! Klepni na **„Skrýt překlad“**.", "Проверь себя прямо в списке! Нажми **«Скрыть перевод»**."],
  tu_hide2: ["Переклади сховались 🙈 Натисни на слово — підглянеш. Натискай кнопку далі: **«Сховати слово»**, потім **«Показати все»**.", "The translations are hidden 🙈 Tap a word to peek. Keep tapping the button: **“Hide word”**, then **“Show all”**.", "Překlady se schovaly 🙈 Klepni na slovo a nakoukneš. Klepej na tlačítko dál: **„Skrýt slovo“**, pak **„Zobrazit vše“**.", "Переводы спрятались 🙈 Нажми на слово — подсмотришь. Нажимай кнопку дальше: **«Скрыть слово»**, потом **«Показать всё»**."],
  tu_hide_info: ["**«Сховати переклад»** перетворює список на самоперевірку: переклади розмиваються, а дотик до слова показує відповідь.", "**“Hide translation”** turns the list into a self-test: the translations blur, and tapping a word shows the answer.", "**„Skrýt překlad“** udělá ze seznamu test: překlady se rozmažou a klepnutí na slovo ukáže odpověď.", "**«Скрыть перевод»** превращает список в самопроверку: переводы размываются, а нажатие на слово показывает ответ."],
  tu_search: ["**Пошук** шукає одразу всіма мовами. А чипи з темами під шапкою миттю переносять до потрібної теми.", "**Search** looks in every language at once. The topic chips below the header jump straight to a topic.", "**Hledání** hledá ve všech jazycích najednou. Štítky s tématy pod záhlavím tě hned přenesou k tématu.", "**Поиск** ищет сразу на всех языках. А чипы с темами под шапкой мигом переносят к нужной теме."],
  tu_practice: ["А тепер найголовніше — **Практика**! Натисни.", "And now the most important part: **Practice**! Tap it.", "A teď to nejdůležitější: **Procvičování**! Klepni.", "А теперь самое главное — **Практика**! Нажми."],
  tu_practice_info: ["**Практика** — картки для запам'ятовування. Коли додаси слова, натискай сюди: картка, переворот, свайп — і слова запам'ятовуються.", "**Practice** is flip cards for remembering. Once you have words, tap here: card, flip, swipe, and the words stick.", "**Procvičování** jsou kartičky na zapamatování. Až budeš mít slova, klepni sem: karta, otočit, švihnout a slova se ti vryjí do paměti.", "**Практика** — карточки для запоминания. Когда добавишь слова, нажимай сюда: карточка, переворот, свайп — и слова запоминаются."],
  tu_p_what: ["Обери, **що** вчити: усі слова, лише деякі теми або вибрані слова.", "Choose **what** to practise: all your words, some topics or the words you selected.", "Vyber, **co** procvičovat: všechna slova, jen některá témata nebo vybraná slova.", "Выбери, **что** учить: все слова, только некоторые темы или выбранные слова."],
  tu_p_mode: ["І **як**: з перекладу на слово, навпаки, упереміш або за поясненням — це найскладніший рівень 💪", "And **how**: translation → word, the other way round, mixed, or from the explanation, the hardest level 💪", "A **jak**: z překladu na slovo, naopak, napřeskáčku nebo podle vysvětlení, to je nejtěžší úroveň 💪", "И **как**: с перевода на слово, наоборот, вперемешку или по объяснению — это самый сложный уровень 💪"],
  tu_p_start: ["Натисни **«Почати»**!", "Tap **“Start”**!", "Klepni na **„Začít“**!", "Нажми **«Начать»**!"],
  tu_card: ["Пригадай відповідь і **натисни на картку** — вона перевернеться.", "Think of the answer, then **tap the card** to flip it.", "Vzpomeň si na odpověď a **klepni na kartu**, otočí se.", "Вспомни ответ и **нажми на карточку** — она перевернётся."],
  tu_judge: ["Знаєш? **✓ Знаю** або свайп управо. Ні — **✕ Ще раз** або вліво: слово повернеться, доки не вивчиш. На комп'ютері: пробіл, ← і →.", "Got it? **✓ I know** or swipe right. Not yet? **✕ Again** or swipe left: the word comes back until you know it. On a computer: Space, ← and →.", "Víš? **✓ Umím** nebo švihni doprava. Nevíš? **✕ Znovu** nebo doleva: slovo se vrátí, dokud ho neumíš. Na počítači: mezerník, ← a →.", "Знаешь? **✓ Знаю** или свайп вправо. Нет — **✕ Ещё раз** или влево: слово вернётся, пока не выучишь. На компьютере: пробел, ← и →."],
  tu_t_done: ["Ось підсумок: скільки слів з першого разу і над якими ще попрацювати. Помилки можна повторити однією кнопкою.", "Here's your result: how many you got on the first try and which words to work on. Repeat your mistakes with one tap.", "Tady je výsledek: kolik slov napoprvé a na kterých ještě zapracovat. Chyby zopakuješ jedním klepnutím.", "Вот итог: сколько слов с первого раза и над какими ещё поработать. Ошибки можно повторить одной кнопкой."],
  tu_t_more: ["Тренуйся скільки хочеш — наприкінці покажу підсумок. А зараз ходімо далі, тренування я закрию.", "Practise as long as you like; you'll see your result at the end. For now let's move on, I'll close the practice.", "Procvičuj, jak dlouho chceš, na konci uvidíš výsledek. Teď pojďme dál, procvičování zavřu.", "Тренируйся сколько хочешь — в конце покажу итог. А сейчас пойдём дальше, тренировку я закрою."],
  tu_settings: ["Майже все! Зазирни в **Налаштування** ⚙️", "Almost done! Open **Settings** ⚙️", "Skoro hotovo! Otevři **Nastavení** ⚙️", "Почти всё! Загляни в **Настройки** ⚙️"],
  tu_s_main: ["Тут мова інтерфейсу, головний і додатковий переклад. Нижче — світла чи темна тема й звуки.", "Here: the interface language, the main and additional translation. Further down: light or dark theme and sounds.", "Tady je jazyk rozhraní a hlavní i doplňkový překlad. Níž je světlý nebo tmavý vzhled a zvuky.", "Здесь язык интерфейса, главный и дополнительный перевод. Ниже — светлая или тёмная тема и звуки."],
  tu_sync_claude: ["**Синхронізація вже працює.** Відкрий цю саму сторінку на телефоні з тим самим акаунтом Claude — слова будуть ті самі, без жодних файлів.", "**Sync already works.** Open this same page on your phone with the same Claude account and you'll see the same words, no files needed.", "**Synchronizace už funguje.** Otevři stejnou stránku v telefonu se stejným účtem Claude a uvidíš stejná slova, bez souborů.", "**Синхронизация уже работает.** Открой эту же страницу на телефоне под тем же аккаунтом Claude — слова будут те же, без всяких файлов."],
  tu_sync_drive: ["**Синхронізація:** натисни **«Підключити Google Диск»** тут і на телефоні — з тим самим акаунтом Google. Далі слова будуть однакові самі, без файлів.", "**Sync:** tap **“Connect Google Drive”** here and on your phone, with the same Google account. From then on your words stay the same everywhere, no files needed.", "**Synchronizace:** klepni na **„Připojit Google Disk“** tady i v telefonu se stejným účtem Google. Pak budou slova všude stejná sama, bez souborů.", "**Синхронизация:** нажми **«Подключить Google Диск»** здесь и на телефоне — с тем же аккаунтом Google. Дальше слова будут одинаковыми сами, без файлов."],
  tu_sync_local: ["Поки що слова зберігаються на цьому пристрої. Перенести їх на інший: **«Скопіювати мої слова»** → там **Імпорт**.", "For now your words are kept on this device. To move them to another one: **“Copy my words”**, then **Import** there.", "Zatím jsou slova uložená v tomto zařízení. Přenos na jiné: **„Zkopírovat moje slova“** → tam **Import**.", "Пока слова хранятся на этом устройстве. Перенести их на другое: **«Скопировать мои слова»** → там **Импорт**."],
  tu_ai: ["**Свій ШІ**: встав безкоштовний ключ Gemini — і запрацюють «Фото» й повне ✨ автозаповнення. Ключ зберігається лише на цьому пристрої.", "**Your own AI**: paste a free Gemini key and Photo plus full ✨ autofill start working. The key stays on this device only.", "**Vlastní AI**: vlož bezplatný klíč Gemini a začne fungovat Fotka i úplné doplňování ✨. Klíč zůstane jen v tomto zařízení.", "**Свой ИИ**: вставь бесплатный ключ Gemini — и заработают «Фото» и полное ✨ автозаполнение. Ключ хранится только на этом устройстве."],
  tu_backup: ["**Резервна копія** — файл з усіма словами. Час від часу завантажуй його про всяк випадок. **Імпорт** додає слова, нічого не стираючи.", "**Backup** is one file with all your words. Download it now and then, just in case. **Import** adds words without erasing anything.", "**Záloha** je soubor se všemi slovy. Občas si ho pro jistotu stáhni. **Import** slova přidá a nic nesmaže.", "**Резервная копия** — файл со всеми словами. Иногда скачивай его на всякий случай. **Импорт** добавляет слова, ничего не стирая."],
  tu_help: ["**«?»** — Довідка з відповідями на всі питання. Там же можна пройти це навчання ще раз.", "**“?”** opens Help with answers to everything. You can take this tour again there too.", "**„?“** otevře Nápovědu s odpověďmi na všechno. Tam si můžeš tenhle úvod i zopakovat.", "**«?»** — Справка с ответами на все вопросы. Там же можно пройти это обучение ещё раз."],
  tu_end: ["Готово! 🎉 Тепер ти знаєш усе, що вміє словник. Успіхів — і до зустрічі в Практиці!", "All done! 🎉 Now you know everything this app can do. Good luck, and see you in Practice!", "Hotovo! 🎉 Teď víš všechno, co slovník umí. Hodně štěstí a uvidíme se při procvičování!", "Готово! 🎉 Теперь ты знаешь всё, что умеет словарь. Удачи — и до встречи в Практике!"],
});

  drive_unset2: ["Кнопка «Підключити Google Диск» з'явиться, щойно власник сайту додасть свій Client ID (безкоштовно, ≈ 15 хвилин). Без цього між пристроями сама синхронізується тільки Claude-версія.", "The “Connect Google Drive” button appears once the site owner adds a Client ID (free, about 15 minutes). Until then only the Claude version syncs between devices by itself.", "Tlačítko „Připojit Google Disk“ se objeví, jakmile majitel webu doplní svůj Client ID (zdarma, asi 15 minut). Do té doby se mezi zařízeními sama synchronizuje jen verze v Claude.", "Кнопка «Подключить Google Диск» появится, как только владелец сайта добавит свой Client ID (бесплатно, ≈ 15 минут). Без этого между устройствами сама синхронизируется только Claude-версия."],

  tu_tabs: ["**Активні** — те, що вчиш зараз; кругла ✓ біля слова переносить його у **Вивчені**. **Прогрес** — графіки: скільки слів ти додав і вивчив і куди веде твій темп.", "**Active** is what you're learning now; the round ✓ next to a word moves it to **Learned**. **Progress** shows charts: how many words you've added and learned, and where your pace leads.", "**Aktivní** je to, co se učíš teď; kulaté ✓ u slova ho přesune mezi **Naučená**. **Pokrok** ukazuje grafy: kolik slov jsi přidal a naučil se a kam vede tvoje tempo.", "**Активные** — то, что учишь сейчас; круглая ✓ рядом со словом переносит его в **Выученные**. **Прогресс** — графики: сколько слов ты добавил и выучил и куда ведёт твой темп."],

  gd_ai_h: ["Як додати ключ ШІ (Gemini)", "How to add an AI key (Gemini)", "Jak přidat klíč AI (Gemini)", "Как добавить ключ ИИ (Gemini)"],
  gd_ai_intro: ["Ключ потрібен лише на сайті: з ним ✨, фото й «Кілька слів» працюють через Gemini. У Claude-версії ключ не потрібен.", "The key is only needed on the website: with it ✨, photos and “Several words” run on Gemini. The Claude version needs no key.", "Klíč je potřeba jen na webu: s ním ✨, fotky a „Více slov“ běží přes Gemini. Verze v Claude klíč nepotřebuje.", "Ключ нужен только на сайте: с ним ✨, фото и «Несколько слов» работают через Gemini. В Claude-версии ключ не нужен."],
  gd_ai_1: ["Відкрий [Google AI Studio](https://aistudio.google.com/apikey) і увійди в Google-акаунт. Якщо попросить — погодься з умовами.", "Open [Google AI Studio](https://aistudio.google.com/apikey) and sign in with Google. Accept the terms if asked.", "Otevři [Google AI Studio](https://aistudio.google.com/apikey) a přihlas se účtem Google. Pokud je třeba, odsouhlas podmínky.", "Открой [Google AI Studio](https://aistudio.google.com/apikey) и войди в Google-аккаунт. Если попросит — согласись с условиями."],
  gd_ai_2: ["Натисни **Get API key**, потім **Create API key**. Якщо попросить проєкт — вибери будь-який або створи новий.", "Click **Get API key**, then **Create API key**. If it asks for a project, pick any or create a new one.", "Klikni na **Get API key** a pak **Create API key**. Když se zeptá na projekt, vyber libovolný nebo založ nový.", "Нажми **Get API key**, потом **Create API key**. Если попросит проект — выбери любой или создай новый."],
  gd_ai_3: ["Скопіюй ключ — довгий рядок літер і цифр. Нікому його не пересилай.", "Copy the key, a long string of letters and digits. Don't send it to anyone.", "Zkopíruj klíč: dlouhý řetězec písmen a číslic. Nikomu ho neposílej.", "Скопируй ключ — длинную строку из букв и цифр. Никому его не пересылай."],
  gd_ai_4: ["В Ay!vocab відкрий **Налаштування → Помічник ШІ** і вибери **Gemini**.", "In Ay!vocab open **Settings → AI helper** and choose **Gemini**.", "V Ay!vocab otevři **Nastavení → Pomocník AI** a vyber **Gemini**.", "В Ay!vocab открой **Настройки → Помощник ИИ** и выбери **Gemini**."],
  gd_ai_5: ["Встав ключ у поле й натисни **Зберегти й перевірити**. Зелена крапка — усе працює.", "Paste the key and press **Save and check**. A green dot means it works.", "Vlož klíč a stiskni **Uložit a ověřit**. Zelená tečka znamená, že vše funguje.", "Вставь ключ в поле и нажми **Сохранить и проверить**. Зелёная точка — всё работает."],
  gd_ai_6: ["Ключ зберігається тільки на цьому пристрої. На телефоні чи в іншому браузері встав його ще раз.", "The key is stored on this device only. On your phone or another browser, paste it again.", "Klíč se ukládá jen na tomto zařízení. V telefonu nebo jiném prohlížeči ho vlož znovu.", "Ключ хранится только на этом устройстве. На телефоне или в другом браузере вставь его ещё раз."],
  gd_ai_foot: ["Безкоштовний рівень Gemini має денні ліміти, і Google може використовувати надіслане для покращення своїх продуктів — не надсилай нічого приватного.", "Gemini's free tier has daily limits, and Google may use what you send to improve its products, so don't send anything private.", "Bezplatná úroveň Gemini má denní limity a Google může odeslané používat ke zlepšování svých produktů, takže neposílej nic soukromého.", "У бесплатного уровня Gemini есть дневные лимиты, и Google может использовать отправленное для улучшения своих продуктов — не отправляй ничего личного."],
  gd_dr_btn: ["Як увімкнути", "How to turn it on", "Jak to zapnout", "Как включить"],
  gd_dr_h: ["Як увімкнути синхронізацію через Google Диск", "How to turn on Google Drive sync", "Jak zapnout synchronizaci přes Google Disk", "Как включить синхронизацию через Google Диск"],
  gd_dr_intro: ["Це робить **власник сайту** один раз (безкоштовно, ≈ 15 хвилин). Потім на кожному пристрої достатньо натиснути «Підключити Google Диск». Слова лежать у прихованій папці застосунку на Google Диску самої людини — інших файлів сайт не бачить.", "The **site owner** does this once (free, about 15 minutes). After that, each device just taps “Connect Google Drive”. Words live in a hidden app folder on the person's own Google Drive; the site can't see any other files.", "Tohle udělá **majitel webu** jednou (zdarma, asi 15 minut). Potom na každém zařízení stačí klepnout na „Připojit Google Disk“. Slova leží ve skryté složce aplikace na vlastním Google Disku daného člověka; jiné soubory web nevidí.", "Это делает **владелец сайта** один раз (бесплатно, ≈ 15 минут). Потом на каждом устройстве достаточно нажать «Подключить Google Диск». Слова лежат в скрытой папке приложения на Google Диске самого человека — других файлов сайт не видит."],
  gd_dr_1: ["Відкрий [Google Cloud Console](https://console.cloud.google.com/) і створи новий проєкт (наприклад, «Ay vocab»).", "Open the [Google Cloud Console](https://console.cloud.google.com/) and create a new project (for example “Ay vocab”).", "Otevři [Google Cloud Console](https://console.cloud.google.com/) a vytvoř nový projekt (třeba „Ay vocab“).", "Открой [Google Cloud Console](https://console.cloud.google.com/) и создай новый проект (например, «Ay vocab»)."],
  gd_dr_2: ["**APIs & Services → Library** → знайди **Google Drive API** → **Enable**.", "**APIs & Services → Library** → find **Google Drive API** → **Enable**.", "**APIs & Services → Library** → najdi **Google Drive API** → **Enable**.", "**APIs & Services → Library** → найди **Google Drive API** → **Enable**."],
  gd_dr_3: ["Відкрий **Google Auth Platform** → **Get started**: назва застосунку (Ay!vocab), твоя пошта, **Audience: External**, погодься з умовами → **Create**.", "Open **Google Auth Platform** → **Get started**: app name (Ay!vocab), your email, **Audience: External**, accept the terms → **Create**.", "Otevři **Google Auth Platform** → **Get started**: název aplikace (Ay!vocab), tvůj e-mail, **Audience: External**, odsouhlas podmínky → **Create**.", "Открой **Google Auth Platform** → **Get started**: название приложения (Ay!vocab), твоя почта, **Audience: External**, согласись с условиями → **Create**."],
  gd_dr_4: ["**Data access → Add or remove scopes** → додай `https://www.googleapis.com/auth/drive.appdata` → **Update** → **Save**. Це доступ лише до прихованої папки застосунку, тож перевірка від Google не потрібна.", "**Data access → Add or remove scopes** → add `https://www.googleapis.com/auth/drive.appdata` → **Update** → **Save**. It only reaches the hidden app folder, so no Google review is needed.", "**Data access → Add or remove scopes** → přidej `https://www.googleapis.com/auth/drive.appdata` → **Update** → **Save**. Je to přístup jen do skryté složky aplikace, takže kontrola od Googlu není potřeba.", "**Data access → Add or remove scopes** → добавь `https://www.googleapis.com/auth/drive.appdata` → **Update** → **Save**. Это доступ только к скрытой папке приложения, поэтому проверка от Google не нужна."],
  gd_dr_5: ["**Clients → Create client** → тип **Web application** → у **Authorized JavaScript origins** додай `{0}` (без шляху і без / у кінці) → **Create**.", "**Clients → Create client** → type **Web application** → under **Authorized JavaScript origins** add `{0}` (no path, no trailing /) → **Create**.", "**Clients → Create client** → typ **Web application** → do **Authorized JavaScript origins** přidej `{0}` (bez cesty a bez / na konci) → **Create**.", "**Clients → Create client** → тип **Web application** → в **Authorized JavaScript origins** добавь `{0}` (без пути и без / в конце) → **Create**."],
  gd_dr_6: ["Скопіюй **Client ID** — він закінчується на `.apps.googleusercontent.com`. Він не секретний.", "Copy the **Client ID**: it ends with `.apps.googleusercontent.com`. It isn't secret.", "Zkopíruj **Client ID**: končí na `.apps.googleusercontent.com`. Není tajný.", "Скопируй **Client ID** — он заканчивается на `.apps.googleusercontent.com`. Он не секретный."],
  gd_dr_7: ["**Audience → Publish app**, щоб увійти могли всі, а не лише тестові користувачі.", "**Audience → Publish app**, so everyone can sign in, not only test users.", "**Audience → Publish app**, aby se mohl přihlásit každý, nejen testovací uživatelé.", "**Audience → Publish app**, чтобы войти могли все, а не только тестовые пользователи."],
  gd_dr_8: ["У репозиторії сайту на GitHub відкрий `config.js` → ✏️ → впиши ID між лапками: `window.VOKAB_GOOGLE_CLIENT_ID = \"…apps.googleusercontent.com\";` → **Commit changes**.", "In the site's GitHub repository open `config.js` → ✏️ → put the ID between the quotes: `window.VOKAB_GOOGLE_CLIENT_ID = \"…apps.googleusercontent.com\";` → **Commit changes**.", "V repozitáři webu na GitHubu otevři `config.js` → ✏️ → vlož ID mezi uvozovky: `window.VOKAB_GOOGLE_CLIENT_ID = \"…apps.googleusercontent.com\";` → **Commit changes**.", "В репозитории сайта на GitHub открой `config.js` → ✏️ → впиши ID между кавычками: `window.VOKAB_GOOGLE_CLIENT_ID = \"…apps.googleusercontent.com\";` → **Commit changes**."],
  gd_dr_9: ["За хвилину-дві онови сайт (іноді двічі): у **Налаштування → Синхронізація** з'явиться **Підключити Google Диск**. Натисни на ноутбуці й на телефоні, вибери той самий Google-акаунт — далі слова підтягуватимуться самі.", "After a minute or two, reload the site (sometimes twice): **Settings → Sync** will show **Connect Google Drive**. Tap it on the laptop and on the phone with the same Google account, and words will follow you from then on.", "Za minutu dvě obnov web (někdy dvakrát): v **Nastavení → Synchronizace** se objeví **Připojit Google Disk**. Klepni na něj na notebooku i v telefonu se stejným účtem Google a slova se pak budou přenášet sama.", "Через минуту-две обнови сайт (иногда дважды): в **Настройки → Синхронизация** появится **Подключить Google Диск**. Нажми на ноутбуке и на телефоне, выбери тот же Google-аккаунт — дальше слова будут подтягиваться сами."],
  gd_dr_foot: ["Коли завантажуватимеш нову версію сайту, не перезаписуй свій `config.js` порожнім. Google тримає вхід приблизно годину, тому потім угорі з'являється «Синхронізувати» — одне торкання.", "When you upload a new version of the site, don't overwrite your `config.js` with an empty one. Google keeps the sign-in for about an hour, so after that a “Sync” button appears at the top: one tap.", "Až budeš nahrávat novou verzi webu, nepřepiš svůj `config.js` prázdným. Google drží přihlášení asi hodinu, pak se nahoře objeví „Synchronizovat“: stačí klepnout.", "Когда будешь загружать новую версию сайта, не перезаписывай свой `config.js` пустым. Google держит вход примерно час, поэтому потом вверху появляется «Синхронизировать» — одно касание."]
});

function buildPack(dk) {                                       // the pack in the import format, so "Add to my words" does the rest
  const topic = i => ({ uk: PACK_TOPICS[i][0], en: PACK_TOPICS[i][1], cs: PACK_TOPICS[i][2], ru: PACK_TOPICS[i][3] });
  if (dk === "cs") return { app: "vokab", dict: "cs", words: PACK_CS.map(([cz, g, plural, uk, ru, en, ti, x]) => ({ cz, g, plural, uk, ru, en, lv: "A1", topic: topic(ti), ...(x || {}) })) };
  if (dk === "en") return { app: "vokab", dict: "en", words: PACK_EN.map(([en, enTr, plural, uk, ru, cz, g, ti, x]) => ({ en, enTr, plural, uk, ru, cz, g, lv: "A1", topic: topic(ti), ...(x || {}) })) };
  return null;
}
const packSize = dk => dk === "cs" ? PACK_CS.length : dk === "en" ? PACK_EN.length : 0;

 ["Початок", [
  ["Що це за застосунок?", "Твій власний словник для вивчення чеської або англійської. У кожного слова можуть бути переклади, множина, колір роду, синоніми, пояснення, нотатка й приклади речень. Слова зібрані за темами, а вчити їх можна на картках."],
  ["Як пройти навчання ще раз?", "Натисни **Пройти навчання** вгорі цієї Довідки або Налаштування → Про застосунок → **Пройти навчання**. Книжка знову проведе тебе по всіх кнопках: показує кнопку, ти натискаєш і бачиш, що вона робить."],
  ["Сайт чи версія в Claude: у чому різниця?", "- **Сайт**: безкоштовний і працює в будь-якому браузері. Слова зберігаються на твоєму пристрої. Для синхронізації між пристроями підключи свій Google Диск. Для допомоги ШІ додай свій ключ: у Gemini є безкоштовний рівень, OpenAI платний.\n- **Версія в Claude**: відкривається всередині Claude. Синхронізація й ШІ вже вбудовані й працюють на твоєму акаунті Claude. Спершу хтось має поділитися нею з тобою.\n\nОбидві працюють однаково, і слова можна переносити між ними (див. «Синхронізація і резервна копія»)."],
  ["Як додати застосунок на головний екран?", "- **iPhone / iPad**: відкрий сайт у Safari, натисни «Поділитися» (квадрат зі стрілкою) → **На початковий екран** → **Додати**.\n- **Android**: відкрий сайт у Chrome, натисни ⋮ → **Додати на головний екран** або **Установити застосунок**.\n- **Комп'ютер**: у Chrome чи Edge натисни значок встановлення праворуч в адресному рядку (або ⋮ → **Установити**).\n\nНа iPhone так слова ще й надійніше збережені: Safari може стерти дані сайтів, які давно не відкривали, але не застосунків на головному екрані."],
  ["Як змінити мови?", "Налаштування → Мови. Інтерфейс може бути українською, англійською, чеською або російською — пояснення, нотатки й переклади прикладів підлаштовуються під нього. Для кожного словника обери головний переклад і, за бажанням, додатковий — він показується дрібніше."],
 ]],
 ["Слова", [
  ["Як додати слово?", "Натисни **+ Слово**, напиши слово й хоча б один переклад, обери тему й збережи. Кнопка ✨ допише решту сама."],
  ["Що заповнює кнопка ✨?", "З ШІ (версія в Claude або твій власний ключ ШІ на сайті) — усе: переклади, транскрипцію, множину, рід, синоніми, пояснення, нотатку, якщо вона корисна, приклади речень і тему. Слово можна написати будь-якою своєю мовою, навіть не в тому полі, — воно знайде правильне.\n\nБез ШІ сайт бере дані з безкоштовних онлайн-словників, тож буде лише переклад і вимова."],
  ["Як додати слова з фото?", "Натисни **Фото**, додай до 10 фото зошита чи підручника (або напиши список) і запусти. ШІ прочитає кожне фото, заповнить кожне слово й розкладе слова за темами. Слова, у яких він не впевнений, будуть першими — з позначеним місцем на фото: обери правильне слово, напиши своє або пропусти. Познач потрібні слова й натисни «Додати».\n\nНемає ключа ШІ на сайті? Скопіюй інструкцію, надішли її разом із фото в будь-який чат ШІ (ChatGPT, Gemini, Claude) і встав відповідь назад."],
  ["Що означають кольори й позначки?", "- Синій — чоловічий рід, червоний — жіночий, зелений — середній. Світліший відтінок — множина.\n- **мн.** / **pl.** форма множини · **≈** синоніми · **!** нотатка, яку варто знати\n- **[…]** як читати чеське слово (**:** — довгий звук) · **/…/** англійська вимова\n\nТоркнись слова, щоб побачити все про нього."],
  ["Як редагувати, переносити чи видаляти слова?", "Натисни ⋯ біля слова: редагувати, перенести в іншу тему, в архів або видалити. Щоб зробити це з багатьма словами одразу, натисни **Вибрати**, познач слова й обери дію.\n- **Архів** — для слів, які ти вже знаєш: їх немає в списку й практиці, але вони збережені.\n- **Кошик** тримає видалені слова, доки не видалиш їх назавжди, тож їх завжди можна повернути."],
  ["Теми, пошук і приховування", "Торкнись назви теми, щоб згорнути її, або чипів угорі, щоб перейти до теми. Пошук знаходить слова будь-якою мовою. **Сховати переклад** і **Сховати слово** перетворюють список на швидку самоперевірку."],
 ]],
 ["Практика", [
  ["Як працює практика?", "Натисни **Практика** (або «Практика» біля теми), обери, що вчити і як: слово → переклад, переклад → слово, мікс, пояснення → слово або додаткова мова. Торкнись картки, щоб перевернути. Тягни вправо (✓), якщо знаєш, вліво (✕) — щоб повторити. Пропущені слова повертаються, доки не вивчиш, а в кінці видно, над якими попрацювати.\n\nНа комп'ютері: пробіл — перевернути, → — знаю, ← — ще раз."],
 ]],
 ["Синхронізація і резервна копія", [
  ["Як працює синхронізація?", "**Версія в Claude**: увійди в Claude з тим самим акаунтом на телефоні й комп'ютері та відкрий те саме посилання. Кожна зміна зберігається одразу й з'являється на іншому пристрої.\n\n**Сайт**: Налаштування → Синхронізація → **Підключити Google Диск** і обери свій акаунт Google. Слова зберігаються в прихованій папці застосунку на твоєму власному Google Диску. На іншому пристрої підключи той самий акаунт. Google тримає сайт увійденим приблизно годину, тож потім угорі з'явиться **Синхронізувати** — один дотик, і все оновлено.\n\nЗміни з обох пристроїв об'єднуються слово за словом, тож нічого не губиться."],
  ["Мій словник приватний?", "Так. На сайті слова лишаються на твоєму пристрої — і на твоєму Google Диску, якщо підключиш. У версії в Claude у кожної людини свій словник, який ніхто інший не бачить, навіть той, хто поділився сторінкою."],
  ["Чи можу я втратити слова, якщо закрию застосунок або він оновиться?", "Ні. Кожна зміна зберігається одразу. Оновлення ніколи не видаляють слова, а перед оновленням сайт зберігає запасну копію. Для надійності час від часу роби резервну копію: Налаштування → Резервна копія → **Завантажити файл**."],
  ["Як перенести слова на інший пристрій або між сайтом і версією в Claude?", "На першому: Налаштування → **Скопіювати мої слова** (або Резервна копія → Завантажити файл). На іншому: Налаштування → Імпорт → встав текст або обери файл → **Додати до моїх слів**. Нічого не перезаписується: нові слова додаються, а відсутні деталі доповнюються."],
  ["Як працюють оновлення?", "Угорі сайту з'являється **Вийшла версія X** — натисни **Оновити**. Слова лишаються. Версія в Claude оновлюється сама. Номер версії — внизу застосунку й у Налаштуваннях."],
 ]],
 ["ШІ", [
  ["Мені потрібен ШІ?", "Ні. Усе працює й без нього. ШІ лише економить час: заповнює слова за тебе й читає фото."],
  ["Хто платить за ШІ?", "Кожен користується своїм. У версії в Claude — акаунт Claude того, хто нею користується. На сайті — твій власний ключ: у Gemini є безкоштовний рівень, OpenAI оплачується за використання. Чужі гроші чи ліміти не витрачаються."],
  ["Як отримати безкоштовний ключ Gemini?", "- Відкрий [Google AI Studio](https://aistudio.google.com/apikey) і увійди через Google.\n- Натисни **Create API key** і скопіюй ключ.\n- У застосунку: Налаштування → Помічник ШІ → **Gemini** → встав ключ → **Зберегти й перевірити**.\n\nНа безкоштовному рівні Google може використовувати надіслане для покращення своїх продуктів, тож не надсилай нічого приватного. Безкоштовне використання має денні ліміти: якщо досягнеш, спробуй пізніше."],
  ["Чи можна з ChatGPT / OpenAI?", "Так, з ключем API з [platform.openai.com](https://platform.openai.com/api-keys). API оплачується окремо від підписки ChatGPT, тож на цьому акаунті потрібні кошти. Потім Налаштування → Помічник ШІ → **OpenAI** → встав → **Зберегти й перевірити**."],
  ["Мій ключ у безпеці?", "Він зберігається лише на цьому пристрої й надсилається тільки в Google або OpenAI. Він ніколи не синхронізується й не потрапляє в резервні копії. Нікому його не давай; прибрати можна в Налаштуваннях будь-коли."],
  ["Немає ключа? Будь-який чат ШІ", "Налаштування → Нові слова через чат ШІ: скопіюй інструкцію й надішли в будь-який безкоштовний чат (ChatGPT, Gemini, Claude) разом із фото чи списком слів. Потім встав відповідь в Імпорт."],
 ]],
 ["Інше", [
  ["Звуки", "М'які звуки грають, коли відкриваєш застосунок, вікна й вкладки, додаєш слова й практикуєшся. Вимкнути: Налаштування → Оформлення → **Звуки**. На iPhone їх також вимикає перемикач беззвучного режиму."],
  ["Темна тема", "Налаштування → Оформлення: як на пристрої, світла або темна."],
  ["Чи працює без інтернету?", "Так. Після першого відкриття сайт працює без інтернету. Синхронізації й ШІ потрібен інтернет; зміни надішлються, коли зв'язок повернеться."],
  ["Щось не працює", "Спершу перезавантаж сторінку або застосунок. Якщо слова ніби зникли, перевір вкладки «Архів» і «Кошик». На сайті перевір Налаштування → Синхронізація. І тримай файл резервної копії — тоді нічого не загубиться."],
  ["Хто це зробив?", "aykus. Зроблено з ♥."],
 ]],
],
cs: [
 ["Začínáme", [
  ["Co je to za aplikaci?", "Tvůj vlastní slovník pro učení češtiny nebo angličtiny. Každé slovo může mít překlady, množné číslo, barvu podle rodu, synonyma, vysvětlení, poznámku a příklady vět. Slova jsou rozdělená do témat a procvičuješ je na kartičkách."],
  ["Jak projít úvod znovu?", "Nahoře v této Nápovědě klepni na **Projít úvod**, nebo Nastavení → O aplikaci → **Projít úvod**. Knížka tě znovu provede všemi tlačítky: ukáže na tlačítko, ty na něj klepneš a uvidíš, co dělá."],
  ["Web, nebo verze v Claude: jaký je rozdíl?", "- **Web**: zdarma a funguje v každém prohlížeči. Slova se ukládají v tvém zařízení. Pro synchronizaci mezi zařízeními připoj svůj Google Disk. Pro pomoc AI přidej vlastní klíč: Gemini má bezplatnou úroveň, OpenAI je placené.\n- **Verze v Claude**: otevírá se uvnitř Claude. Synchronizace i AI jsou vestavěné a běží na tvém účtu Claude. Nejdřív ti ji musí někdo nasdílet.\n\nObě fungují stejně a slova mezi nimi můžeš přenášet (viz „Synchronizace a záloha“)."],
  ["Jak dát aplikaci na plochu?", "- **iPhone / iPad**: otevři web v Safari, klepni na Sdílet (čtverec se šipkou) → **Přidat na plochu** → **Přidat**.\n- **Android**: otevři web v Chromu, klepni na ⋮ → **Přidat na plochu** nebo **Nainstalovat aplikaci**.\n- **Počítač**: v Chromu nebo Edge klikni na ikonu instalace vpravo v adresním řádku (nebo ⋮ → **Nainstalovat**).\n\nNa iPhonu jsou tak slova i lépe chráněná: Safari může smazat data webů, které jsi dlouho neotevřel, ale ne aplikací na ploše."],
  ["Jak změnit jazyky?", "Nastavení → Jazyky. Rozhraní může být ukrajinsky, anglicky, česky nebo rusky a vysvětlení, poznámky i překlady příkladů se mu přizpůsobí. Pro každý slovník si vyber hlavní překlad a případně doplňkový, zobrazený menším písmem."],
 ]],
 ["Slova", [
  ["Jak přidat slovo?", "Klepni na **+ Slovo**, napiš slovo a aspoň jeden překlad, vyber téma a ulož. Tlačítko ✨ doplní zbytek za tebe."],
  ["Co doplní tlačítko ✨?", "S AI (verze v Claude nebo vlastní klíč AI na webu) úplně vše: překlady, výslovnost, množné číslo, rod, synonyma, vysvětlení, poznámku, když se hodí, příklady vět i téma. Slovo můžeš napsat v kterémkoli svém jazyce, i do špatného pole, a najde správné slovo.\n\nBez AI web používá bezplatné online slovníky, takže doplní jen překlady a výslovnost."],
  ["Jak přidat slova z fotky?", "Klepni na **Fotka**, přidej až 10 fotek sešitu nebo učebnice (nebo napiš seznam) a spusť. AI přečte každou fotku, doplní každé slovo a rozdělí slova do témat. Slova, kterými si není jistá, jsou první, s označeným místem na fotce: vyber správné slovo, napiš vlastní, nebo ho přeskoč. Zaškrtni slova, která chceš, a klepni na Přidat.\n\nNemáš na webu klíč AI? Zkopíruj návod, pošli ho s fotkou do libovolného chatu s AI (ChatGPT, Gemini, Claude) a odpověď vlož zpět."],
  ["Co znamenají barvy a značky?", "- Modrá: mužský rod, červená: ženský, zelená: střední. Světlejší odstín označuje množné číslo.\n- **pl.** tvar množného čísla · **≈** synonyma · **!** poznámka, kterou se vyplatí znát\n- **[…]** jak číst české slovo (**:** je dlouhá hláska) · **/…/** anglická výslovnost\n\nKlepni na slovo a uvidíš o něm všechno."],
  ["Jak slova upravit, přesunout nebo smazat?", "Klepni na ⋯ u slova: upravit, přesunout do jiného tématu, do archivu nebo smazat. Pro víc slov najednou klepni na **Vybrat**, zaškrtni slova a vyber akci.\n- **Archiv** je pro slova, která už umíš: zmizí ze seznamu i procvičování, ale zůstanou uložená.\n- **Koš** drží smazaná slova, dokud je nesmažeš navždy, takže je můžeš vždy obnovit."],
  ["Témata, hledání a skrývání", "Klepnutím na název tématu ho sbalíš, štítky nahoře tě k tématu přenesou. Hledání najde slova v jakémkoli jazyce. **Skrýt překlad** a **Skrýt slovo** udělají ze seznamu rychlý test."],
 ]],
 ["Procvičování", [
  ["Jak funguje procvičování?", "Klepni na **Procvičování** (nebo Procvičování u tématu), vyber, co a jak procvičovat: slovo → překlad, překlad → slovo, mix, vysvětlení → slovo nebo doplňkový jazyk. Klepnutím kartu otočíš. Táhni doprava (✓), když to umíš, doleva (✕), když to chceš znovu. Nezvládnutá slova se vracejí, dokud je neumíš, a na konci uvidíš, na čem zapracovat.\n\nNa počítači: mezerník otočí kartu, → umím, ← znovu."],
 ]],
 ["Synchronizace a záloha", [
  ["Jak funguje synchronizace?", "**Verze v Claude**: přihlas se do Claude stejným účtem na telefonu i počítači a otevři stejný odkaz. Každá změna se hned uloží a objeví se na druhém zařízení.\n\n**Web**: Nastavení → Synchronizace → **Připojit Google Disk** a vyber svůj účet Google. Slova se ukládají do skryté složky aplikace na tvém vlastním Google Disku. Na druhém zařízení připoj stejný účet. Google nechá web přihlášený asi hodinu, potom se nahoře objeví **Synchronizovat**: jedno klepnutí a máš vše aktuální.\n\nZměny z obou zařízení se spojují slovo po slově, takže se nic neztratí."],
  ["Je můj slovník soukromý?", "Ano. Na webu zůstávají slova v tvém zařízení, a pokud ho připojíš, i na tvém Google Disku. Ve verzi v Claude má každý vlastní slovník, který nikdo jiný nevidí, ani ten, kdo stránku nasdílel."],
  ["Můžu přijít o slova, když aplikaci zavřu nebo se aktualizuje?", "Ne. Každá změna se ukládá okamžitě. Aktualizace slova nikdy nemažou a web si před aktualizací uloží záložní kopii. Pro jistotu si občas udělej zálohu: Nastavení → Záloha → **Stáhnout soubor**."],
  ["Jak přenést slova na jiné zařízení nebo mezi webem a verzí v Claude?", "Na prvním: Nastavení → **Zkopírovat moje slova** (nebo Záloha → Stáhnout soubor). Na druhém: Nastavení → Import → vlož text nebo vyber soubor → **Přidat k mým slovům**. Nic se nepřepíše: nová slova se přidají a chybějící údaje doplní."],
  ["Jak fungují aktualizace?", "Nahoře na webu se objeví **Vyšla verze X**: klepni na **Aktualizovat**. Slova zůstanou. Verze v Claude se aktualizuje sama. Číslo verze je dole v aplikaci a v Nastavení."],
 ]],
 ["AI", [
  ["Potřebuju AI?", "Ne. Všechno funguje i bez ní. AI jen šetří čas: doplňuje slova za tebe a čte fotky."],
  ["Kdo platí za AI?", "Každý používá svou. Ve verzi v Claude běží na účtu Claude toho, kdo ji používá. Na webu používá tvůj vlastní klíč: Gemini má bezplatnou úroveň, OpenAI se platí podle použití. Nikoho jiného peníze ani limity se nepoužívají."],
  ["Jak získat bezplatný klíč Gemini?", "- Otevři [Google AI Studio](https://aistudio.google.com/apikey) a přihlas se přes Google.\n- Klepni na **Create API key** a klíč zkopíruj.\n- V aplikaci: Nastavení → Pomocník AI → **Gemini** → vlož klíč → **Uložit a ověřit**.\n\nV bezplatné úrovni může Google odeslané použít ke zlepšení svých produktů, takže neposílej nic soukromého. Bezplatné použití má denní limity; když ho dosáhneš, zkus to později."],

ru: [
 ["Начало", [
  ["Что это за приложение?", "Твой собственный словарь для изучения чешского или английского. У каждого слова могут быть переводы, множественное число, цвет рода, синонимы, объяснение, заметка и примеры предложений. Слова разложены по темам, а учить их можно на карточках."],
  ["Как пройти обучение ещё раз?", "Нажми **Пройти обучение** вверху этой Справки или Настройки → О приложении → **Пройти обучение**. Книжка снова проведёт тебя по всем кнопкам: показывает кнопку, ты нажимаешь и видишь, что она делает."],
  ["Сайт или версия в Claude: в чём разница?", "- **Сайт**: бесплатный и работает в любом браузере. Слова хранятся на твоём устройстве. Для синхронизации между устройствами подключи свой Google Диск. Для помощи ИИ добавь свой ключ: у Gemini есть бесплатный уровень, OpenAI платный.\n- **Версия в Claude**: открывается внутри Claude. Синхронизация и ИИ уже встроены и работают на твоём аккаунте Claude. Сначала кто-то должен поделиться ею с тобой.\n\nОбе работают одинаково, и слова можно переносить между ними (см. «Синхронизация и резервная копия»)."],
  ["Как добавить приложение на главный экран?", "- **iPhone / iPad**: открой сайт в Safari, нажми «Поделиться» (квадрат со стрелкой) → **На экран «Домой»** → **Добавить**.\n- **Android**: открой сайт в Chrome, нажми ⋮ → **Добавить на главный экран** или **Установить приложение**.\n- **Компьютер**: в Chrome или Edge нажми значок установки справа в адресной строке (или ⋮ → **Установить**).\n\nНа iPhone так слова ещё и надёжнее сохранены: Safari может стереть данные сайтов, которые давно не открывали, но не приложений на главном экране."],
  ["Как поменять языки?", "Настройки → Языки. Интерфейс может быть на украинском, английском, чешском или русском — объяснения, заметки и переводы примеров подстраиваются под него. Для каждого словаря выбери основной перевод и, если хочешь, дополнительный — он показывается мельче."],

 ["Слова", [
  ["Как добавить слово?", "Нажми **+ Слово**, напиши слово и хотя бы один перевод, выбери тему и сохрани. Кнопка ✨ допишет остальное сама."],
  ["Что заполняет кнопка ✨?", "С ИИ (версия в Claude или твой собственный ключ ИИ на сайте) — всё: переводы, транскрипцию, множественное число, род, синонимы, объяснение, заметку, если она полезна, примеры предложений и тему. Слово можно написать на любом своём языке, даже не в том поле, — оно найдёт правильное.\n\nБез ИИ сайт берёт данные из бесплатных онлайн-словарей, поэтому будут только переводы и произношение."],
  ["Как добавить слова с фото?", "Нажми **Фото**, добавь до 10 фото тетради или учебника (или напиши список) и запусти. ИИ прочитает каждое фото, заполнит каждое слово и разложит слова по темам. Слова, в которых он не уверен, будут первыми — с отмеченным местом на фото: выбери правильное слово, напиши своё или пропусти. Отметь нужные слова и нажми «Добавить».\n\nНет ключа ИИ на сайте? Скопируй инструкцию, отправь её вместе с фото в любой чат с ИИ (ChatGPT, Gemini, Claude) и вставь ответ обратно."],
  ["Что значат цвета и значки?", "- Синий — мужской род, красный — женский, зелёный — средний. Более светлый оттенок — множественное число.\n- **pl.** форма множественного числа · **≈** синонимы · **!** заметка, которую стоит знать\n- **[…]** как читать чешское слово (**:** — долгий звук) · **/…/** английское произношение\n\nНажми на слово, чтобы увидеть всё о нём."],
  ["Как редактировать, переносить или удалять слова?", "Нажми ⋯ рядом со словом: редактировать, перенести в другую тему, в архив или удалить. Чтобы сделать это с многими словами сразу, нажми **Выбрать**, отметь слова и выбери действие.\n- **Архив** — для слов, которые ты уже знаешь: их нет в списке и практике, но они сохранены.\n- **Корзина** хранит удалённые слова, пока не удалишь их навсегда, так что их всегда можно вернуть."],
  ["Темы, поиск и скрытие", "Нажми на название темы, чтобы свернуть её, или на чипы вверху, чтобы перейти к теме. Поиск находит слова на любом языке. **Скрыть перевод** и **Скрыть слово** превращают список в быструю самопроверку."],
 ]],
 ["Практика", [
  ["Как работает практика?", "Нажми **Практика** (или «Практика» рядом с темой), выбери, что учить и как: слово → перевод, перевод → слово, микс, объяснение → слово или дополнительный язык. Нажми на карточку, чтобы перевернуть. Тяни вправо (✓), если знаешь, влево (✕) — чтобы повторить. Пропущенные слова возвращаются, пока не выучишь, а в конце видно, над какими поработать.\n\nНа компьютере: пробел — перевернуть, → — знаю, ← — ещё раз."],

  ["Мой словарь приватный?", "Да. На сайте слова остаются на твоём устройстве — и на твоём Google Диске, если подключишь. В версии в Claude у каждого человека свой словарь, который никто другой не видит, даже тот, кто поделился страницей."],
  ["Могу ли я потерять слова, если закрою приложение или оно обновится?", "Нет. Каждое изменение сохраняется сразу. Обновления никогда не удаляют слова, а перед обновлением сайт сохраняет запасную копию. Для надёжности иногда делай резервную копию: Настройки → Резервная копия → **Скачать файл**."],
  ["Как перенести слова на другое устройство или между сайтом и версией в Claude?", "На первом: Настройки → **Скопировать мои слова** (или Резервная копия → Скачать файл). На другом: Настройки → Импорт → вставь текст или выбери файл → **Добавить к моим словам**. Ничего не перезаписывается: новые слова добавляются, а недостающие детали дополняются."],
  ["Как работают обновления?", "Вверху сайта появляется **Вышла версия X** — нажми **Обновить**. Слова остаются. Версия в Claude обновляется сама. Номер версии — внизу приложения и в Настройках."],
 ]],

  ["Можно ли с ChatGPT / OpenAI?", "Да, с ключом API с [platform.openai.com](https://platform.openai.com/api-keys). API оплачивается отдельно от подписки ChatGPT, поэтому на этом аккаунте нужны средства. Потом Настройки → Помощник ИИ → **OpenAI** → вставь → **Сохранить и проверить**."],
  ["Мой ключ в безопасности?", "Он хранится только на этом устройстве и отправляется только в Google или OpenAI. Он никогда не синхронизируется и не попадает в резервные копии. Никому его не давай; убрать можно в Настройках в любой момент."],
  ["Нет ключа? Любой чат с ИИ", "Настройки → Новые слова через чат с ИИ: скопируй инструкцию и отправь в любой бесплатный чат (ChatGPT, Gemini, Claude) вместе с фото или списком слов. Потом вставь ответ в Импорт."],

  add("en", 1, "What do the colours", ["What does A1–C2 next to a word mean?", "It's the **word level** on the CEFR scale, that is, how advanced the word is:\n- **A1, A2**: basic words, where everyone starts;\n- **B1, B2**: a confident level, words for conversations and texts;\n- **C1, C2**: strong, rarer words that very good speakers use.\n\nThe ✨ button sets the level when it fills in a word, and you can pick one yourself when you edit a word. For older words without a level: Settings → Word levels → **✨ Find the levels** (needs AI)."]);

  add("ru", 1, "Что значат цвета", ["Что значит A1–C2 рядом со словом?", "Это **уровень слова** по шкале CEFR — насколько оно продвинутое:\n- **A1, A2** — базовые слова, с них всё начинается;\n- **B1, B2** — уверенный уровень, слова для разговоров и текстов;\n- **C1, C2** — сильные, редкие слова, которыми говорят очень хорошо.\n\nКнопка ✨ ставит уровень сама, когда заполняет слово, а выбрать его можно и самому, когда редактируешь слово. Для старых слов без уровня: Настройки → Уровни слов → **✨ Определить уровни** (нужен ИИ)."]);

  add("uk", 5, "Звуки", ["Як змінити колір неону?", "Налаштування → Оформлення → **Неонове світло**. Є готові кольори (сапфір, темно-синій, рубін, смарагд та інші) і **«Свій»**: обери 2 або 3 кольори — з них вийде твій градієнт. Неон світить за мишкою в словнику (на телефоні — там, де торкаєшся), сяє за кожним вікном і спалахує, коли натискаєш кнопки. Не подобається — **«Вимкнути»**."]);
  add("en", 5, "Sounds", ["How do I change the neon colour?", "Settings → Appearance → **Neon light**. There are ready colours (sapphire, deep blue, ruby, emerald and more) and **Custom**: pick 2 or 3 colours and they make your own gradient. The neon follows your mouse in the dictionary (on a phone it lights up where you touch), glows behind every window and flashes when you press buttons. Don't like it? Choose **Off**."]);
  add("cs", 5, "Zvuky", ["Jak změnit barvu neonu?", "Nastavení → Vzhled → **Neonové světlo**. Jsou tu hotové barvy (safír, tmavě modrá, rubín, smaragd a další) a **Vlastní**: vyber 2 nebo 3 barvy a vznikne tvůj přechod. Neon jde ve slovníku za myší (na telefonu se rozsvítí tam, kam klepneš), září za každým oknem a blikne, když mačkáš tlačítka. Nelíbí se ti? Zvol **Vypnout**."]);
  add("ru", 5, "Звуки", ["Как поменять цвет неона?", "Настройки → Оформление → **Неоновый свет**. Есть готовые цвета (сапфир, тёмно-синий, рубин, изумруд и другие) и **«Свой»**: выбери 2 или 3 цвета — из них получится твой градиент. Неон светит за мышкой в словаре (на телефоне — там, где касаешься), сияет за каждым окном и вспыхивает, когда нажимаешь кнопки. Не нравится — **«Выключить»**."]);

  set("uk", 5, "Звуки", "Тихі скляні звуки грають, коли входиш у словник і виходиш, відкриваєш і закриваєш вікна, додаєш слова й практикуєшся. Вимкнути: Налаштування → Оформлення → **Звуки**. На iPhone їх вимикає й перемикач беззвучного режиму.");
  set("en", 5, "Sounds", "Quiet glass sounds play when you enter and leave a dictionary, open and close windows, add words and practise. Turn them off in Settings → Appearance → **Sounds**. On iPhone the silent switch mutes them too.");
  set("cs", 5, "Zvuky", "Tiché skleněné zvuky hrají, když vstupuješ do slovníku a odcházíš, otevíráš a zavíráš okna, přidáváš slova a procvičuješ. Vypnout: Nastavení → Vzhled → **Zvuky**. Na iPhonu je ztlumí i přepínač tichého režimu.");
  set("ru", 5, "Звуки", "Тихие стеклянные звуки играют, когда входишь в словарь и выходишь, открываешь и закрываешь окна, добавляешь слова и практикуешься. Выключить: Настройки → Оформление → **Звуки**. На iPhone их выключает и переключатель беззвучного режима.");

  set("uk", 5, "Хто це зробив?", "**aykus**. Зроблено з ♥. Є питання чи ідеї? Напиши мені — контакти в самому низу цієї Довідки.");
  set("en", 5, "Who made this?", "**aykus**. Made with ♥. Questions or ideas? Write to me: the contacts are at the very bottom of this Help.");
  set("cs", 5, "Kdo to udělal?", "**aykus**. Vytvořeno s ♥. Máš otázku nebo nápad? Napiš mi, kontakty jsou úplně dole v této Nápovědě.");

    uk: {

      cols: ["Як змінити кількість слів у ряду?", "На комп'ютері над списком є кнопки **1 · 2 · 3**: одне слово в ряду (як на телефоні), два або три — компактніше. Натисни вибрану ще раз, щоб повернути «авто». Те саме є в Налаштуваннях → **Слів у ряду**. На телефоні слова завжди йдуть по одному."],
      lv2: ["Що за рівень біля перекладу?", "Біля англійського перекладу в чеському словнику (і біля чеського — в англійському) показано **рівень самого перекладу**: так видно, наскільки складне це англійське слово. Такі рівні не входять у «Прогрес» — там рахуються лише слова, які ти вчиш. Ставить їх ✨ разом із рівнем слова, а для старих слів — Налаштування → Рівні слів → **✨ Визначити рівні**."],
      prac: ["Як працює практика?", "Натисни **Практика** (або «Практика» біля теми) і вибери:\n- **що** — усі слова, теми (торкнись потрібних) або вибрані;\n- **як** — переклад → слово, слово → переклад, мікс, другий переклад або пояснення → слово;\n- **скільки карток** — 10, 20, 50 або всі.\n\nТоркнись картки чи **Показати**, щоб перевернути. Тягни вправо (✓), якщо знаєш, вліво (↺) — щоб повторити: пропущені слова повертаються, поки не вгадаєш. У кінці видно результат, слова для повторення й кнопку **У вивчені** для слів, які ти знав з першого разу.\n\nНа комп'ютері: пробіл — перевернути, → — знаю, ← — ще раз."],

      sync: ["Як працює синхронізація?", "**Версія в Claude**: увійди в Claude тим самим акаунтом на телефоні й комп'ютері та відкрий те саме посилання. Кожна зміна зберігається одразу й з'являється на іншому пристрої.\n\n**Сайт**: Налаштування → Синхронізація → **Підключити Google Диск** і вибери свій акаунт Google. Слова зберігаються в прихованій папці застосунку на твоєму власному Google Диску. На іншому пристрої підключи той самий акаунт. Google тримає вхід приблизно годину, тому потім угорі з'явиться **Синхронізувати** — одне торкання, і все оновлено.\n\nЯкщо кнопки підключення немає, власник сайту ще не додав Client ID: там само є **Як увімкнути** з покроковою інструкцією.\n\nЗміни з обох пристроїв об'єднуються слово за словом, тож нічого не губиться."],

    en: {

      cols: ["How do I change how many words fit in a row?", "On a computer there are **1 · 2 · 3** buttons above the list: one word per row (like on a phone), two, or three for a compact list. Tap the chosen one again to go back to auto. The same is in Settings → **Words per row**. On a phone it's always one word per row."],
      lv2: ["What's the level next to a translation?", "Next to the English translation in the Czech dictionary (and the Czech one in the English dictionary) you see **the level of that translation**, so you know how advanced the English word itself is. These levels don't count in Progress: only the words you study do. ✨ fills them in together with the word's level; for older words use Settings → Word levels → **✨ Find the levels**."],
      prac: ["How does practice work?", "Tap **Practice** (or “Practice” next to a topic) and choose:\n- **what**: all words, topics (tap the ones you want) or your selection;\n- **how**: translation → word, word → translation, mix, second translation or explanation → word;\n- **how many cards**: 10, 20, 50 or all.\n\nTap the card or **Show** to flip it. Swipe right (✓) if you know it, left (↺) to see it again: missed words come back until you get them. At the end you see your result, the words to review and a **Mark learned** button for the words you knew on the first try.\n\nOn a computer: Space flips, → I know, ← again."],

    cs: {
      edit: ["Jak slova upravit, přesunout nebo smazat?", "Klepni na ⋯ u slova: upravit, přesunout do jiného tématu, označit jako naučené nebo smazat. Chceš-li to udělat s více slovy najednou, klepni na **Vybrat**, označ slova a vyber akci.\n- Kulaté tlačítko **✓** u slova ho hned přesune mezi **Naučená**. Tam ho **↩** vrátí mezi slova k učení a ⋯ → **Smazat** ho odstraní úplně.\n- Koš už není: smazané zmizí hned, ale dole se na pár sekund objeví lišta **Vrátit zpět**."],

      cols: ["Jak změnit počet slov v řadě?", "Na počítači jsou nad seznamem tlačítka **1 · 2 · 3**: jedno slovo v řadě (jako na telefonu), dvě, nebo tři pro kompaktní seznam. Opětovným klepnutím na vybrané se vrátíš k režimu auto. Totéž je v Nastavení → **Slov v řadě**. Na telefonu je vždy jedno slovo v řadě."],
      lv2: ["Co je to za úroveň u překladu?", "U anglického překladu v českém slovníku (a u českého v anglickém) vidíš **úroveň samotného překladu**, takže víš, jak pokročilé je to anglické slovo. Tyto úrovně se do Pokroku nepočítají: tam jsou jen slova, která se učíš. ✨ je doplní spolu s úrovní slova, u starších slov použij Nastavení → Úrovně slov → **✨ Určit úrovně**."],
      prac: ["Jak funguje procvičování?", "Klepni na **Procvičování** (nebo „Procvičování“ u tématu) a vyber:\n- **co**: všechna slova, témata (klepni na ta, která chceš) nebo vybraná;\n- **jak**: překlad → slovo, slovo → překlad, mix, druhý překlad nebo vysvětlení → slovo;\n- **kolik karet**: 10, 20, 50 nebo všechny.\n\nKlepnutím na kartu nebo **Ukázat** ji otočíš. Táhni doprava (✓), když víš, doleva (↺), když chceš znovu: vynechaná slova se vracejí, dokud je neuhodneš. Na konci uvidíš výsledek, slova k zopakování a tlačítko **Mezi naučená** pro slova, která jsi věděl napoprvé.\n\nNa počítači: mezerník otočí, → umím, ← znovu."],
      prog: ["Co ukazuje Pokrok?", "Karta **Pokrok** vedle Naučených ukazuje:\n- kolik slov umíš, kolik jich je ve slovníku a kolik se jich ještě učíš;\n- graf slov, která jsi **přidával** a **naučil se** v čase, a čárkovaně odhad, pokud vydržíš ve stejném tempu (vyber období a délku odhadu);\n- **úrovně** a **témata**: kolik slov má každé a kolik z nich už umíš.\n\nPočítají se jen slova, která se učíš, bez úrovní překladů. U každého grafu je **Tabulka** se stejnými čísly. Slova přidaná před verzí 0.10 jsou na začátku grafu, protože se tehdy data neukládala."],
      sync: ["Jak funguje synchronizace?", "**Verze v Claude**: přihlas se do Claude stejným účtem v telefonu i v počítači a otevři stejný odkaz. Každá změna se uloží hned a objeví se i na druhém zařízení.\n\n**Web**: Nastavení → Synchronizace → **Připojit Google Disk** a vyber svůj účet Google. Slova se ukládají do skryté složky aplikace na tvém vlastním Google Disku. Na dalším zařízení připoj stejný účet. Google drží web přihlášený asi hodinu, pak se nahoře objeví **Synchronizovat**: jedno klepnutí a vše je aktuální.\n\nPokud tlačítko pro připojení chybí, majitel webu ještě nedoplnil Client ID: ve stejné části je **Jak to zapnout** s návodem krok za krokem.\n\nZměny z obou zařízení se slučují slovo po slovu, takže se nic neztratí."],

    ru: {

      lv2: ["Что за уровень рядом с переводом?", "Рядом с английским переводом в чешском словаре (и с чешским — в английском) показан **уровень самого перевода**: так видно, насколько сложное это английское слово. Такие уровни не входят в «Прогресс» — там считаются только слова, которые ты учишь. Ставит их ✨ вместе с уровнем слова, а для старых слов — Настройки → Уровни слов → **✨ Определить уровни**."],
      prac: ["Как работает практика?", "Нажми **Практика** (или «Практика» рядом с темой) и выбери:\n- **что** — все слова, темы (нажми нужные) или выбранные;\n- **как** — перевод → слово, слово → перевод, микс, второй перевод или объяснение → слово;\n- **сколько карточек** — 10, 20, 50 или все.\n\nНажми на карточку или **Показать**, чтобы перевернуть. Тяни вправо (✓), если знаешь, влево (↺) — чтобы повторить: пропущенные слова возвращаются, пока не угадаешь. В конце видно результат, слова для повторения и кнопку **В выученные** для слов, которые ты знал с первого раза.\n\nНа компьютере: пробел — перевернуть, → — знаю, ← — ещё раз."],

- "w": the word or phrase
- "hint": a translation written next to it in the photo, or ""
- "unsure": true if the handwriting is hard to read or the word looks misspelled, otherwise false
- "alts": when "unsure" is true, up to 3 other words it could be (most likely first); otherwise []

}

function neonZone(root) {

const BATCH_MAX = 150;
function parseBatch(text) {

    const l = raw.replace(/^\s*(?:\d+[.)]|[-•*–—])\s+/, "").trim(); if (!l) continue;
    const m = l.match(/^(.*?)\s+[—–-]\s+(.+)$/) || l.match(/^(.*?)\t+(.+)$/) || l.match(/^(.*?)\s*[:=]\s+(.+)$/);
    if (m && m[1].trim()) { out.push({ w: m[1].trim(), hint: m[2].trim() }); continue; }
    for (const part of l.split(/\s*[,;]\s*/)) { const w = part.trim(); if (w) out.push({ w, hint: "" }); }
  }

async function freeEntry(dk, it) {                             // website without AI: one word from free online dictionaries
  const T = DICTS[dk].T, other = T === "cs" ? "en" : "cs", tr = (x, a, b) => translate(x, a, b).catch(() => "");
  const w = { cz: "", en: "", uk: "", ru: "" };
  let target = it.w;
  if (cyr(it.w)) {                                             // typed in Ukrainian or Russian: find the word being learned
    const src = cyrLang(it.w); w[src] = it.w;
    target = await tr(it.w, src, T);
    if (!target) return null;
  }
  w[LF[T]] = target;
  if (it.hint) w[cyr(it.hint) ? cyrLang(it.hint) : LF[other]] = it.hint;
  const need = [other, "uk", "ru"].filter(l => !w[LF[l]]);
  const got = await Promise.all(need.map(l => tr(target, T, l)));
  need.forEach((l, i) => { w[LF[l]] = l === "uk" || l === "ru" ? uaShort(got[i]) : got[i]; });

  if (T === "en" && info?.example) entry.ex = [{ t: info.example }];

async function freeEnrich(dk, items, signal, onProgress) {
  const out = new Array(items.length).fill(null);

  const worker = async () => {
    while (next < items.length) {

      const k = next++;
      try { out[k] = await freeEntry(dk, items[k]); } catch (_) { out[k] = null; }
      done++; if (onProgress) onProgress(done, items.length);
