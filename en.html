<div class="tb-text" id="tb-text" aria-hidden="true"></div><span class="sr" id="tb-sr" aria-live="polite"></span>
<div class="tb-extra" id="tb-extra" hidden></div>
<div class="tb-do" id="tb-do" hidden><span class="tb-finger" aria-hidden="true">👆</span><span id="tb-do-t"></span></div>
<div class="tb-foot"><span class="tb-bar"><i id="tb-bar"></i></span><button class="tb-skip" type="button" id="tb-skip" hidden></button><button class="tb-next" type="button" id="tb-next"></button></div>
</div></div>`;
  L.addEventListener("click", e => {
    const el = e.target.closest("button, .tour-blk, .tour-cover, .tb-text"); if (!el) return;
    if (el.matches(".tour-blk, .tour-cover")) return tourNudge();
    if (el.id === "tb-next") return tourNext();
    if (el.id === "tb-skip") return tourSkip();
    if (el.id === "tb-x") return tourEnd(false);
    if (el.matches(".tb-text")) tourStopType();
  });
  return L;
}
function tourLayout(first) {
  const s = TOUR.step, L = TOUR.layer; if (!s || !L) return;
  const V = tourVp(), W0 = innerWidth, H0 = innerHeight;
  const coach = L.querySelector(".tour-coach"), hole = L.querySelector(".tour-hole"), bk = TOUR.bk;
  let R = tourRect(tourEls(s));
  if (R) { const p = s.pad ?? 6; R = { left: R.left - p, top: R.top - p, right: R.right + p, bottom: R.bottom + p }; R.width = R.right - R.left; R.height = R.bottom - R.top; }
  if (R) Object.assign(hole.style, { left: R.left + "px", top: R.top + "px", width: R.width + "px", height: R.height + "px", borderRadius: Math.min(18, R.height / 2) + "px" });
  else Object.assign(hole.style, { left: W0 / 2 + "px", top: H0 / 2 + "px", width: "0px", height: "0px" });
  hole.classList.toggle("none", !R); hole.classList.toggle("do", !!R && !!s.do);
  const [b0, b1, b2, b3] = L.querySelectorAll(".tour-blk"), cover = L.querySelector(".tour-cover");
  const box = (el, x, y, w, h) => Object.assign(el.style, { left: x + "px", top: y + "px", width: Math.max(0, w) + "px", height: Math.max(0, h) + "px" });
  if (R) { box(b0, 0, 0, W0, R.top); box(b1, 0, R.bottom, W0, H0 - R.bottom + 400); box(b2, 0, R.top, R.left, R.height); box(b3, R.right, R.top, W0 - R.right, R.height); }
  else { box(b0, 0, 0, W0, H0 + 400); box(b1, 0, 0, 0, 0); box(b2, 0, 0, 0, 0); box(b3, 0, 0, 0, 0); }
  const usable = !!R && !!(s.do || s.open);
  cover.hidden = !R || usable; if (!cover.hidden) box(cover, R.left, R.top, R.width, R.height);
  // typing on a phone: the keyboard takes half the screen, so Booky shrinks to a small "Next" in the corner
  const a = document.activeElement;
  const mini = !!(s.open && a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && L.parentNode.contains(a) && V.h < H0 * .75);
  coach.classList.toggle("mini", mini);
  const W = coach.offsetWidth, H = coach.offsetHeight, M = 10, G = 12;
  const clampX = v => Math.max(M, Math.min(W0 - W - M, v));
  let x, y;
  if (mini) { x = W0 - W - M; y = V.y + M; }
  else if (!R) { x = (W0 - W) / 2; y = V.y + Math.max(M, (V.h - H) / 2 - (s.final ? 0 : 20)); }
  else {
    const below = V.y + V.h - R.bottom - G - M, above = R.top - V.y - G - M, cx = R.left + R.width / 2;
    const midY = () => Math.max(V.y + M, Math.min(V.y + V.h - H - M, R.top + R.height / 2 - H / 2));
    if (below >= H) { y = R.bottom + G; x = clampX(cx - W / 2); }
    else if (above >= H) { y = R.top - G - H; x = clampX(cx - W / 2); }
    else if (W0 - R.right - G - M >= W) { x = R.right + G; y = midY(); }
    else if (R.left - G - M >= W) { x = R.left - G - W; y = midY(); }
    else { y = below >= above ? V.y + V.h - H - M : V.y + M; x = clampX(cx - W / 2); }
  }
  document.documentElement.classList.toggle("toast-top", y + H / 2 > V.y + V.h / 2);   // messages pop up away from Booky
  const flip = !!R && !mini && R.left + R.width / 2 > x + W * .62;     // Booky stands on the side nearer the button
  coach.classList.toggle("flip", flip);
  const prev = TOUR.pos, moved = prev ? Math.hypot(prev.x - x, prev.y - y) : 0;
  TOUR.pos = { x, y };
  if (first) coach.classList.add("notrans");
  coach.style.setProperty("--x", Math.round(x) + "px"); coach.style.setProperty("--y", Math.round(y) + "px");
  if (first) { void coach.offsetWidth; coach.classList.remove("notrans"); }
  if (moved > 40 && !reduced()) bkMood(bk, "walk", 640);
  const mw = bk.offsetWidth, mh = bk.offsetHeight;
  const spot = { left: flip ? x + W - mw : x, top: y + H - mh + 6, width: mw, height: mh };
  if (R && !mini) bkPointAt(bk, spot, R.left + R.width / 2, R.top + R.height / 2); else bkPointAt(bk, spot, null);
}

/* ---------- text with a typing effect (Booky talks while it types) ---------- */
function tourFill(s) {
  const key = typeof s.text === "function" ? s.text() : s.text;
  const more = s.more ? s.more() : "";
  const tx = $("tb-text");
  tx.style.minHeight = "";
  tx.innerHTML = inline(t(key)) + (more ? " " + inline(t(more)) : "");
  const exHTML = s.extra ? s.extra() : "";
  $("tb-extra").hidden = !exHTML; $("tb-extra").innerHTML = exHTML;
  $("tb-ch").textContent = s.ch ? t(s.ch) : "";
  $("tb-do").hidden = !s.do; $("tb-do-t").textContent = t("tour_do");
  $("tb-next").hidden = !!s.do; $("tb-next").textContent = t(s.final ? "tour_finish" : "next");
  $("tb-skip").hidden = !s.do; $("tb-skip").textContent = t(s.skip || "tour_skip_step");
  $("tb-x").hidden = !!s.final; $("tb-x").setAttribute("aria-label", t("tour_end_x")); $("tb-x").title = t("tour_end_x");
  $("tb-bar").style.width = Math.round((TOUR.i + 1) / TOUR.steps.length * 100) + "%";
  $("tb-sr").textContent = tx.textContent;
}
function tourType() {
  tourStopType();
  const box = $("tb-text"), bk = TOUR.bk;
  if (reduced()) return;
  const nodes = [], w = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
  let n; while ((n = w.nextNode())) nodes.push([n, n.nodeValue]);
  const total = nodes.reduce((a, x) => a + x[1].length, 0); if (!total) return;
  box.style.minHeight = box.offsetHeight + "px";
  nodes.forEach(x => { x[0].nodeValue = ""; });
  const per = Math.max(6, Math.min(16, 1500 / total)), t0 = performance.now();
  TOUR.typeNodes = nodes; bk.classList.add("talk");
  const step = () => {
    let k = Math.floor((performance.now() - t0) / per);
    if (k >= total) return tourStopType();
    for (const [nd, full] of nodes) { nd.nodeValue = full.slice(0, Math.max(0, Math.min(full.length, k))); k -= full.length; }
    TOUR.typing = requestAnimationFrame(step);
  };
  TOUR.typing = requestAnimationFrame(step);
}
function tourStopType() {
  if (TOUR.typing) cancelAnimationFrame(TOUR.typing);
  TOUR.typing = 0;
  if (TOUR.typeNodes) TOUR.typeNodes.forEach(([nd, full]) => { nd.nodeValue = full; });
  TOUR.typeNodes = null;
  if (TOUR.bk) TOUR.bk.classList.remove("talk");
}

/* ---------- moving between steps ---------- */
async function tourGo(i, how) {
  if (!TOUR.on || TOUR.busy) return;
  TOUR.busy = true;
  const prev = TOUR.step, bk = TOUR.bk, bubble = $("tour-bubble");
  try {
    tourStopType();
    bubble.classList.add("swap");
    bk.classList.remove("oops");
    if (how === "next" || how === "skip") bkReact(bk, TOUR_REACT[TOUR.react++ % TOUR_REACT.length]);
    else if (how === "do") { bkReact(bk, "bounce"); bkMood(bk, "happy", 900); }
    else if (how === "lost") bkMood(bk, "oops", 700);
    if (prev && how === "next" && prev.leave) { tourRehost(document.body); prev.leave(); }
    if (prev && prev.onLeave) prev.onLeave();
    const r = tourResolve(i);
    if (!r) { TOUR.busy = false; tourEnd(true); return; }
    const s = r.s;
    if (!s.ctx) tourCloseStray();
    if (s.ctx === "trainer") { for (const id of Object.values(TOUR_DLG)) if (tourOpen(id)) closeDlg($(id)); }
    if (TOUR_DLG[s.ctx] && (!prev || prev.ctx !== s.ctx)) await sleep(reduced() ? 0 : 430);   // the window finishes opening
    else await sleep(reduced() ? 0 : how === "start" ? 60 : 200);
    if (!TOUR.on) return;
    tourRehost(TOUR_DLG[s.ctx] ? $(TOUR_DLG[s.ctx]) : document.body);
    TOUR.i = r.i; TOUR.step = s; TOUR.sig = "";
    if (s.enter) s.enter();
    TOUR.armed = s.do ? !s.do() : false;
    tourFill(s);
    const els = tourEls(s);
    if (els.length) await tourScrollTo(els);
    if (!TOUR.on) return;
    tourLayout(how === "start");
    TOUR.sig = tourSig();
    await sleep(reduced() ? 0 : how === "start" ? 380 : 260);
    if (!TOUR.on) return;
    bubble.classList.remove("swap");
    tourType();
    if (s.hello) bkMood(bk, "wave", 2200);
    if (s.final) { bkMood(bk, "cheer", 1300); bkMood(bk, "happy", 1800); tourConfetti(); sfx("done"); }
    if (!s.do) { const nb = $("tb-next"); if (nb && !nb.hidden) nb.focus({ preventScroll: true }); }
  } finally { TOUR.busy = false; }
}
function tourTick() {
  if (!TOUR.on) return;
  TOUR.raf = requestAnimationFrame(tourTick);
  const s = TOUR.step; if (!s || TOUR.busy) return;
  if (s.do) {
    const v = !!s.do();
    if (!v) TOUR.armed = true;
    else if (TOUR.armed) { TOUR.armed = false; tourGo(TOUR.i + 1, "do"); return; }
  }
  if (s.ctx && !tourCtxOk(s.ctx)) { tourGo(tourSkipBlock(), "lost"); return; }
  const sig = tourSig();
  if (sig !== TOUR.sig) { TOUR.sig = sig; tourLayout(false); }
}
function tourNext() {
  if (!TOUR.on || TOUR.busy) return;
  if (TOUR.step && TOUR.step.final) return tourFinish();
  tourGo(TOUR.i + 1, "next");
}
function tourSkip() {
  if (!TOUR.on || TOUR.busy) return;
  const s = TOUR.step;
  if (s && s.onSkip) { tourRehost(document.body); s.onSkip(); }
  tourGo(s && s.ctx ? tourSkipBlock() : TOUR.i + 1, "skip");
}
function tourNudge() {                                        // a tap outside the spotlight: Booky shakes its head
  const b = $("tour-bubble"); if (!b) return;
  b.classList.remove("nudge"); void b.offsetWidth; b.classList.add("nudge");
  bkReact(TOUR.bk, "shake", 500); bkMood(TOUR.bk, "oops", 700);
}
function tourKey(e) {
  if (!TOUR.on) return;
  if (e.key === "Escape") { e.preventDefault(); e.stopImmediatePropagation(); tourEnd(false); return; }
  if (e.key === "Enter" && !(TOUR.step && TOUR.step.do) && (document.activeElement === document.body || !document.activeElement)) { e.preventDefault(); tourNext(); }
}
function tourConfetti() {
  if (reduced()) return;
  const box = document.createElement("div"); box.className = "tour-confetti";
  const colors = ["#4f7cff", "#a46bff", "#ef5a4c", "#f5cf6a", "#3ec98a", "#ff8fa3"];
  for (let i = 0; i < 72; i++) {
    const c = document.createElement("i");
    c.style.left = (Math.random() * 100).toFixed(1) + "%"; c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * .5).toFixed(2) + "s";
    c.style.setProperty("--dx", Math.round(Math.random() * 220 - 110) + "px"); c.style.setProperty("--r", Math.round(Math.random() * 900 - 450) + "deg");
    if (i % 3 === 0) { c.style.width = "7px"; c.style.height = "7px"; c.style.borderRadius = "50%"; }
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3800);
}

/* ---------- start and end ---------- */
async function tourStart() {
  if (TOUR.on || !store.prefs.onboarded) return;
  clearTimeout(TOUR.offerT);
  const o = $("tour-offer"); if (o) o.remove();
  tourCloseStray();
  if (!state.dict) { openDict(DICTS[window.VOKAB_DEFAULT] ? window.VOKAB_DEFAULT : (countActive("en") > countActive("cs") ? "en" : "cs"), true); await sleep(reduced() ? 0 : 350); }
  if (state.selecting) toggleSelect(false);
  if (state.view !== "active") setView("active");
  if ($("q").value) { $("q").value = ""; render(); }
  if (state.hide) setHide(0);
  scrollTo({ top: 0 });
  Object.assign(TOUR, { steps: tourSteps(), i: -1, step: null, pos: null, react: 0, sig: "", armed: false, on: true });
  const L = TOUR.layer || (TOUR.layer = tourBuild());
  document.body.appendChild(L);
  TOUR.bk = L.querySelector(".tour-coach .booky");
  const coach = L.querySelector(".tour-coach");
  coach.classList.remove("mini", "flip"); coach.classList.add("enter"); setTimeout(() => coach.classList.remove("enter"), 1100);
  void L.offsetWidth; L.classList.add("on");
  TOUR.mo = new MutationObserver(() => {                      // a window starts closing: step out of it before it fades away
    const h = TOUR.layer && TOUR.layer.parentNode;
    if (h && h.tagName === "DIALOG" && (!h.open || h.classList.contains("closing"))) tourRehost(document.body);
  });
  for (const id of Object.values(TOUR_DLG)) TOUR.mo.observe($(id), { attributes: true, attributeFilter: ["open", "class"] });
  document.addEventListener("keydown", tourKey, true);
  bkBlinkLoop();
  TOUR.raf = requestAnimationFrame(tourTick);
  await tourGo(0, "start");
}
function tourFinish() {
  bkMood(TOUR.bk, "wave", 1200); sfx("success");
  setTimeout(() => tourEnd(true), reduced() ? 0 : 450);
}
function tourEnd(done) {
  if (!TOUR.on) return;
  TOUR.on = false; cancelAnimationFrame(TOUR.raf); tourStopType();
  document.documentElement.classList.remove("toast-top");
  document.removeEventListener("keydown", tourKey, true);
  if (TOUR.mo) { TOUR.mo.disconnect(); TOUR.mo = null; }
  const s = TOUR.step; if (s && s.onLeave) { try { s.onLeave(); } catch (_) {} }
  if (state.hide) setHide(0);
  store.prefs.tour = done ? "done" : "quit"; save();
  const L = TOUR.layer;
  if (L) {
    if (L.parentNode !== document.body) document.body.appendChild(L);
    L.classList.remove("on");
    setTimeout(() => { if (!TOUR.on) L.remove(); }, reduced() ? 0 : 380);
  }
  TOUR.step = null; TOUR.busy = false;
  if (!done) showToast(t("tour_quit"));
}

/* ---------- the first question, right after the very first setup ---------- */
function tourAfterOpen() {
  if (store.prefs.tour !== "offer" || TOUR.on || $("tour-offer")) return;
  if (navigator.webdriver && !window.__tourTest) return;      // automated tests start the tour themselves
  clearTimeout(TOUR.offerT);
  TOUR.offerT = setTimeout(tourOffer, reduced() ? 50 : 800);
}
function tourOffer() {
  if (store.prefs.tour !== "offer" || TOUR.on || $("tour-offer") || !state.dict) return;
  if (document.querySelector("dialog[open]") || !$("trainer").hidden) { TOUR.offerT = setTimeout(tourOffer, 900); return; }
  const o = document.createElement("div"); o.className = "tour-offer"; o.id = "tour-offer";
  o.innerHTML = `<div class="to-card" role="dialog" aria-modal="true" aria-labelledby="to-h">
<div class="booky big" id="to-bk">${bookyHTML()}</div>
<i class="to-spark s1">✦</i><i class="to-spark s2">✦</i><i class="to-spark s3">✧</i><i class="to-spark s4">✦</i>
<h2 id="to-h">${esc(t("tour_hi"))}</h2>
<p>${esc(t("tour_offer"))}</p>
<div class="to-btns"><button class="to-yes" type="button" id="to-yes">${esc(t("tour_yes"))}</button><button class="to-no" type="button" id="to-no">${esc(t("tour_no"))}</button></div>
<small>${esc(t("tour_later"))}</small></div>`;
  document.body.appendChild(o);
  sfx("open");
  const bk = $("to-bk");
  bkBlinkLoop();
  setTimeout(() => bkMood(bk, "wave", 2200), reduced() ? 0 : 1050);
  let answered = false;
  $("to-yes").addEventListener("click", () => {
    if (answered) return; answered = true;
    store.prefs.tour = "started"; save();
    bkReact(bk, "hop"); bkMood(bk, "happy", 900);
    tourCloseOffer(tourStart, 420);
  });
  $("to-no").addEventListener("click", () => {
    if (answered) return; answered = true;
    store.prefs.tour = "skip"; save();
    bkMood(bk, "wave", 1300);
    tourCloseOffer(() => showToast(t("tour_bye")), 700);
  });
  o.addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); $("to-no").click(); } });
  setTimeout(() => { const y = $("to-yes"); if (y) y.focus({ preventScroll: true }); }, reduced() ? 0 : 700);
}
function tourCloseOffer(then, delay) {
  const o = $("tour-offer"); if (!o) { if (then) then(); return; }
  setTimeout(() => {
    o.classList.add("out");
    setTimeout(() => { o.remove(); if (then) then(); }, reduced() ? 0 : 330);
  }, reduced() ? 0 : delay || 0);
}

/* ---------- take the tour again: Help and Settings → About ---------- */
$("help-tour-bk").innerHTML = bookyHTML();
$("help-tour").addEventListener("click", () => { if (!store.prefs.onboarded) return; closeDlg($("helpdlg")); setTimeout(tourStart, reduced() ? 0 : 240); });
$("set-tour").addEventListener("click", () => { closeDlg($("setdlg")); setTimeout(tourStart, reduced() ? 0 : 240); });
